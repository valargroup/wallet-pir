[package]
name = "node-rpc"
version = "0.1.0"
edition = "2021"
description = "The node JSON-RPC transport shared by the Enhance, Transparent and Receiver services: cookie auth, deadlines, bounded responses, typed singles and strict batches"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
