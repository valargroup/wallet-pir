[package]
name = "pir-control"
version = "0.1.0"
edition = "2021"
description = "Process identity, control-lease watchdog, admission and durable state files shared by the Enhance, Status, Transparent and Receiver PIR services"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"

[features]
# HTTP admission primitives; see `src/admission.rs`.
admission = ["dep:axum", "dep:tokio", "dep:pir-admission"]

[dependencies]
pir-admission = { package = "zakura-pir-admission", version = "=0.0.1-rc0", git = "https://github.com/zakura-core/wallet-libraries", rev = "dad2df94b1b2d4f87912b128b1927d6d1779d563", optional = true }
axum = { version = "0.7", optional = true }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
