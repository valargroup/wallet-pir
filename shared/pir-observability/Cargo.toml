[package]
name = "pir-observability"
version = "0.1.0"
edition = "2021"
description = "Metrics and tracing helpers shared by the PIR services"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"

[dependencies]
axum = "0.7"
http-body = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
