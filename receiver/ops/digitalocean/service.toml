# Receiver roles consumed by the shared operations registry.
[services.receiver]
root = "/opt/receiver-pir"
binary = "receiver-directory"
artifact_kinds = ["receiver-pir"]
self_check = ["--help"]
min_free_bytes = 1073741824
order = ["server"]
# The id of the installed NEAR key file, /etc/receiver-pir/near-<id>.env.
template_vars = ["NEAR_KEY"]

[services.receiver.roles.server]
unit = "receiver-pir.service"
mode = "template"
# Rendered from the coordinator's checkout, as every template role is.
template = "receiver-pir.service.in"
# The unit names the NEAR key file, so a drop-in must not supply another key.
owns_unit = true
health = "http://{listen}/v1/receiver/health"
# Health answers at once; `serving` stays null until the first publication.
ready = { field = "serving", nonempty = true }
ready_timeout = 300
