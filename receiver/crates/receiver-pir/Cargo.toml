[package]
name = "receiver-pir"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Private lookups for immutable Ironwood receiver publications"

[features]
server = ["dep:inspiring"]
http = ["dep:reqwest"]

[dependencies]
receiver-directory = { path = "../receiver-directory" }
ipir-sp = { version = "=0.1.0-rc.6", git = "https://github.com/valargroup/ipir-sp.git", tag = "v0.1.0-rc.6" }
inspiring = { git = "https://github.com/valargroup/ipir-sp.git", tag = "v0.1.0-rc.6", optional = true }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

[dev-dependencies]
hex = "0.4"
