[package]
name = "receiver-pir"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Private lookups for immutable Ironwood receiver publications"

[features]
# The evaluator, which scans the rows with ipir-sp as Transparent's workers do.
server = ["dep:ipir-sp"]

[dependencies]
hex = "0.4"
receiver-directory = { path = "../receiver-directory" }
ipir-sp = { version = "=0.1.0-rc.7", optional = true }
pir-native = { package = "zakura-pir-native", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "8ed1c44561995582febe0b9bd172e1c45014cf9b" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
rand_chacha = "0.3"

[[test]]
name = "golden"
required-features = ["server"]
