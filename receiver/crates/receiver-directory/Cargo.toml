[package]
name = "receiver-directory"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Publicly recoverable Ironwood receiver directory and private lookup records"

[features]
store = ["dep:rusqlite"]

[dependencies]
receiver-protocol = { package = "zakura-receiver-directory", version = "=0.0.1-rc0", git = "https://github.com/zakura-core/wallet-libraries", rev = "dad2df94b1b2d4f87912b128b1927d6d1779d563" }
# Pinned exactly, as in `transparent-filter`: the filter bytes are what every wallet
# tests, so the encoder may not move without revalidation.
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

[dev-dependencies]
orchard = { package = "zakura-orchard", version = "=3.0.0", default-features = false, features = ["zip32-addresses"] }
incrementalmerkletree = { version = "0.8", features = ["legacy-api"] }
hex = "0.4"
tempfile = "3"
