[package]
name = "receiver-directory"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Receiver directory publications: record placement, storage and structural parsing"

[features]
store = ["dep:rusqlite"]

[dependencies]
zakura-receiver-crypto = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "3990335d8e8821f31d2f2fd3686ffa8d13ddcfa9", default-features = false }
# Pinned exactly, as in `transparent-filter`: the filter bytes are what every wallet
# tests, so the encoder may not move without revalidation.
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

[dev-dependencies]
hex = "0.4"
tempfile = "3"
