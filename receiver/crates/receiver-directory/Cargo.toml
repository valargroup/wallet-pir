[package]
name = "receiver-directory"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Publicly recoverable Ironwood receiver directory and private lookup records"

[features]
store = ["dep:rusqlite"]

[dependencies]
incrementalmerkletree = "0.8"
orchard = { package = "zakura-orchard", version = "2", default-features = false }
zcash_note_encryption = "=0.4.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

[dev-dependencies]
incrementalmerkletree = { version = "0.8", features = ["legacy-api"] }
hex = "0.4"
tempfile = "3"

[[example]]
name = "witness_refresh"
required-features = ["store"]
