[package]
name = "receiver-directory"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Publicly recoverable Ironwood receiver directory and private lookup records"

[features]
store = ["dep:rusqlite"]

[dependencies]
orchard = { package = "zakura-orchard", version = "=1.0.1", default-features = false }
zcash_note_encryption = "=0.4.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[dev-dependencies]
hex = "0.4"
tempfile = "3"
