[package]
name = "receiver-indexer"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Indexes zero-OVK Ironwood payments from a Zakura node and publishes the receiver directory"

[[bin]]
name = "receiver-directory"
path = "src/main.rs"
# Its documentation would collide with the `receiver-directory` library's.
doc = false

[[bin]]
name = "receiver-probe"
path = "src/bin/receiver-probe.rs"

[dependencies]
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
receiver-directory = { package = "zakura-receiver-directory", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "0c110882ad6d36c9d3ad811903abdf37b13d35d5" }
receiver-pir = { package = "zakura-receiver-pir", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "0c110882ad6d36c9d3ad811903abdf37b13d35d5", features = ["server"] }
receiver-store = { path = "../../crates/receiver-store" }
receiver-pir-server = { path = "../receiver-pir-server" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Receiver address, record, recovery and proof checks, and the node reads and block
# interpretation, from one exact wallet-libraries revision.
zakura-receiver-crypto = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "0c110882ad6d36c9d3ad811903abdf37b13d35d5", default-features = false, features = ["crypto"] }
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "0c110882ad6d36c9d3ad811903abdf37b13d35d5" }

[dev-dependencies]
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "0c110882ad6d36c9d3ad811903abdf37b13d35d5", features = ["testing"] }
