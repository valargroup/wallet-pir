name: Rust build environment
description: Preinstalled tools and persistent targets on isolated runners; hosted cache fallback.
inputs:
  lane:
    description: Separate fast, full-test, lint, release and native build state
    required: true
  scope:
    description: Package and feature set this job compiles (see tools/ci/cargo_cache.py)
    required: true
  lookup-only:
    description: Check for an exact hosted entry without downloading it (main cache priming)
    required: false
    default: 'false'
outputs:
  cache-hit:
    description: An exact hosted entry exists for this compatibility identity
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Record setup start
      shell: bash
      run: echo "WALLET_PIR_SETUP_STARTED=$(date +%s.%N)" >> "$GITHUB_ENV"
    - name: Install hosted toolchain
      if: runner.environment != 'self-hosted' && env.WALLET_PIR_HOSTED_TOOLS_READY != '1'
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        components: rustfmt, clippy
    - name: Install hosted native dependencies
      if: runner.environment != 'self-hosted' && env.WALLET_PIR_HOSTED_TOOLS_READY != '1'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev protobuf-compiler
    - name: Remember hosted prerequisites
      if: runner.environment != 'self-hosted'
      shell: bash
      run: echo 'WALLET_PIR_HOSTED_TOOLS_READY=1' >> "$GITHUB_ENV"
    - name: Select persistent build directory
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        SCOPE: ${{ inputs.scope }}
      run: |
        set -euo pipefail
        # Match the production ABI (Ubuntu 24.04), including hosted fallback.
        # shellcheck disable=SC1091
        source /etc/os-release
        [[ "$ID" == ubuntu && "$VERSION_ID" == 24.04 ]]
        rustup run 1.97.1 rustc --version
        rustup run 1.97.1 rustfmt --version
        rustup run 1.97.1 cargo clippy --version
        for tool in clang protoc jq shellcheck; do command -v "$tool" >/dev/null; done
        echo 'RUSTUP_TOOLCHAIN=1.97.1' >> "$GITHUB_ENV"
        # Outside checkout, unique to runner slot, lane and toolchain identity
        # (actual compiler, OS/ABI, target, flags, Cargo configuration). PR
        # runners must be isolated from credentials and trusted release caches.
        RUSTUP_TOOLCHAIN=1.97.1 python3 tools/ci/cargo_cache.py prepare --lane "$LANE" --scope "$SCOPE" \
          --persistent-root "$HOME/.cache/wallet-pir/$RUNNER_NAME"
    - name: Identify hosted Cargo cache
      id: identity
      if: runner.environment != 'self-hosted'
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        SCOPE: ${{ inputs.scope }}
        LOOKUP_ONLY: ${{ inputs.lookup-only }}
        # Read-only lookup of which refs already hold the key; never printed.
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        args=(--lane "$LANE" --scope "$SCOPE" --target-dir "target/$LANE")
        [[ "$LOOKUP_ONLY" != true ]] || args+=(--lookup-only)
        python3 tools/ci/cargo_cache.py prepare "${args[@]}"
    # The key is only the compatibility identity: no checkout SHA, workflow
    # text or runtime-only variables. PR saves stay in the merge ref.
    - name: Restore hosted Cargo cache
      id: restore
      if: runner.environment != 'self-hosted'
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v1-wallet-pir
        shared-key: ${{ steps.identity.outputs.shared-key }}
        add-rust-environment-hash-key: 'false'
        workspaces: ". -> target/${{ inputs.lane }}"
        cache-workspace-crates: true
        cache-on-failure: true
        lookup-only: ${{ inputs.lookup-only }}
    - name: Record restored Cargo state
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: python3 tools/ci/cargo_cache.py restored --lane "$LANE" --cache-hit "$CACHE_HIT"
