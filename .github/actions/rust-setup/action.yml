name: Rust build environment
description: Preinstalled tools and persistent targets on isolated runners; hosted fallback.
inputs:
  lane:
    description: Separate fast, full-test, lint and release build state
    required: true
runs:
  using: composite
  steps:
    - name: Install hosted toolchain
      if: runner.environment != 'self-hosted'
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.91.0
        components: rustfmt, clippy
    - name: Install hosted native dependencies
      if: runner.environment != 'self-hosted'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev protobuf-compiler
    - name: Select persistent build directory
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
      run: |
        set -euo pipefail
        # Match the production ABI (Ubuntu 24.04), including hosted fallback.
        # shellcheck disable=SC1091
        source /etc/os-release
        [[ "$ID" == ubuntu && "$VERSION_ID" == 24.04 ]]
        rustup run 1.91.0 rustc --version
        rustup run 1.91.0 rustfmt --version
        rustup run 1.91.0 cargo clippy --version
        for tool in clang protoc jq shellcheck; do command -v "$tool" >/dev/null; done
        # Outside checkout, unique to runner slot and compilation inputs. PR
        # runners must be isolated from credentials and trusted release caches.
        fingerprint=$(printf '%s\n' '1.91.0' "$RUSTFLAGS" "${CFLAGS:-}" "${CXXFLAGS:-}" | sha256sum | cut -c1-16)
        target="$HOME/.cache/wallet-pir/$RUNNER_NAME/$LANE/$fingerprint"
        mkdir -p "$target"
        echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
        echo "WALLET_PIR_BUILD_CACHE_ROOT=$HOME/.cache/wallet-pir/$RUNNER_NAME" >> "$GITHUB_ENV"
        echo 'RUSTUP_TOOLCHAIN=1.91.0' >> "$GITHUB_ENV"
    - name: Restore hosted Cargo cache
      if: runner.environment != 'self-hosted'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.lane }}-v2
        cache-workspace-crates: true
        cache-on-failure: true
