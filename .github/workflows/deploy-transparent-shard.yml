name: Deploy transparent shard worker

# Stands up the transparent PIR shard retrieval worker.
#
# Separate from Deploy Enhance PIR on purpose. The two fleets share no state,
# and the Enhance deploy script carries the one-time legacy rollback path this
# repository's guidance protects; a transparent deploy must not be able to
# disturb it. Nothing here touches the Enhance coordinator, its units, its
# Caddyfile, or the filter service.
#
# The worker is not published. Its firewall opens 8093 to the coordinator tag
# alone, because the wallet-facing API is not designed yet. Verification runs
# from the runner, which is the coordinator, over the VPC.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA on main with a successful CI run
        required: true
        type: string
      shard_dir:
        description: >-
          Published shard set on the coordinator to ship. Must be a set of the
          schema this build serves; a set published under another schema is
          refused at load, after the service has already been stopped.
        required: true
        default: /srv/zakura/transparent-shards-v7
        type: string
      mode:
        description: >-
          Single-host modes preflight/deploy target TRANSPARENT_WORKER_HOST as
          before. fleet-* modes plan an assignment over TRANSPARENT_FLEET_JSON,
          ship each worker its subset, verify it with the staged binary, then
          activate owners, replicas and the router in that order.
        required: true
        default: preflight
        type: choice
        options: [preflight, deploy, fleet-preflight, fleet-deploy, fleet-router, fleet-rollback]
      recent_from:
        description: >-
          Fleet modes only. The recorded cutoff height; the shard beginning
          there starts the replicated recent tier. Must be a shard boundary.
        required: false
        default: ""
        type: string
      headroom:
        description: >-
          Fleet modes only. Fraction of each worker's cache kept free of
          assigned runtimes when planning.
        required: false
        default: "0.15"
        type: string
      owner_activation:
        description: >-
          Fleet modes only. serial keeps one archive owner serving while the
          other restarts; parallel activates both at once, halving a cold
          start at the cost of the whole archive being out until warm.
        required: false
        default: serial
        type: choice
        options: [serial, parallel]
      replica_activation:
        description: Recent replicas in healthy pairs, or one at a time
        required: false
        default: paired
        type: choice
        options: [paired, serial]
      force_redeploy:
        description: Stage, verify and restart even matching healthy workers
        required: false
        default: false
        type: boolean
      canary_worker_ids:
        description: Optional comma-separated worker IDs; requires unchanged publication and routing
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: transparent-shard-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.mode }} transparent shard worker
    runs-on: [self-hosted, Linux, X64, wallet-pir-deploy]
    timeout-minutes: 60
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          api_headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          # On main, not necessarily its head: a later push must not make a
          # tested commit undeployable, or two people pushing keeps the fleet
          # waiting on a CI run that never gets to stand. "identical" and
          # "behind" are the compare statuses of an ancestor.
          status="$(curl --fail --silent --show-error "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" | jq -er '.status')"
          [[ "$status" == "identical" || "$status" == "behind" ]] \
            || { echo "$SHA is not on main (compare status: $status)"; exit 1; }
          successful="$(curl --fail --silent --show-error "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci-full.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            | jq -er '.workflow_runs | length')"
          [[ "$successful" -ge 1 ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Locate qualified release artifact
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref }}
        run: python3 tools/ci/release.py resolve --sha "$SHA" --kind transparent-shard
      - name: Clear previous artifact download
        run: rm -rf "$RUNNER_TEMP/qualified-transparent-shard"
      - uses: actions/download-artifact@v4
        with:
          name: transparent-shard-${{ inputs.ref }}
          run-id: ${{ steps.release.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualified-transparent-shard
      - name: Verify and unpack release artifact
        env:
          SHA: ${{ inputs.ref }}
        run: >-
          python3 tools/ci/release.py extract --sha "$SHA" --kind transparent-shard
          --archive "$RUNNER_TEMP/qualified-transparent-shard/transparent-shard.tar.gz" --output artifact

      # The assignment is planned here, on the runner that holds the set, and
      # kept with the artifact: it is the durable record of which worker was
      # meant to hold what, and its digest is what every worker reports.
      - name: Plan the fleet assignment
        if: startsWith(inputs.mode, 'fleet-')
        env:
          FLEET_JSON: ${{ vars.TRANSPARENT_FLEET_JSON }}
          SHARD_DIR: ${{ inputs.shard_dir }}
          RECENT_FROM: ${{ inputs.recent_from }}
          HEADROOM: ${{ inputs.headroom }}
          SHA: ${{ inputs.ref }}
          PUBLIC_URL: ${{ vars.TRANSPARENT_PUBLIC_URL }}
        run: |
          set -euo pipefail
          : "${FLEET_JSON:?TRANSPARENT_FLEET_JSON is empty; set the roster variable}"
          [[ "$RECENT_FROM" =~ ^[0-9]+$ ]] || { echo "recent_from must be the recorded cutoff height"; exit 1; }
          [[ "$HEADROOM" =~ ^0\.[0-9]+$ ]] || { echo "headroom must be a fraction like 0.15"; exit 1; }
          printf '%s\n' "$FLEET_JSON" >artifact/roster.json
          jq -e 'type == "array" and length > 0' artifact/roster.json >/dev/null
          sudo artifact/shard-assign plan \
            --shard-dir "$SHARD_DIR" --roster artifact/roster.json \
            --recent-from-height "$RECENT_FROM" --headroom "$HEADROOM" \
            --out-assignment artifact/assignment.json \
            --out-caddyfile artifact/Caddyfile.router --public-host "${PUBLIC_URL#https://}" \
            --source-sha "$SHA"
          sudo chown "$(id -u)" artifact/assignment.json artifact/Caddyfile.router
          (cd artifact && rm -f SHA256SUMS && sha256sum ./* >SHA256SUMS)
          {
            echo '## Fleet assignment'
            echo '```'
            jq -r '.workers[] | "\(.id)\t\(.role)\t\(.shards | length) shards\t\(.estimated_resident_bytes) bytes reserved"' artifact/assignment.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: transparent-shard-${{ inputs.ref }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare ephemeral SSH material
        env:
          DEPLOY_SSH_KEY: ${{ secrets.WALLET_PIR_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.TRANSPARENT_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?production deployment SSH key is empty}"
          : "${KNOWN_HOSTS:?TRANSPARENT_SSH_KNOWN_HOSTS is empty; add the worker host key}"
          install -m 0700 -d "$RUNNER_TEMP/transparent-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$RUNNER_TEMP/transparent-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" >"$RUNNER_TEMP/transparent-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/transparent-ssh/key" "$RUNNER_TEMP/transparent-ssh/known_hosts"

      - name: Deploy and verify
        env:
          TRANSPARENT_WORKER_HOST: ${{ vars.TRANSPARENT_WORKER_HOST }}
          WALLET_PIR_DEPLOY_USER: ${{ vars.WALLET_PIR_DEPLOY_USER }}
          TRANSPARENT_RELEASE_SHA: ${{ inputs.ref }}
          TRANSPARENT_ARTIFACT_DIR: ${{ github.workspace }}/artifact
          TRANSPARENT_SHARD_SOURCE: ${{ inputs.shard_dir }}
          # The parent of the per-publication set directories, not a set
          # itself. Deliberately not /srv/transparent-pir/shards: that is the
          # flat directory the pre-versioning deploys wrote into and the
          # currently running service still reads, and nesting a new set inside
          # it would make ShardSet::open trip over the nested directory on the
          # next restart of the old binary.
          TRANSPARENT_SHARD_DIR: /srv/transparent-pir/sets
          TRANSPARENT_PUBLIC_URL: ${{ vars.TRANSPARENT_PUBLIC_URL }}
          TRANSPARENT_SSH_KEY_PATH: ${{ runner.temp }}/transparent-ssh/key
          TRANSPARENT_KNOWN_HOSTS_PATH: ${{ runner.temp }}/transparent-ssh/known_hosts
          # Fleet modes. The roster is a repository variable so the hosts live
          # in one place; the router is optional until it exists.
          TRANSPARENT_FLEET_JSON: ${{ vars.TRANSPARENT_FLEET_JSON }}
          TRANSPARENT_ROUTER_HOST: ${{ vars.TRANSPARENT_ROUTER_HOST }}
          TRANSPARENT_ROUTER_INTERNAL_PORT: "8080"
          TRANSPARENT_OWNER_ACTIVATION: ${{ inputs.owner_activation }}
          TRANSPARENT_REPLICA_ACTIVATION: ${{ inputs.replica_activation }}
          TRANSPARENT_FORCE_REDEPLOY: ${{ inputs.force_redeploy }}
          TRANSPARENT_CANARY_WORKER_IDS: ${{ inputs.canary_worker_ids }}
          TRANSPARENT_ASSIGNMENT: ${{ github.workspace }}/artifact/assignment.json
        run: transparent/ops/scripts/deploy-transparent-shard.sh '${{ inputs.mode }}'

      - name: Preserve deployment decisions and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transparent-deploy-report-${{ github.run_id }}
          path: |
            artifact/deploy-plan.json
            artifact/deploy-timings.tsv
          if-no-files-found: ignore

      - name: Remove SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/transparent-ssh"

      - name: Report queue and stage timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/timings.py --run "$GITHUB_RUN_ID"
