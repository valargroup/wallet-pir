name: Verify Wallet PIR infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify production control plane
    runs-on: [self-hosted, Linux, X64, wallet-pir-deploy]
    timeout-minutes: 15
    environment: production
    steps:
      - name: Verify renamed runner and coordinator configuration
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == wallet-pir-coordinator ]]
          test -x /opt/enhance-pir/ops/wallet-pir-runtime.py
          test -x /opt/enhance-pir/ops/wallet-pir-terraform.sh
          if grep -Eq '^(coordinator_dns_ipv4|project_id|coordinator_size|worker_size)[[:space:]]*=' \
            /etc/enhance-pir/production.tfvars; then
            exit 1
          fi
          if [[ -f /etc/enhance-pir/autoscale.json ]]; then
            if grep -q '/run/lock/enhance-production.lock' /etc/enhance-pir/autoscale.json; then
              exit 1
            fi
          fi
          systemctl is-active --quiet enhance-autoscale.timer

      - name: Verify zero Terraform drift through the installed wrapper
        run: |
          set -euo pipefail
          sudo /opt/enhance-pir/ops/wallet-pir-terraform.sh \
            plan -input=false -lock-timeout=60s -detailed-exitcode

      - name: Verify public services
        env:
          ENHANCE_PUBLIC_URL: ${{ vars.ENHANCE_PUBLIC_URL }}
          TRANSPARENT_PUBLIC_URL: ${{ vars.TRANSPARENT_PUBLIC_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "$ENHANCE_PUBLIC_URL/v1/health" >/dev/null
          curl --fail --silent --show-error --max-time 15 "$TRANSPARENT_PUBLIC_URL/v1/filters/shards" >/dev/null
