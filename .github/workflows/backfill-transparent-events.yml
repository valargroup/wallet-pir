name: Backfill transparent events

# Builds `transparent-event-ingest` and runs it on the coordinator, beside the
# Zakura archive node whose RPC it needs. The node's RPC is loopback-only, so
# there is nowhere else this can run.
#
# What this does not touch: the filter service's data directory, the Enhance
# coordinator's journal, and any systemd unit either of them owns. The backfill
# writes one directory of its own and reads Zakura read-only. It is deliberately
# not part of the deploy workflow — it installs no service, changes no unit, and
# has no rollback path to preserve, because there is nothing to roll back.
#
# It runs as a transient systemd unit so it survives the SSH session that starts
# it, and at a reduced CPU weight so the live PIR coordinator keeps priority on
# a host they share.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        default: status
        type: choice
        options: [start, status, stop, census, publish, measure]
      ref:
        description: Full commit SHA on main to build (required for start)
        required: false
        type: string
      start_height:
        description: First height to index
        required: false
        default: "3428143"
        type: string
      cache_outputs:
        description: >-
          Start only. Outputs held in the previous-output cache; blank uses the
          binary's default. Resolving previous outputs is the backfill's
          dominant cost, so this trades resident memory for RPC round trips. A
          transaction-bounded cache was once OOM-killed over the early chain, so
          dial this down rather than up on a host that is short of memory.
        required: false
        default: ""
        type: string
      stop_height:
        description: Last height to index; blank means the node's tip
        required: false
        default: ""
        type: string
      data_dir:
        description: >-
          The event journal to read or write; blank means the default. A
          journal is pinned to the height it started at, so a run covering a
          different range must use a directory of its own rather than set the
          existing journal aside.
        required: false
        default: ""
        type: string
      unpacked:
        description: >-
          Census only. Close shards on a row per fragment, as the layout did
          before short histories shared rows. Reports what the journal would
          have cost unpacked; a set must not be published this way.
        required: false
        default: false
        type: boolean
      page_rows_per_segment:
        description: >-
          Census only. Score segment counts and pinned bytes against this many
          page rows per segment instead of the compiled value. Reporting only.
        required: false
        default: ""
        type: string
      directory_rows_per_segment:
        description: >-
          Census only. Score against this many directory rows per segment
          instead of the compiled value. Reporting only. The scheme pads a row
          count up to a multiple of 2,048 and refuses fewer, so the compiled
          2,048 is its floor and this can only go up.
        required: false
        default: ""
        type: string
      inline_events:
        description: >-
          Census only. Score against this many events carried inline in a
          directory entry. Unlike the other overrides this moves the
          boundaries themselves, because the allowance decides whether a
          history reaches the page table at all.
        required: false
        default: ""
        type: string
      placement:
        description: >-
          Census only. Run the builder's real two-choice placer over each
          shard's scripts instead of modelling placement as scripts / slots,
          and report how much headroom the fullest row has left.
        required: false
        default: false
        type: boolean
      shard_matches:
        description: >-
          Census only. Count how many shards each exact script appears in, by
          external sort, and report the 2g directory queries that implies. The
          runs are spilled under the runner's work directory and removed once
          merged.
        required: false
        default: false
        type: boolean
      policies:
        description: >-
          Census only. Semicolon-separated seal policies, each
          `scripts_target:scripts_cap,pages_target:pages_cap`. Blank uses the
          default sweep.
        required: false
        default: ""
        type: string
      shard_dir:
        description: >-
          Where publish writes and measure reads; blank means the default set.
          A shard set is published under one manifest schema, so a build that
          changes the schema must publish into a directory of its own rather
          than beside a set the loader will refuse to mix with.
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Serialized against itself but not against a deploy: this holds no lock a
# deploy wants, and a deploy restarting the filter service does not disturb it.
concurrency:
  group: transparent-event-backfill
  cancel-in-progress: false

env:
  UNIT: transparent-event-ingest
  DATA_DIR: /srv/zakura/transparent-event-data
  BIN: /usr/local/bin/transparent-event-ingest
  SHARD_DIR: /srv/zakura/transparent-shards

jobs:
  backfill:
    name: ${{ inputs.action }} transparent event backfill
    runs-on: [self-hosted, Linux, X64, enhance-pir-deploy]
    timeout-minutes: 120
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action }}
          SHA: ${{ inputs.ref }}
          START: ${{ inputs.start_height }}
          STOP: ${{ inputs.stop_height }}
          PAGE_ROWS: ${{ inputs.page_rows_per_segment }}
          POLICIES: ${{ inputs.policies }}
        run: |
          set -euo pipefail
          if [[ "$ACTION" == "start" ]]; then
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "start needs a full commit SHA"; exit 1; }
            [[ "$START" =~ ^[0-9]+$ ]] || { echo "start_height must be a number"; exit 1; }
            [[ -z "$STOP" || "$STOP" =~ ^[0-9]+$ ]] || { echo "stop_height must be a number or blank"; exit 1; }
          fi
          # These become arguments to a command run under sudo, so they are
          # matched against exactly the shape the census accepts rather than
          # passed through and left to the parser.
          [[ -z "$PAGE_ROWS" || "$PAGE_ROWS" =~ ^[0-9]+$ ]] \
            || { echo "page_rows_per_segment must be a number or blank"; exit 1; }
          [[ -z "$POLICIES" || "$POLICIES" =~ ^[0-9]+:[0-9]+,[0-9]+:[0-9]+(\;[0-9]+:[0-9]+,[0-9]+:[0-9]+)*$ ]] \
            || { echo "policies must be target:cap,target:cap, semicolon separated"; exit 1; }

      - uses: actions/checkout@v4
        if: inputs.action == 'start' || inputs.action == 'census' || inputs.action == 'publish' || inputs.action == 'measure'
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.action == 'start' || inputs.action == 'census' || inputs.action == 'publish' || inputs.action == 'measure'
        with:
          toolchain: 1.91.0

      - name: Build the ingest binary
        if: inputs.action == 'start'
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          set -euo pipefail
          cargo build --locked --release -p transparent-filter-server --bin transparent-event-ingest
          sha256sum target/release/transparent-event-ingest

      - name: Build and run the shard census
        if: inputs.action == 'census'
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          DATA_DIR_INPUT: ${{ inputs.data_dir }}
          UNPACKED: ${{ inputs.unpacked }}
          PAGE_ROWS: ${{ inputs.page_rows_per_segment }}
          DIR_ROWS: ${{ inputs.directory_rows_per_segment }}
          INLINE_EVENTS: ${{ inputs.inline_events }}
          PLACEMENT: ${{ inputs.placement }}
          SHARD_MATCHES: ${{ inputs.shard_matches }}
          POLICIES: ${{ inputs.policies }}
        run: |
          set -euo pipefail
          cargo build --locked --release -p transparent-filter-server --bin shard-census
          ARGS=()
          [[ "$UNPACKED" == "true" ]] && ARGS+=(--unpacked)
          [[ -n "$PAGE_ROWS" ]] && ARGS+=(--page-rows-per-segment "$PAGE_ROWS")
          [[ -n "$DIR_ROWS" ]] && ARGS+=(--directory-rows-per-segment "$DIR_ROWS")
          [[ -n "$INLINE_EVENTS" ]] && ARGS+=(--inline-events "$INLINE_EVENTS")
          [[ "$PLACEMENT" == "true" ]] && ARGS+=(--placement)
          # Spilled under the runner temp so the job reclaims it, and away from
          # the journal rather than inside it: the census must not write into
          # the thing it was asked to measure.
          if [[ "$SHARD_MATCHES" == "true" ]]; then
            ARGS+=(--shard-matches "$RUNNER_TEMP/shard-matches")
          fi
          if [[ -n "$POLICIES" ]]; then
            IFS=';' read -ra LIST <<<"$POLICIES"
            for one in "${LIST[@]}"; do ARGS+=(--policy "$one"); done
          fi
          # Read-only against the journal. It streams the journal once and
          # feeds every candidate policy from that one pass, so peak memory is
          # one block plus per-policy sealer state rather than the whole
          # journal. Run on the runner rather than staged, since the runner is
          # the coordinator and the journal is local to it.
          #
          # Timed because peak resident memory is a reported figure, and a
          # census that has to hold the journal is the thing that would stop a
          # full-journal run. Measure it rather than assert it.
          # GNU time is not installed everywhere, and a missing accounting tool
          # must not be what stops a census.
          TIMED=()
          if [[ -x /usr/bin/time ]]; then TIMED=(/usr/bin/time -v); fi
          : >census-time.txt
          sudo "${TIMED[@]}" ./target/release/shard-census \
            --data-dir "${DATA_DIR_INPUT:-$DATA_DIR}" "${ARGS[@]}" 2>census-time.txt | tee census.txt
          grep -E 'Maximum resident|Elapsed' census-time.txt || echo 'no resource accounting'
          {
            echo '## Shard census'
            echo '```'
            cat census.txt
            echo '```'
            echo '### Resources'
            echo '```'
            grep -E 'Maximum resident|Elapsed \(wall' census-time.txt || echo 'no resource accounting'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Build and run the shard publisher
        if: inputs.action == 'publish'
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          SHARD_DIR_INPUT: ${{ inputs.shard_dir }}
          DATA_DIR_INPUT: ${{ inputs.data_dir }}
        run: |
          set -euo pipefail
          # The ingester shares this host and is the thing that must not be
          # disturbed. It runs under a reduced CPUWeight, so an unniced build
          # here would outrank it; since the state-backed reader landed it is
          # CPU- and IO-bound on local RocksDB rather than waiting on RPC, so
          # contention now costs real blocks per second. Both the build and the
          # publish yield: lowest CPU priority, idle IO class.
          NICE=(nice -n 19)
          if command -v ionice >/dev/null; then NICE+=(ionice -c3); fi
          "${NICE[@]}" cargo build --locked --release -p transparent-filter-server --bin shard-publish
          OUT="${SHARD_DIR_INPUT:-$SHARD_DIR}"
          # A shard set is a few gigabytes, and a second one beside it is a
          # second few. Say what is free before writing rather than after.
          df -h "$(dirname "$OUT")"
          # Read-only against the journal; writes only its own output directory.
          # Publication is immutable, so re-running verifies rather than
          # rewrites and a changed byte is a hard error.
          sudo "${NICE[@]}" ./target/release/shard-publish \
            --data-dir "${DATA_DIR_INPUT:-$DATA_DIR}" \
            --output "$OUT" \
            --zakura-cookie /root/.cache/zakura/.cookie 2>&1 | tee publish.txt
          echo
          sudo du -sh "$OUT"
          {
            echo '## Shard publication'
            echo '```'
            tail -40 publish.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Build and run the measurement
        if: inputs.action == 'measure'
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          SHARD_DIR_INPUT: ${{ inputs.shard_dir }}
          DATA_DIR_INPUT: ${{ inputs.data_dir }}
        run: |
          set -euo pipefail
          cargo build --locked --release -p transparent-measure
          # Read-only against both the journal and the published shards. It
          # serves the set in-process on a loopback port, so it disturbs no
          # running service.
          sudo ./target/release/transparent-measure \
            --data-dir "${DATA_DIR_INPUT:-$DATA_DIR}" \
            --shard-dir "${SHARD_DIR_INPUT:-$SHARD_DIR}" \
            --json-out measurement.json 2>&1 | tee measure.txt
          {
            echo '## Transparent recovery measurement'
            echo '```'
            cat measure.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: inputs.action == 'measure'
        with:
          name: transparent-measurement
          path: measurement.json
          if-no-files-found: warn

      - name: Prepare ephemeral SSH material
        env:
          DEPLOY_SSH_KEY: ${{ secrets.ENHANCE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.ENHANCE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?production deployment SSH key is empty}"
          install -m 0700 -d "$RUNNER_TEMP/backfill-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$RUNNER_TEMP/backfill-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" >"$RUNNER_TEMP/backfill-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/backfill-ssh/key" "$RUNNER_TEMP/backfill-ssh/known_hosts"

      - name: Stage the binary
        if: inputs.action == 'start'
        env:
          HOST: ${{ vars.ENHANCE_COORDINATOR_HOST }}
          USER_NAME: ${{ vars.ENHANCE_DEPLOY_USER }}
          SHA: ${{ inputs.ref }}
          DATA_DIR_INPUT: ${{ inputs.data_dir }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/backfill-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/backfill-ssh/known_hosts"
            -o ConnectTimeout=10)
          SCP=(scp -q -i "$RUNNER_TEMP/backfill-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/backfill-ssh/known_hosts"
            -o ConnectTimeout=10)

          # Refuse to replace the binary underneath a run that is still going.
          # Overwriting it would not stop the running process, but it would make
          # the journal's provenance a lie.
          "${SSH[@]}" "$USER_NAME@$HOST" bash -s -- "$UNIT" <<'REMOTE'
          set -euo pipefail
          unit="$1"
          if systemctl is-active --quiet "$unit"; then
            echo "$unit is already running; stop it before starting a new one" >&2
            exit 1
          fi
          REMOTE

          "${SCP[@]}" target/release/transparent-event-ingest "$USER_NAME@$HOST:/tmp/transparent-event-ingest.$SHA"
          "${SSH[@]}" "$USER_NAME@$HOST" bash -s -- "/tmp/transparent-event-ingest.$SHA" "$BIN" "${DATA_DIR_INPUT:-$DATA_DIR}" <<'REMOTE'
          set -euo pipefail
          staged="$1"; target="$2"; data_dir="$3"
          sudo install -m 0755 "$staged" "$target"
          rm -f "$staged"
          sudo mkdir -p "$data_dir"
          df -h "$(dirname "$data_dir")"
          REMOTE

      - name: Start the backfill
        if: inputs.action == 'start'
        env:
          HOST: ${{ vars.ENHANCE_COORDINATOR_HOST }}
          USER_NAME: ${{ vars.ENHANCE_DEPLOY_USER }}
          START: ${{ inputs.start_height }}
          STOP: ${{ inputs.stop_height }}
          CACHE: ${{ inputs.cache_outputs }}
          DATA_DIR_INPUT: ${{ inputs.data_dir }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/backfill-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/backfill-ssh/known_hosts"
            -o ConnectTimeout=10)
          "${SSH[@]}" "$USER_NAME@$HOST" bash -s -- "$UNIT" "$BIN" "${DATA_DIR_INPUT:-$DATA_DIR}" "$START" "$STOP" "$CACHE" <<'REMOTE'
          set -euo pipefail
          # `stop` is optional, and ssh re-splits the remote command, so an
          # empty trailing argument does not survive as an empty positional —
          # it simply is not there. Defaulting rather than indexing is what
          # keeps `set -u` from killing the script before anything runs.
          unit="$1"; bin="$2"; data_dir="$3"; start="$4"; stop="${5:-}"; cache="${6:-}"

          # A journal is pinned to the height it started at, and opening it
          # under a different one sets the whole thing aside and begins again.
          # Resuming a long backfill with this input left at its default would
          # therefore discard it silently — days of work, and no error. So the
          # existing journal, if there is one, decides.
          meta="$data_dir/meta.json"
          if [[ -f "$meta" ]]; then
            pinned=$(sudo sed -n 's/.*"start_height":[[:space:]]*\([0-9]*\).*/\1/p' "$meta")
            if [[ -n "$pinned" && "$pinned" != "$start" ]]; then
              echo "journal at $data_dir is pinned to start height $pinned, not $start;" >&2
              echo "resuming it needs start_height=$pinned, and a fresh journal needs its own data_dir" >&2
              exit 1
            fi
          fi

          args=(--data-dir "$data_dir"
                --zakura-rpc-url http://127.0.0.1:8232
                --zakura-cookie /root/.cache/zakura/.cookie
                --start-height "$start")
          if [[ -n "$stop" ]]; then args+=(--stop-height "$stop"); fi
          if [[ -n "$cache" ]]; then args+=(--cache-outputs "$cache"); fi

          # A transient unit that failed stays loaded in the failed state and
          # would make systemd-run refuse the name. The earlier is-active check
          # already refused to disturb a *running* backfill, so anything left
          # here is finished and only its bookkeeping remains.
          sudo systemctl reset-failed "$unit" 2>/dev/null || true

          # A transient unit rather than nohup: it survives this SSH session,
          # logs to the journal, and can be inspected and stopped by name.
          #
          # CPUWeight is the point of running it this way. The coordinator also
          # answers live PIR queries, and a backfill that saturated the box
          # would show up as query latency. A reduced weight only matters when
          # the CPU is contended, so the backfill still runs at full speed on an
          # idle host.
          sudo systemd-run \
            --unit="$unit" \
            --description="Transparent event journal backfill" \
            --property=CPUWeight=20 \
            --property=IOWeight=20 \
            --property=MemoryMax=8G \
            --property=Nice=10 \
            --setenv=RUST_LOG=info \
            "$bin" "${args[@]}"

          sleep 5
          systemctl status "$unit" --no-pager --lines=20 || true
          REMOTE

      - name: Report status
        if: inputs.action == 'status' || inputs.action == 'start'
        env:
          HOST: ${{ vars.ENHANCE_COORDINATOR_HOST }}
          USER_NAME: ${{ vars.ENHANCE_DEPLOY_USER }}
          DATA_DIR_INPUT: ${{ inputs.data_dir }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/backfill-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/backfill-ssh/known_hosts"
            -o ConnectTimeout=10)
          "${SSH[@]}" "$USER_NAME@$HOST" bash -s -- "$UNIT" "${DATA_DIR_INPUT:-$DATA_DIR}" <<'REMOTE' | tee status.txt
          set -euo pipefail
          unit="$1"; data_dir="$2"
          echo "### unit"
          systemctl is-active "$unit" || true
          echo
          echo "### last progress lines"
          sudo journalctl -u "$unit" --no-pager --lines=15 -o cat || true
          echo
          echo "### journal on disk"
          sudo du -sh "$data_dir" 2>/dev/null || echo "no data directory yet"
          REMOTE
          {
            echo '## Transparent event backfill'
            echo '```'
            cat status.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Stop the backfill
        if: inputs.action == 'stop'
        env:
          HOST: ${{ vars.ENHANCE_COORDINATOR_HOST }}
          USER_NAME: ${{ vars.ENHANCE_DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/backfill-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/backfill-ssh/known_hosts"
            -o ConnectTimeout=10)
          # Stopping is safe at any point. Coverage advances only at a commit,
          # so this loses at most the blocks since the last checkpoint, and
          # starting again resumes from there.
          "${SSH[@]}" "$USER_NAME@$HOST" bash -s -- "$UNIT" <<'REMOTE'
          set -euo pipefail
          unit="$1"
          sudo systemctl stop "$unit" || true
          systemctl is-active "$unit" || echo "stopped"
          REMOTE
