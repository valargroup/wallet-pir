name: CI full

# The whole workspace: Enhance, the transparent crates and the retained
# research crates, linted and tested the way `make check` does locally. Not
# the transparent deploy gate (ci.yml is, and is smaller so a deploy is not
# held behind crates it does not ship); the Enhance deploy gates on this one.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C target-cpu=x86-64-v3

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: workspace
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --release
