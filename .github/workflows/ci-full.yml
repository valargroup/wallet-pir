name: CI full

# Enhance crates and services. Transparent crates and development tools run in
# ci.yml, so the two deploy gates cover the workspace without compiling every
# package in both workflows.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C target-cpu=x86-64-v3

jobs:
  enhance-lint:
    name: Enhance lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: enhance-lint
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev protobuf-compiler
      - run: >-
          cargo clippy --all-targets --all-features
          -p enhance-pir -p enhance-pir-load-test -p enhance-pir-server
          -p pir-apm -p transparent-spend-pir
          -- -D warnings

  enhance-test:
    name: Enhance tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: enhance-test
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev protobuf-compiler
      - run: >-
          cargo test --profile release-fast
          -p enhance-pir -p enhance-pir-load-test -p enhance-pir-server
          -p pir-apm -p transparent-spend-pir
