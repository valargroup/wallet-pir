name: CI full

# Release correctness checks for both product families. Fast CI never substitutes
# for these tests. Enhance hardware qualification remains a separate deployment
# gate; artifacts are published only after every check in this workflow passes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Read-only lookup of which ref holds a hosted Cargo cache entry.
  actions: read

concurrency:
  group: full-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CFLAGS: -mpclmul
  CXXFLAGS: -mpclmul
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C target-cpu=x86-64-v3

jobs:
  select:
    name: Select full checks
    runs-on: ubuntu-24.04
    outputs:
      enhance: ${{ steps.affected.outputs.enhance }}
      transparent: ${{ steps.affected.outputs.transparent }}
      shared: ${{ steps.affected.outputs.shared }}
      ops: ${{ steps.affected.outputs.ops }}
      helpers: ${{ steps.affected.outputs.helpers }}
      enhance_infra: ${{ steps.affected.outputs.enhance_infra }}
      transparent_infra: ${{ steps.affected.outputs.transparent_infra }}
    steps:
      - uses: actions/checkout@v4
      - name: Select affected full suites
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$BASE"
            python3 tools/ci/fast.py --committed-only --base "$BASE" --select-only --github-output
          else
            python3 tools/ci/fast.py --all --select-only --github-output
          fi

  transparent-lint:
    needs: select
    if: needs.select.outputs.transparent == 'true'
    name: Transparent lint
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      # librocksdb-sys turns on SSE4.2 for its CRC32C code from the host's
      # features and cc-rs never adds -mpclmul, so the intrinsic that path
      # uses fails to compile without it. Same fix as the coordinator builds.
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-lint
          scope: transparent
      - run: cargo fmt --all --check
      - name: Test simulation report helpers
        run: |
          node --test transparent/tools/transparent-loadtest/tests/apm.test.cjs
          python3 transparent/tools/transparent-loadtest/tests/test_open_report.py
          python3 transparent/tools/transparent-loadtest/tests/test_compare.py
      - run: python3 tools/ci/full_packages.py --group transparent --lint
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: python3 tools/ci/cargo_cache.py report

  transparent-test:
    needs: select
    if: needs.select.outputs.transparent == 'true'
    name: Transparent tests
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      # Bound concurrent fixtures; each simulation still exercises internal concurrency.
      RUST_TEST_THREADS: "2"
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-test
          scope: transparent
      # release-fast: the full-shard cryptographic tests need optimized code,
      # not the fat-LTO single-codegen-unit link the deploy profile pays for,
      # which on a two-vCPU runner is most of the wall time.
      - run: python3 tools/ci/full_packages.py --group transparent
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: python3 tools/ci/cargo_cache.py report

  validate-enhance-infra:
    needs: select
    if: needs.select.outputs.enhance_infra == 'true'
    name: Validate Enhance infrastructure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Validate provider schema and mock fleet plans
        working-directory: ops/infra/digitalocean/enhance-v4
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

  validate-transparent-elastic-infra:
    needs: select
    if: needs.select.outputs.transparent_infra == 'true'
    name: Validate transparent elastic infrastructure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Validate provider schema and mock member plans
        working-directory: ops/infra/digitalocean/transparent-elastic
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

  validate-ops:
    needs: select
    if: needs.select.outputs.ops == 'true'
    name: Validate selected helper checks
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      # Parses and lints every ops script, compiles every jq program the deploy
      # scripts run, and evaluates the transparent ones against payloads
      # `operator_payloads.rs` serialized from the server's own types. This
      # replaces the bare shellcheck runs it subsumes, and covers what the
      # `validate` invocations below cannot: they reach only the three programs
      # that read shards.json, and neither of the two bugs that shipped on
      # 2026-09-07 was in those three.
      - name: Run selected full helper suites
        env:
          HELPERS: ${{ needs.select.outputs.helpers }}
        run: python3 tools/ci/helpers.py --full --targets "$HELPERS"
      - name: Validate transparent filter inputs
        if: contains(needs.select.outputs.helpers, 'check-ops-contracts') || contains(needs.select.outputs.helpers, 'check-ops-deploy')
        env:
          TRANSPARENT_FILTER_HOST: coordinator.example.net
          WALLET_PIR_DEPLOY_USER: deploy
          TRANSPARENT_RELEASE_SHA: "da39a3ee5e6b4b0d3255bfef95601890afd80709"
          TRANSPARENT_ARTIFACT_DIR: transparent/ops/deploy
          TRANSPARENT_FILTER_SHARD_DIR: /srv/zakura/transparent-shards-v7
          ENHANCE_PUBLIC_URL: https://enhance-pir.example.net
        run: transparent/ops/scripts/deploy-transparent-filter.sh validate

      - name: Validate transparent shard inputs
        if: contains(needs.select.outputs.helpers, 'check-ops-contracts') || contains(needs.select.outputs.helpers, 'check-ops-deploy')
        env:
          TRANSPARENT_WORKER_HOST: transparent-worker-01.example.net
          WALLET_PIR_DEPLOY_USER: deploy
          # Quoted, and hex containing letters: an unquoted run of digits is
          # read as the integer 0 and the validator rightly rejects it.
          TRANSPARENT_RELEASE_SHA: "da39a3ee5e6b4b0d3255bfef95601890afd80709"
          TRANSPARENT_ARTIFACT_DIR: artifact
          TRANSPARENT_SHARD_DIR: /srv/transparent-pir/sets
          TRANSPARENT_PUBLIC_URL: https://transparent-pir.example.net
        run: |
          set -euo pipefail
          shard_set="$RUNNER_TEMP/shard-set"
          mkdir -p "$shard_set/aaa" "$shard_set/bbb"
          printf '%s\n' '{"shards":[{"shard_id":0,"manifest_digest":"aaa"},{"shard_id":1,"manifest_digest":"bbb"}]}' >"$shard_set/shards.json"
          TRANSPARENT_SHARD_SOURCE="$shard_set" transparent/ops/scripts/deploy-transparent-shard.sh validate
          # And the same set with a shard directory missing must be refused.
          rmdir "$shard_set/bbb"
          if TRANSPARENT_SHARD_SOURCE="$shard_set" transparent/ops/scripts/deploy-transparent-shard.sh validate; then
            echo "an incomplete shard set was accepted" >&2
            exit 1
          fi
          mkdir -p "$shard_set/bbb"

          # The unit is executed by `systemctl enable --now` with nothing
          # validating it first, so a malformed one is a failed start -- and a
          # failed start is now a rollback. Written with printf one argument per
          # line: a heredoc terminator has to sit at column 0, which ends a YAML
          # block scalar, and escaped newlines inside a quoted string do not
          # reliably survive YAML either. Both make a test pass for the wrong
          # reason.
          art="$RUNNER_TEMP/artifact"
          mkdir -p "$art"
          unit="$art/transparent-shard-server.service"
          export TRANSPARENT_ARTIFACT_DIR="$art" TRANSPARENT_SHARD_SOURCE="$shard_set"

          cp transparent/ops/deploy/transparent-shard-server.service "$unit"
          transparent/ops/scripts/deploy-transparent-shard.sh validate

          refuses() {
            if transparent/ops/scripts/deploy-transparent-shard.sh validate >/dev/null 2>&1; then
              echo "a malformed unit was accepted: $1" >&2
              exit 1
            fi
          }

          # A continuation leaves an argument stranded on its own line, which
          # systemd reads as a second directive rather than as an error.
          # shellcheck disable=SC1003
          printf '%s\n' 'ExecStart=/usr/local/bin/x \' '  --shard-dir TRANSPARENT_SHARD_SET_PATH' >"$unit"
          grep -qE '\\$' "$unit" || { echo "test fixture has no continuation" >&2; exit 1; }
          refuses "line continuation"

          # A hardcoded path nobody substituted: the unit would name a set the
          # deploy did not ship.
          printf '%s\n' 'ExecStart=/usr/local/bin/x --shard-dir /hardcoded' >"$unit"
          refuses "unsubstituted token"

          # Two ExecStart lines: systemd runs both.
          printf '%s\n' 'ExecStart=/a --shard-dir TRANSPARENT_SHARD_SET_PATH' 'ExecStart=/b' >"$unit"
          [[ "$(grep -c '^ExecStart=' "$unit")" -eq 2 ]] || { echo "test fixture has one ExecStart" >&2; exit 1; }
          refuses "second ExecStart"

  enhance-lint:
    needs: select
    if: needs.select.outputs.enhance == 'true'
    name: Enhance lint
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-lint
          scope: enhance
      - run: python3 tools/ci/full_packages.py --group enhance --lint
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: python3 tools/ci/cargo_cache.py report

  enhance-test:
    needs: select
    if: needs.select.outputs.enhance == 'true'
    name: Enhance tests
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      # Full-size integration fixtures each retain multiple six-instance shard
      # generations. Run them serially so two fixtures cannot exhaust a hosted
      # runner before either test reports its result.
      RUST_TEST_THREADS: "1"
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-test
          scope: enhance
      - name: Run Enhance release tests
        run: |
          # Full-size embedded/topology fixtures exceed the CI runner's memory
          # on shared runners. Hardware qualification is a separate exact-release
          # deployment gate; keep artifact CI bounded to correctness coverage.
          python3 tools/ci/full_packages.py --group enhance

      - name: Check tagged native distributed integration
        env:
          QUALIFY_PUBLICATIONS: "1"
          QUALIFY_QUERY_LANES: "2"
          QUALIFY_QUERIES_PER_LANE: "3"
        run: |
          python3 tools/ci/stage.py compile:native-cuda-check -- cargo check --locked -p enhance-pir-server -p enhance-pir-load-test --features native-reinspiring,cuda
          tools/ci/full-test.sh --locked --profile release-fast -p enhance-pir-server --features native-reinspiring --test packing_http --test status_wallet --test enhance_wallet_native
          python3 tools/ci/stage.py tests:native-lib -- cargo test --locked --profile release-fast -p enhance-pir --features native-reinspiring --lib native
          python3 tools/ci/stage.py tests:native-status -- cargo test --locked --profile release-fast -p enhance-pir-server --features native-reinspiring --lib status::
          python3 tools/ci/stage.py tests:pir-native -- cargo test --locked --profile release-fast -p pir-native

      - name: Check optional CUDA worker without a GPU
        run: |
          python3 tools/ci/stage.py compile:cuda-check -- cargo check --locked -p enhance-pir-server --all-targets --features cuda
          python3 tools/ci/stage.py tests:cuda-config -- cargo test --locked --profile release-fast -p enhance-pir-server --features cuda --test matvec_config
          python3 tools/ci/stage.py tests:cuda-load -- cargo test --locked --profile release-fast -p enhance-pir-server --features cuda --lib backend_load_failure_does_not_rebuild_or_replace_published_units
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: python3 tools/ci/cargo_cache.py report

  shared-test:
    name: Shared lint and tests
    needs: select
    if: needs.select.outputs.shared == 'true'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-test
          scope: shared
      - run: python3 tools/ci/full_packages.py --group shared --lint
      - run: python3 tools/ci/full_packages.py --group shared
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: python3 tools/ci/cargo_cache.py report

  complete:
    name: Full checks complete
    if: always()
    needs: [select, transparent-lint, transparent-test, enhance-lint, enhance-test, shared-test, validate-ops, validate-enhance-infra, validate-transparent-elastic-infra]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify selected checks completed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCHECK'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if results['select']['result'] != 'success':
              raise SystemExit('selection failed')
          groups = {'transparent-lint': 'transparent', 'transparent-test': 'transparent',
                    'enhance-lint': 'enhance', 'enhance-test': 'enhance', 'shared-test': 'shared',
                    'validate-ops': 'ops', 'validate-enhance-infra': 'enhance_infra',
                    'validate-transparent-elastic-infra': 'transparent_infra'}
          for job, group in groups.items():
              expected = 'success' if results['select']['outputs'][group] == 'true' else 'skipped'
              if results[job]['result'] != expected:
                  raise SystemExit(f'{job}: {results[job]["result"]}, expected {expected}')
          PYCHECK

  release:
    name: Prepare qualified release artifacts
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [complete]
    runs-on: ${{ fromJSON(vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          lane: release
          scope: q48
      - name: Build optimized release binaries once
        run: >-
          python3 tools/ci/stage.py compile:release -- cargo build --locked --release
          -p enhance-pir-server -p enhance-pir -p enhance-pir-load-test -p pir-apm -p pir-monitor
          -p transparent-filter-server -p transparent-shard-server
          --bin enhance-pir-server --bin enhance-pir-load-test
          --bin enhance-pir-cli --bin pir-apm --bin transparent-filter-server
          --bin transparent-shard-server --bin shard-assign --bin shard-prune
          --bin shard-control --bin transparent-publish-controller
          --bin transparent-txid-server --bin txid-control --bin txid-inventory
          --bin txid-display-controller --bin transparent-event-ingest --features enhance-pir/cli
      - name: Assemble checksummed release bundles
        env:
          SHA: ${{ github.sha }}
        run: python3 tools/ci/stage.py artifact -- python3 tools/ci/release.py assemble --sha "$SHA" --output release-bundles
      # The native profile serves an incompatible protocol; build it in its own
      # target directory so feature unification never leaks into the q48 bundle.
      - uses: ./.github/actions/rust-setup
        with:
          lane: release-native
          scope: native
      - name: Build native Enhance binaries
        run: >-
          python3 tools/ci/stage.py compile:native -- cargo build --locked --release
          -p enhance-pir-server -p enhance-pir -p enhance-pir-load-test
          --bin enhance-pir-server --bin enhance-pir-load-test --bin enhance-pir-cli --bin status-pir
          --features enhance-pir/cli,enhance-pir/native-reinspiring,enhance-pir-server/native-reinspiring,enhance-pir-load-test/native-reinspiring
      - name: Assemble native Enhance bundle
        env:
          SHA: ${{ github.sha }}
        run: python3 tools/ci/stage.py artifact -- python3 tools/ci/release.py assemble --sha "$SHA" --kind enhance-pir-native --target "$CARGO_TARGET_DIR" --output release-bundles-native
      # Status roles and controller come from the same native build.
      - name: Assemble Status bundle
        env:
          SHA: ${{ github.sha }}
        run: python3 tools/ci/stage.py artifact -- python3 tools/ci/release.py assemble --sha "$SHA" --kind status-pir --target "$CARGO_TARGET_DIR" --output release-bundles-status
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: python3 tools/ci/cargo_cache.py report
      - uses: actions/upload-artifact@v4
        with:
          name: status-pir-${{ github.sha }}
          path: release-bundles-status/status-pir.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: enhance-pir-native-${{ github.sha }}
          path: release-bundles-native/enhance-pir-native.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: enhance-pir-${{ github.sha }}
          path: release-bundles/enhance-pir.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: transparent-filter-${{ github.sha }}
          path: release-bundles/transparent-filter.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: transparent-shard-${{ github.sha }}
          path: release-bundles/transparent-shard.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: transparent-publisher-${{ github.sha }}
          path: release-bundles/transparent-publisher.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: transparent-txid-display-${{ github.sha }}
          path: release-bundles/transparent-txid-display.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release-cuda:
    name: Prepare native CUDA release artifact (Ubuntu 22.04)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [complete]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.91.0
      # The flags tools/ci/build-cuda.sh exports, visible to the cache identity.
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq
      CFLAGS: -mpclmul
      CXXFLAGS: -mpclmul
    # Pin the build ABI independently of the existing Ubuntu 24.04 CPU lane.
    container:
      image: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Ubuntu 22.04 build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential ca-certificates curl git libclang-dev protobuf-compiler python3 pkg-config libssl-dev
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - name: Identify native CUDA Cargo cache
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/cargo_cache.py prepare --lane native-cuda --scope cuda --target-dir target/native-cuda
      # Main-only job: these entries are trusted and never read PR output.
      - name: Restore native CUDA Cargo cache
        id: restore
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-wallet-pir
          shared-key: ${{ steps.identity.outputs.shared-key }}
          add-rust-environment-hash-key: 'false'
          workspaces: ". -> target/native-cuda"
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Record restored Cargo state
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: python3 tools/ci/cargo_cache.py restored --lane native-cuda --cache-hit "$CACHE_HIT"
      - name: Build isolated native CUDA binaries and record ABI
        run: tools/ci/build-cuda.sh
      - name: Assemble checksummed native CUDA bundle
        env:
          SHA: ${{ github.sha }}
          # Checkout's temporary HOME differs from this container shell's HOME.
          # Trust only this exact Actions checkout for Git provenance checks.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: >-
          python3 tools/ci/stage.py artifact:cuda -- python3 tools/ci/release.py assemble --sha "$SHA"
          --kind enhance-pir-native-cuda --target target/native-cuda
          --build-metadata target/native-cuda/build.json --output release-bundles-native-cuda
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: python3 tools/ci/cargo_cache.py report
      - uses: actions/upload-artifact@v4
        with:
          name: enhance-pir-native-cuda-${{ github.sha }}
          path: release-bundles-native-cuda/enhance-pir-native-cuda.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
