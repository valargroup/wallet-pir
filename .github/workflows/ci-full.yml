name: CI full

# Reusable full qualification for one service family, plus asynchronous whole-
# repository regression checks. Existing suites and hardware gates are retained.

on:
  workflow_call:
    inputs:
      family:
        type: string
        required: true
      include-cuda:
        type: boolean
        default: false
      defer-release:
        type: boolean
        default: false
      service-only:
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      include-cuda:
        description: Explicitly include CUDA checks
        type: boolean
        default: false
      publisher-only:
        description: Build and check a unified publisher candidate from this exact ref, without deploying
        type: boolean
        default: false
      query-candidate:
        description: Also build and check the unified CPU query candidate from this exact ref, without deploying
        type: boolean
        default: false

permissions:
  contents: read
  # Read-only lookup of which ref holds a hosted Cargo cache entry.
  actions: read

concurrency:
  group: full-${{ github.workflow }}-${{ inputs.family || 'all' }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CFLAGS: -mpclmul
  CXXFLAGS: -mpclmul
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C target-cpu=x86-64-v3

defaults:
  run:
    shell: bash

jobs:
  select:
    name: Select full checks
    if: ${{ !inputs.publisher-only }}
    runs-on: ubuntu-24.04
    outputs:
      test_matrix: ${{ steps.matrix.outputs.matrix }}
      test_count: ${{ steps.matrix.outputs.count }}
      enhance: ${{ steps.affected.outputs.enhance }}
      transparent: ${{ steps.affected.outputs.transparent }}
      shared: ${{ steps.affected.outputs.shared }}
      receiver: ${{ steps.affected.outputs.receiver }}
      ops: ${{ steps.affected.outputs.ops }}
      helpers: ${{ steps.affected.outputs.helpers }}
      enhance_infra: ${{ steps.affected.outputs.enhance_infra }}
      transparent_infra: ${{ steps.affected.outputs.transparent_infra }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
      - name: Select affected full suites
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FAMILY: ${{ inputs.family }}
          SERVICE_ONLY: ${{ inputs.service-only }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 022
          set -euo pipefail
          umask 022
          if [[ -n "$FAMILY" ]]; then
            args=(--family "$FAMILY")
            [[ "$SERVICE_ONLY" != true ]] || args+=(--service-only)
            python3 tools/ci/qualification.py checks "${args[@]}"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$BASE"
            python3 tools/ci/fast.py --committed-only --base "$BASE" --select-only --github-output
          else
            python3 tools/ci/fast.py --all --select-only --github-output
          fi
      - name: Plan complete qualification matrix
        id: matrix
        env:
          SELECTED: '{"enhance":"${{ steps.affected.outputs.enhance }}","transparent":"${{ steps.affected.outputs.transparent }}","receiver":"${{ steps.affected.outputs.receiver }}"}'
        run: python3 tools/ci/test_matrix.py plan --selected "$SELECTED" --github-output

  test-shards:
    name: Qualification / ${{ matrix.shard }}
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.test_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-test
          scope: ${{ matrix.shard }}
      - name: Run assigned qualification targets
        run: umask 022 && python3 tools/ci/test_matrix.py run --shard '${{ matrix.shard }}' --output "$RUNNER_TEMP/qualification/${{ matrix.shard }}.json"
      - name: Print local reproduction
        if: failure()
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 tools/ci/local_repro.py "python3 tools/ci/test_matrix.py run --shard $SHARD --output .local-pir/qualification/$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: qualification-${{ matrix.family }}-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/qualification/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

  cuda:
    name: CUDA
    needs: select
    if: inputs.include-cuda && needs.select.outputs.enhance == 'true'
    uses: ./.github/workflows/ci-cuda.yml

  transparent-lint:
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.transparent == 'true' }}
    name: Transparent lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # librocksdb-sys turns on SSE4.2 for its CRC32C code from the host's
      # features and cc-rs never adds -mpclmul, so the intrinsic that path
      # uses fails to compile without it. Same fix as the coordinator builds.
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-lint
          scope: transparent
      - run: cargo fmt --all --check
      - name: Test simulation report helpers
        run: |
          umask 022
          node --test tools/transparent/loadtest/tests/apm.test.cjs
          python3 tools/transparent/loadtest/tests/test_compare.py
      - run: python3 tools/ci/full_packages.py --group transparent --lint
      - name: Print local reproduction
        if: failure()
        run: python3 tools/ci/local_repro.py "cargo fmt --all --check && make check-reports && python3 tools/ci/full_packages.py --group transparent --lint"
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

  transparent-test:
    name: Transparent tests
    needs: [select, test-shards]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.transparent == 'true' && needs.test-shards.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/verify-qualification
        with:
          family: transparent

  validate-enhance-infra:
    needs: select
    if: needs.select.outputs.enhance_infra == 'true'
    name: Validate Enhance infrastructure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Validate provider schema and mock fleet plans
        working-directory: tools/infra/digitalocean/enhance/worker-pool
        run: |
          umask 022
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

      - name: Validate fleet and service modules
        working-directory: tools/infra/digitalocean/fleet
        run: |
          umask 022
          terraform fmt -check -recursive ..
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

      - name: Validate the unified query node
        working-directory: tools/infra/digitalocean/query-serving
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color
      - name: Print local reproduction
        if: failure()
        run: python3 tools/ci/local_repro.py "(cd tools/infra/digitalocean && terraform fmt -check -recursive && for d in enhance/worker-pool fleet query-serving; do (cd \$d && terraform init -backend=false -input=false -lockfile=readonly && terraform validate && terraform test) || exit 1; done)"

  validate-transparent-elastic-infra:
    needs: select
    if: needs.select.outputs.transparent_infra == 'true'
    name: Validate transparent elastic infrastructure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Validate provider schema and mock member plans
        working-directory: tools/infra/digitalocean/transparent/worker-pool
        run: |
          umask 022
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color
      - name: Print local reproduction
        if: failure()
        run: python3 tools/ci/local_repro.py "(cd tools/infra/digitalocean/transparent/worker-pool && terraform fmt -check -recursive && terraform init -backend=false -input=false -lockfile=readonly && terraform validate && terraform test)"

  validate-ops:
    needs: select
    if: needs.select.outputs.ops == 'true'
    name: Validate selected helper checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
      - name: Read repository Rust toolchain
        id: helper-toolchain
        run: umask 022 && python3 -c 'import os,tomllib; t=tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"]; print("toolchain="+t, file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: ${{ steps.helper-toolchain.outputs.toolchain }}
          components: rustfmt, clippy
      # Parses and lints every ops shell script (check-ops-contracts) and runs
      # the other selected helper suites.
      - name: Run selected full helper suites
        env:
          HELPERS: ${{ needs.select.outputs.helpers }}
        run: umask 022 && python3 tools/ci/helpers.py --full --targets "$HELPERS"
      - name: Print local reproduction
        if: failure()
        env:
          HELPERS: ${{ needs.select.outputs.helpers }}
        run: python3 tools/ci/local_repro.py "python3 tools/ci/helpers.py --full --targets '$HELPERS'"

  enhance-lint:
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.enhance == 'true' }}
    name: Enhance lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-lint
          scope: enhance
      - run: python3 tools/ci/full_packages.py --group enhance --lint
      - name: Print local reproduction
        if: failure()
        run: python3 tools/ci/local_repro.py "python3 tools/ci/full_packages.py --group enhance --lint"
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

  enhance-test:
    name: Enhance tests
    needs: [select, test-shards]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.enhance == 'true' && needs.test-shards.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/verify-qualification
        with:
          family: enhance

  shared-test:
    name: Shared lint and tests
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.shared == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-test
          scope: shared
      - run: python3 tools/ci/full_packages.py --group shared --lint
      - run: python3 tools/ci/full_packages.py --group shared
      - name: Print local reproduction
        if: failure()
        run: python3 tools/ci/local_repro.py "python3 tools/ci/full_packages.py --group shared --lint && python3 tools/ci/full_packages.py --group shared"
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

  receiver-lint:
    name: Receiver lint
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.receiver == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-lint
          scope: receiver
      - run: python3 tools/ci/full_packages.py --group receiver --lint
      - name: Print local reproduction
        if: failure()
        run: python3 tools/ci/local_repro.py "python3 tools/ci/full_packages.py --group receiver --lint"
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

  receiver-test:
    name: Receiver lint and tests
    needs: [select, test-shards, receiver-lint]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.receiver == 'true' && needs.test-shards.result == 'success' && needs.receiver-lint.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/verify-qualification
        with:
          family: receiver

  complete:
    name: Full checks complete
    if: always() && needs.select.result == 'success'
    needs: [select, cuda, transparent-lint, transparent-test, enhance-lint, enhance-test, shared-test, receiver-test, validate-ops, validate-enhance-infra, validate-transparent-elastic-infra]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify selected checks completed
        env:
          RESULTS: ${{ toJSON(needs) }}
          INCLUDE_CUDA: ${{ inputs.include-cuda }}
        run: |
          umask 022
          python3 - <<'PYCHECK'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if results['select']['result'] != 'success':
              raise SystemExit('selection failed')
          groups = {'transparent-lint': 'transparent', 'transparent-test': 'transparent',
                    'enhance-lint': 'enhance', 'enhance-test': 'enhance', 'shared-test': 'shared',
                    'receiver-test': 'receiver',
                    'validate-ops': 'ops', 'validate-enhance-infra': 'enhance_infra',
                    'validate-transparent-elastic-infra': 'transparent_infra'}
          expected_cuda = 'success' if os.environ['INCLUDE_CUDA'] == 'true' and results['select']['outputs']['enhance'] == 'true' else 'skipped'
          if results['cuda']['result'] != expected_cuda:
              raise SystemExit('CUDA checks did not complete as selected')
          for job, group in groups.items():
              expected = 'success' if results['select']['outputs'][group] == 'true' else 'skipped'
              if results[job]['result'] != expected:
                  raise SystemExit(f'{job}: {results[job]["result"]}, expected {expected}')
          PYCHECK

  build:
    name: Build candidate release artifacts
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.validate-ops.result == 'success' || needs.validate-ops.result == 'skipped') && inputs.family != '' && inputs.family != 'common' && inputs.family != 'shared' && github.ref == 'refs/heads/main' }}
    needs: [select, validate-ops]
    runs-on: ${{ fromJSON(inputs.family == 'ops' && '"ubuntu-24.04"' || vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Prepare operations candidate
        if: inputs.family == 'ops'
        run: umask 022 && python3 tools/ci/qualification.py assemble --family ops --sha "$GITHUB_SHA"
      - uses: ./.github/actions/rust-setup
        if: inputs.family != 'ops'
        with:
          lane: release
          scope: q48
      - name: Build selected CPU candidate
        if: inputs.family != 'ops'
        env:
          FAMILY: ${{ inputs.family }}
        run: |
          umask 022
          python3 tools/ci/qualification.py build --family "$FAMILY"
          python3 tools/ci/qualification.py assemble --family "$FAMILY" --sha "$GITHUB_SHA"
      - uses: ./.github/actions/rust-setup
        if: inputs.family == 'enhance'
        with:
          lane: release-native
          scope: native
      - name: Build native Enhance and Status candidates
        if: inputs.family == 'enhance'
        run: |
          umask 022
          python3 tools/ci/stage.py compile:native -- cargo build --locked --release \
            -p enhance-publisher -p status-publisher -p enhance-pir-client -p enhance-pir-load-test -p pir-publisher \
            --bin enhance-pir-load-test --bin enhance-pir-cli --bin pir-publisher \
            --features enhance-pir-client/native-reinspiring,enhance-publisher/native-reinspiring,status-publisher/native-reinspiring,status-publisher/cli,enhance-pir-load-test/native-reinspiring,pir-publisher/enhance,pir-publisher/status,pir-publisher/transparent-history,pir-publisher/transparent-detail,pir-publisher/receiver,pir-publisher/native-reinspiring
          # Own invocation so `enhance` and `status` name the query server's features, not another package's.
          python3 tools/ci/stage.py compile:native-query-server -- cargo build --locked --release \
            -p pir-query-server --bin pir-query-server \
            --features enhance,status,native-reinspiring
          python3 tools/ci/qualification.py assemble --family enhance --native --sha "$GITHUB_SHA"
      - name: Report Cargo cache reuse
        if: always() && inputs.family != 'ops'
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: candidate-${{ inputs.family }}-${{ github.sha }}
          path: release-bundles/**/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  release:
    name: Prepare qualified release artifacts
    if: ${{ !inputs.defer-release && !cancelled() && needs.complete.result == 'success' && needs.build.result == 'success' && inputs.family != '' && inputs.family != 'common' && inputs.family != 'shared' && github.event_name != 'pull_request' && github.event_name != 'workflow_run' && github.ref == 'refs/heads/main' }}
    needs: [complete, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/qualify-artifacts
        with:
          family: ${{ inputs.family }}

  build-cuda:
    name: Build candidate native CUDA artifact (Ubuntu 22.04)
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.validate-ops.result == 'success' || needs.validate-ops.result == 'skipped') && inputs.include-cuda && needs.cuda.result == 'success' && inputs.family == 'enhance' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [select, validate-ops, cuda]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      # The flags tools/ci/build-cuda.sh exports, visible to the cache identity.
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq
      CFLAGS: -mpclmul
      CXXFLAGS: -mpclmul
    # Pin the build ABI independently of the existing Ubuntu 24.04 CPU lane.
    container:
      image: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Ubuntu 22.04 build dependencies
        run: |
          umask 022
          apt-get update -qq
          apt-get install -y -qq build-essential ca-certificates curl git libclang-dev protobuf-compiler python3 pkg-config libssl-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: 1.97.1
      - name: Identify native CUDA Cargo cache
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: umask 022 && python3 tools/ci/cargo_cache.py prepare --lane native-cuda --scope cuda --target-dir target/native-cuda
      # Main-only job: these entries are trusted and never read PR output.
      - name: Restore native CUDA Cargo cache
        id: restore
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          prefix-key: v1-wallet-pir
          shared-key: ${{ steps.identity.outputs.shared-key }}
          add-rust-environment-hash-key: 'false'
          workspaces: ". -> target/native-cuda"
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Record restored Cargo state
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: umask 022 && python3 tools/ci/cargo_cache.py restored --lane native-cuda --cache-hit "$CACHE_HIT"
      - name: Build isolated native CUDA binaries and record ABI
        env:
          WALLET_PIR_SOURCE_REVISION: ${{ github.sha }}
        run: umask 022 && tools/ci/build-cuda.sh
      - name: Assemble checksummed native CUDA bundle
        env:
          SHA: ${{ github.sha }}
          # Checkout's temporary HOME differs from this container shell's HOME.
          # Trust only this exact Actions checkout for Git provenance checks.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: >-
          umask 022 &&
          python3 tools/ci/stage.py artifact:cuda -- python3 tools/ci/release.py assemble --sha "$SHA"
          --kind enhance-pir-native-cuda --target target/native-cuda
          --build-metadata target/native-cuda/build.json --output release-bundles-native-cuda/enhance-pir-native-cuda
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: candidate-native-cuda-${{ github.sha }}
          path: release-bundles-native-cuda/enhance-pir-native-cuda/enhance-pir-native-cuda.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  release-cuda:
    name: Prepare native CUDA release artifact (Ubuntu 22.04)
    if: ${{ !inputs.defer-release && !cancelled() && needs.complete.result == 'success' && needs.build-cuda.result == 'success' && inputs.family == 'enhance' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [complete, build-cuda]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/qualify-artifacts
        with:
          family: enhance
          cuda: 'true'

  query-candidate:
    name: Unified query candidate
    if: github.event_name == 'workflow_dispatch' && inputs.query-candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          lane: release
          scope: query-server
      - name: Check query deployment and provisioning refusals
        run: python3 -B -m unittest tools.tests.operations.test_query_role tools.tests.operations.test_query_infra tools.tests.operations.test_query_terraform
      - name: Build all supported query products together
        run: cargo build --locked --release -p pir-query-server --features enhance,status,transparent-history,transparent-detail,native-reinspiring
      - name: Check the rendered deployment through the actual binary
        run: |
          python3 tools/scripts/wallet-pir-roles.py --service query-server --role combined --settings tools/deploy/query-server/query-node.example.json --release "$CARGO_TARGET_DIR/release" > "$RUNNER_TEMP/rendered-query.json"
          jq -r '.files["/etc/wallet-pir-query/query-server.json"]' "$RUNNER_TEMP/rendered-query.json" > "$RUNNER_TEMP/query-server.json"
          "$CARGO_TARGET_DIR/release/pir-query-server" --config "$RUNNER_TEMP/query-server.json" --check
      - name: Package the exact source candidate
        run: |
          python3 tools/ci/release.py assemble --kind pir-query-server --sha "$GITHUB_SHA" --output .local-pir/query-candidate
          python3 tools/scripts/wallet-pir-bundle.py assemble --sha "$GITHUB_SHA" --archive .local-pir/query-candidate/wallet-pir-ops.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: unified-query-candidate-${{ github.sha }}
          path: .local-pir/query-candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publisher-candidate:
    name: Unified publisher candidate
    if: github.event_name == 'workflow_dispatch' && inputs.publisher-only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          lane: release
          scope: publisher
      - name: Check the cutover operations
        run: python3 -B tools/ci/python_tests.py tools/tests/operations/deploy --jobs 2 --split-module test_ops_package
      - name: Build the unified native publisher
        run: cargo build --locked --release -p pir-publisher --features enhance,status,transparent-history,transparent-detail,native-reinspiring
      - name: Check each query product builds alone
        run: |
          for product in enhance status transparent-history transparent-detail; do
            cargo check --locked -p pir-query-server --features "$product"
          done
      - name: Build the matching native query server
        run: cargo build --locked --release -p pir-query-server --features enhance,status,transparent-history,transparent-detail,native-reinspiring
      - name: Check both compiled product configurations
        run: |
          jq '{management_listen, enhance, status, transparent_history, transaction_details}' tools/deploy/publisher/publisher.example.json > "$RUNNER_TEMP/publisher-transparent.json"
          "$CARGO_TARGET_DIR/release/pir-publisher" --config "$RUNNER_TEMP/publisher-transparent.json" --check
          cargo test --locked --release -p pir-publisher --features enhance,status,transparent-history,transparent-detail,native-reinspiring --lib
          python3 -B -m unittest discover -s tools/tests/operations/deploy -p 'test_publisher_*.py'
          python3 -B tools/status/test_status_qualification.py
          python3 -B tools/status/test_publication_capture.py
      - name: Build independent acceptance tools
        run: |
          cargo build --locked --profile release-fast -p status-publisher -p enhance-pir-client -p enhance-pir-load-test --bin enhance-pir-cli --bin enhance-pir-load-test --features status-publisher/cli,status-publisher/native-reinspiring,enhance-pir-client/native-reinspiring,enhance-pir-load-test/native-reinspiring
          cargo build --locked --profile release-fast -p transparent-tools --bin transparent-regression --bin regression-export --bin txid-quality-canary
          cargo build --locked --profile release-fast -p transparent-tools --bin rate-query --bin txid-rate
          cargo test --locked --profile release-fast -p transparent-tools --bin rate-query
      - name: Check retired commands and managed Status lifecycle
        run: |
          cargo test --locked --profile release-fast -p pir-publisher --features enhance,native-reinspiring --test commands
          cargo test --locked --profile release-fast -p status-publisher --features cli,native-reinspiring --lib commands::tests
          cargo test --locked --profile release-fast -p status-publisher --features fixtures,native-reinspiring --lib shared_status_lifecycle_collects_publishes_and_advances_over_real_roles
          cargo test --locked --profile release-fast -p transparent-publisher --features fixtures --lib --no-run
          cargo test --locked --profile release-fast -p pir-publisher --features enhance,status,transparent-history,transparent-detail,native-reinspiring --test lifecycle
      - name: Package the exact source candidate
        run: |
          python3 tools/ci/release.py assemble --kind pir-publisher --sha "$GITHUB_SHA" --output .local-pir/publisher-candidate
          python3 tools/scripts/wallet-pir-bundle.py assemble --sha "$GITHUB_SHA" --archive .local-pir/publisher-candidate/wallet-pir-ops.tar.gz
          cp "$CARGO_TARGET_DIR/release/pir-query-server" .local-pir/publisher-candidate/
          cp "$CARGO_TARGET_DIR/release-fast/transparent-regression" "$CARGO_TARGET_DIR/release-fast/regression-export" "$CARGO_TARGET_DIR/release-fast/txid-quality-canary" .local-pir/publisher-candidate/
          cp "$CARGO_TARGET_DIR/release-fast/rate-query" "$CARGO_TARGET_DIR/release-fast/txid-rate" .local-pir/publisher-candidate/
          cp "$CARGO_TARGET_DIR/release-fast/enhance-pir-cli" "$CARGO_TARGET_DIR/release-fast/enhance-pir-load-test" .local-pir/publisher-candidate/
          sha256sum .local-pir/publisher-candidate/pir-query-server .local-pir/publisher-candidate/enhance-pir-cli .local-pir/publisher-candidate/enhance-pir-load-test .local-pir/publisher-candidate/rate-query .local-pir/publisher-candidate/txid-rate .local-pir/publisher-candidate/*.tar.gz .local-pir/publisher-candidate/transparent-regression .local-pir/publisher-candidate/regression-export .local-pir/publisher-candidate/txid-quality-canary > .local-pir/publisher-candidate/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: transparent-publisher-candidate-${{ github.sha }}
          path: .local-pir/publisher-candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
