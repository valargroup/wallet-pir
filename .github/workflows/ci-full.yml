name: CI full

# Reusable full qualification for one service family, plus asynchronous whole-
# repository regression checks. Existing suites and hardware gates are retained.

on:
  workflow_call:
    inputs:
      family:
        type: string
        required: true
      service-only:
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Read-only lookup of which ref holds a hosted Cargo cache entry.
  actions: read

concurrency:
  group: full-${{ github.workflow }}-${{ inputs.family || 'all' }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CFLAGS: -mpclmul
  CXXFLAGS: -mpclmul
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C target-cpu=x86-64-v3

defaults:
  run:
    shell: bash

jobs:
  select:
    name: Select full checks
    runs-on: ubuntu-24.04
    outputs:
      enhance: ${{ steps.affected.outputs.enhance }}
      transparent: ${{ steps.affected.outputs.transparent }}
      shared: ${{ steps.affected.outputs.shared }}
      receiver: ${{ steps.affected.outputs.receiver }}
      ops: ${{ steps.affected.outputs.ops }}
      helpers: ${{ steps.affected.outputs.helpers }}
      enhance_infra: ${{ steps.affected.outputs.enhance_infra }}
      transparent_infra: ${{ steps.affected.outputs.transparent_infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Select affected full suites
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FAMILY: ${{ inputs.family }}
          SERVICE_ONLY: ${{ inputs.service-only }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 022
          set -euo pipefail
          umask 022
          if [[ -n "$FAMILY" ]]; then
            args=(--family "$FAMILY")
            [[ "$SERVICE_ONLY" != true ]] || args+=(--service-only)
            python3 tools/ci/qualification.py checks "${args[@]}"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$BASE"
            python3 tools/ci/fast.py --committed-only --base "$BASE" --select-only --github-output
          else
            python3 tools/ci/fast.py --all --select-only --github-output
          fi

  transparent-lint:
    needs: [select, validate-ops]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.validate-ops.result == 'success' || needs.validate-ops.result == 'skipped') && needs.select.outputs.transparent == 'true' }}
    name: Transparent lint
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      # librocksdb-sys turns on SSE4.2 for its CRC32C code from the host's
      # features and cc-rs never adds -mpclmul, so the intrinsic that path
      # uses fails to compile without it. Same fix as the coordinator builds.
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-lint
          scope: transparent
      - run: cargo fmt --all --check
      - name: Test simulation report helpers
        run: |
          umask 022
          node --test transparent/tools/transparent-loadtest/tests/apm.test.cjs
          python3 transparent/tools/transparent-loadtest/tests/test_open_report.py
          python3 transparent/tools/transparent-loadtest/tests/test_compare.py
      - run: python3 tools/ci/full_packages.py --group transparent --lint
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

  transparent-test:
    needs: [select, validate-ops]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.validate-ops.result == 'success' || needs.validate-ops.result == 'skipped') && needs.select.outputs.transparent == 'true' }}
    name: Transparent tests
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      # Bound concurrent fixtures; each simulation still exercises internal concurrency.
      RUST_TEST_THREADS: "2"
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-test
          scope: transparent
      # release-fast: the full-shard cryptographic tests need optimized code,
      # not the fat-LTO single-codegen-unit link the deploy profile pays for,
      # which on a two-vCPU runner is most of the wall time.
      - run: python3 tools/ci/full_packages.py --group transparent
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

  validate-enhance-infra:
    needs: select
    if: needs.select.outputs.enhance_infra == 'true'
    name: Validate Enhance infrastructure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Validate provider schema and mock fleet plans
        working-directory: ops/infra/digitalocean/enhance/worker-pool
        run: |
          umask 022
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

      - name: Validate fleet and service modules
        working-directory: ops/infra/digitalocean/fleet
        run: |
          umask 022
          terraform fmt -check -recursive ..
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

  validate-transparent-elastic-infra:
    needs: select
    if: needs.select.outputs.transparent_infra == 'true'
    name: Validate transparent elastic infrastructure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Validate provider schema and mock member plans
        working-directory: ops/infra/digitalocean/transparent/worker-pool
        run: |
          umask 022
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

  validate-ops:
    needs: select
    if: needs.select.outputs.ops == 'true'
    name: Validate selected helper checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read repository Rust toolchain
        id: helper-toolchain
        run: umask 022 && python3 -c 'import os,tomllib; t=tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"]; print("toolchain="+t, file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.helper-toolchain.outputs.toolchain }}
          components: rustfmt, clippy
      # Parses and lints every ops script, compiles every jq program the deploy
      # scripts run, and evaluates the transparent ones against payloads
      # `operator_payloads.rs` serialized from the server's own types. This
      # replaces the bare shellcheck runs it subsumes, and covers what the
      # `validate` invocations below cannot: they reach only the three programs
      # that read shards.json, and neither of the two bugs that shipped on
      # 2026-09-07 was in those three.
      - name: Run selected full helper suites
        env:
          HELPERS: ${{ needs.select.outputs.helpers }}
        run: umask 022 && python3 tools/ci/helpers.py --full --targets "$HELPERS"
      - name: Validate current transparent deployment inputs
        if: contains(needs.select.outputs.helpers, 'check-ops-contracts') || contains(needs.select.outputs.helpers, 'check-ops-deploy')
        # The current candidate validator owns filter/publisher artifact inputs.
        # Exercise valid inputs and refusal cases; the retired shell wrapper is
        # no longer an executable deployment contract.
        run: umask 022 && python3 -B transparent/ops/tests/test_activity_candidate.py

      - name: Validate transparent shard inputs
        if: contains(needs.select.outputs.helpers, 'check-ops-contracts') || contains(needs.select.outputs.helpers, 'check-ops-deploy')
        env:
          TRANSPARENT_WORKER_HOST: transparent-worker-01.example.net
          WALLET_PIR_DEPLOY_USER: deploy
          # Quoted, and hex containing letters: an unquoted run of digits is
          # read as the integer 0 and the validator rightly rejects it.
          TRANSPARENT_RELEASE_SHA: "da39a3ee5e6b4b0d3255bfef95601890afd80709"
          TRANSPARENT_ARTIFACT_DIR: artifact
          TRANSPARENT_SHARD_DIR: /srv/transparent-pir/sets
          TRANSPARENT_PUBLIC_URL: https://transparent-pir.example.net
        run: |
          umask 022
          set -euo pipefail
          shard_set="$RUNNER_TEMP/shard-set"
          mkdir -p "$shard_set/aaa" "$shard_set/bbb"
          printf '%s\n' '{"shards":[{"shard_id":0,"manifest_digest":"aaa"},{"shard_id":1,"manifest_digest":"bbb"}]}' >"$shard_set/shards.json"
          TRANSPARENT_SHARD_SOURCE="$shard_set" transparent/ops/scripts/deploy-transparent-shard.sh validate
          # And the same set with a shard directory missing must be refused.
          rmdir "$shard_set/bbb"
          if TRANSPARENT_SHARD_SOURCE="$shard_set" transparent/ops/scripts/deploy-transparent-shard.sh validate; then
            echo "an incomplete shard set was accepted" >&2
            exit 1
          fi
          mkdir -p "$shard_set/bbb"

          # The unit is executed by `systemctl enable --now` with nothing
          # validating it first, so a malformed one is a failed start -- and a
          # failed start is now a rollback. Written with printf one argument per
          # line: a heredoc terminator has to sit at column 0, which ends a YAML
          # block scalar, and escaped newlines inside a quoted string do not
          # reliably survive YAML either. Both make a test pass for the wrong
          # reason.
          art="$RUNNER_TEMP/artifact"
          mkdir -p "$art"
          unit="$art/transparent-shard-server.service"
          export TRANSPARENT_ARTIFACT_DIR="$art" TRANSPARENT_SHARD_SOURCE="$shard_set"

          cp transparent/ops/deploy/transparent-shard-server.service "$unit"
          transparent/ops/scripts/deploy-transparent-shard.sh validate

          refuses() {
            if transparent/ops/scripts/deploy-transparent-shard.sh validate >/dev/null 2>&1; then
              echo "a malformed unit was accepted: $1" >&2
              exit 1
            fi
          }

          # A continuation leaves an argument stranded on its own line, which
          # systemd reads as a second directive rather than as an error.
          # shellcheck disable=SC1003
          printf '%s\n' 'ExecStart=/usr/local/bin/x \' '  --shard-dir TRANSPARENT_SHARD_SET_PATH' >"$unit"
          grep -qE '\\$' "$unit" || { echo "test fixture has no continuation" >&2; exit 1; }
          refuses "line continuation"

          # A hardcoded path nobody substituted: the unit would name a set the
          # deploy did not ship.
          printf '%s\n' 'ExecStart=/usr/local/bin/x --shard-dir /hardcoded' >"$unit"
          refuses "unsubstituted token"

          # Two ExecStart lines: systemd runs both.
          printf '%s\n' 'ExecStart=/a --shard-dir TRANSPARENT_SHARD_SET_PATH' 'ExecStart=/b' >"$unit"
          [[ "$(grep -c '^ExecStart=' "$unit")" -eq 2 ]] || { echo "test fixture has one ExecStart" >&2; exit 1; }
          refuses "second ExecStart"

  enhance-lint:
    needs: [select, validate-ops]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.validate-ops.result == 'success' || needs.validate-ops.result == 'skipped') && needs.select.outputs.enhance == 'true' }}
    name: Enhance lint
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-lint
          scope: enhance
      - run: python3 tools/ci/full_packages.py --group enhance --lint
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

  enhance-test:
    needs: [select, validate-ops]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.validate-ops.result == 'success' || needs.validate-ops.result == 'skipped') && needs.select.outputs.enhance == 'true' }}
    name: Enhance tests
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      # Full-size integration fixtures each retain multiple six-instance shard
      # generations. Run them serially so two fixtures cannot exhaust a hosted
      # runner before either test reports its result.
      RUST_TEST_THREADS: "1"
      CXXFLAGS: -mpclmul
      CFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-test
          scope: enhance
      - name: Run Enhance release tests
        run: |
          umask 022
          # Full-size embedded/topology fixtures exceed the CI runner's memory
          # on shared runners. Hardware qualification is a separate exact-release
          # deployment gate; keep artifact CI bounded to correctness coverage.
          python3 tools/ci/full_packages.py --group enhance

      - name: Check reference runtime arithmetic
        run: |
          umask 022
          # Common control/HTTP assertions already run with the native backend.
          # Preserve the independent reference implementation's arithmetic tests.
          tools/ci/full-test.sh --locked --profile release-fast -p enhance-serving --lib ipir::tests
          tools/ci/full-test.sh --locked --profile release-fast -p enhance-serving --test ci_smoke
          # Frozen reference vectors must not be compared with native v9 identities.
          tools/ci/full-test.sh --locked --profile release-fast -p enhance-pir -p status-serving --lib --tests

      - name: Check optional CUDA worker without a GPU
        run: |
          umask 022
          # Use the same native+CUDA feature set for each check so Cargo reuses
          # the configured libraries. GPU execution remains hardware qualification.
          python3 tools/ci/stage.py compile:cuda-check -- cargo check --locked -p enhance-serving -p status-serving -p enhance-pir-server -p enhance-pir-load-test --all-targets --features enhance-serving/cuda,status-serving/cuda,enhance-pir-server/cuda,enhance-pir-server/native-reinspiring,enhance-pir-load-test/native-reinspiring
          tools/ci/full-test.sh --locked --profile release-fast -p enhance-pir-server --features native-reinspiring,cuda --test matvec_config
          python3 tools/ci/stage.py tests:cuda-load -- cargo test --locked --profile release-fast -p enhance-serving --features native-reinspiring,cuda --lib backend_load_failure_does_not_rebuild_or_replace_published_units
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

  shared-test:
    name: Shared lint and tests
    needs: [select, validate-ops]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.validate-ops.result == 'success' || needs.validate-ops.result == 'skipped') && needs.select.outputs.shared == 'true' }}
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-test
          scope: shared
      - run: python3 tools/ci/full_packages.py --group shared --lint
      - run: python3 tools/ci/full_packages.py --group shared
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

  receiver-test:
    name: Receiver lint and tests
    needs: [select, validate-ops]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.validate-ops.result == 'success' || needs.validate-ops.result == 'skipped') && needs.select.outputs.receiver == 'true' }}
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-test
          scope: receiver
      - run: python3 tools/ci/full_packages.py --group receiver --lint
      - run: python3 tools/ci/full_packages.py --group receiver
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

  complete:
    name: Full checks complete
    if: always() && needs.select.result == 'success'
    needs: [select, transparent-lint, transparent-test, enhance-lint, enhance-test, shared-test, receiver-test, validate-ops, validate-enhance-infra, validate-transparent-elastic-infra]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify selected checks completed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          umask 022
          python3 - <<'PYCHECK'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if results['select']['result'] != 'success':
              raise SystemExit('selection failed')
          groups = {'transparent-lint': 'transparent', 'transparent-test': 'transparent',
                    'enhance-lint': 'enhance', 'enhance-test': 'enhance', 'shared-test': 'shared',
                    'receiver-test': 'receiver',
                    'validate-ops': 'ops', 'validate-enhance-infra': 'enhance_infra',
                    'validate-transparent-elastic-infra': 'transparent_infra'}
          for job, group in groups.items():
              expected = 'success' if results['select']['outputs'][group] == 'true' else 'skipped'
              if results[job]['result'] != expected:
                  raise SystemExit(f'{job}: {results[job]["result"]}, expected {expected}')
          PYCHECK

  build:
    name: Build candidate release artifacts
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.validate-ops.result == 'success' || needs.validate-ops.result == 'skipped') && inputs.family != '' && inputs.family != 'common' && inputs.family != 'shared' && github.ref == 'refs/heads/main' }}
    needs: [select, validate-ops]
    runs-on: ${{ fromJSON(inputs.family == 'ops' && '"ubuntu-24.04"' || vars.WALLET_PIR_BUILD_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare operations candidate
        if: inputs.family == 'ops'
        run: umask 022 && python3 tools/ci/qualification.py assemble --family ops --sha "$GITHUB_SHA"
      - uses: ./.github/actions/rust-setup
        if: inputs.family != 'ops'
        with:
          lane: release
          scope: q48
      - name: Build selected CPU candidate
        if: inputs.family != 'ops'
        env:
          FAMILY: ${{ inputs.family }}
        run: |
          umask 022
          python3 tools/ci/qualification.py build --family "$FAMILY"
          python3 tools/ci/qualification.py assemble --family "$FAMILY" --sha "$GITHUB_SHA"
      - uses: ./.github/actions/rust-setup
        if: inputs.family == 'enhance'
        with:
          lane: release-native
          scope: native
      - name: Build native Enhance and Status candidates
        if: inputs.family == 'enhance'
        run: |
          umask 022
          python3 tools/ci/stage.py compile:native -- cargo build --locked --release \
            -p enhance-pir-server -p enhance-pir -p enhance-pir-load-test \
            --bin enhance-pir-server --bin enhance-pir-load-test --bin enhance-pir-cli --bin status-pir \
            --features enhance-pir/cli,enhance-pir/native-reinspiring,enhance-pir-server/native-reinspiring,enhance-pir-load-test/native-reinspiring
          python3 tools/ci/qualification.py assemble --family enhance --native --sha "$GITHUB_SHA"
      - name: Report Cargo cache reuse
        if: always() && inputs.family != 'ops'
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ inputs.family }}-${{ github.sha }}
          path: release-bundles/**/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  release:
    name: Prepare qualified release artifacts
    if: ${{ !cancelled() && needs.complete.result == 'success' && needs.build.result == 'success' && inputs.family != '' && inputs.family != 'common' && inputs.family != 'shared' && github.event_name != 'pull_request' && github.event_name != 'workflow_run' && github.ref == 'refs/heads/main' }}
    needs: [complete, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ inputs.family }}-${{ github.sha }}
          path: release-bundles
      - name: Verify qualified candidate contents
        env:
          FAMILY: ${{ inputs.family }}
        run: umask 022 && python3 tools/ci/qualification.py verify --family "$FAMILY" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: inputs.family == 'ops'
        with:
          name: wallet-pir-ops-${{ github.sha }}
          path: release-bundles/wallet-pir-ops/wallet-pir-ops.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.family == 'receiver'
        with:
          name: receiver-pir-${{ github.sha }}
          path: release-bundles/receiver-pir/receiver-pir.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.family == 'transparent'
        with:
          name: transparent-filter-${{ github.sha }}
          path: release-bundles/transparent-filter/transparent-filter.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.family == 'transparent'
        with:
          name: transparent-shard-${{ github.sha }}
          path: release-bundles/transparent-shard/transparent-shard.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.family == 'transparent'
        with:
          name: transparent-publisher-${{ github.sha }}
          path: release-bundles/transparent-publisher/transparent-publisher.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.family == 'transparent'
        with:
          name: transparent-txid-display-${{ github.sha }}
          path: release-bundles/transparent-txid-display/transparent-txid-display.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.family == 'enhance'
        with:
          name: enhance-pir-${{ github.sha }}
          path: release-bundles/enhance-pir/enhance-pir.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.family == 'enhance'
        with:
          name: enhance-pir-native-${{ github.sha }}
          path: release-bundles/enhance-pir-native/enhance-pir-native.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.family == 'enhance'
        with:
          name: status-pir-${{ github.sha }}
          path: release-bundles/status-pir/status-pir.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release-cuda:
    name: Prepare native CUDA release artifact (Ubuntu 22.04)
    if: ${{ !cancelled() && needs.complete.result == 'success' && inputs.family == 'enhance' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [complete]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      # The flags tools/ci/build-cuda.sh exports, visible to the cache identity.
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq
      CFLAGS: -mpclmul
      CXXFLAGS: -mpclmul
    # Pin the build ABI independently of the existing Ubuntu 24.04 CPU lane.
    container:
      image: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Ubuntu 22.04 build dependencies
        run: |
          umask 022
          apt-get update -qq
          apt-get install -y -qq build-essential ca-certificates curl git libclang-dev protobuf-compiler python3 pkg-config libssl-dev
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Identify native CUDA Cargo cache
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: umask 022 && python3 tools/ci/cargo_cache.py prepare --lane native-cuda --scope cuda --target-dir target/native-cuda
      # Main-only job: these entries are trusted and never read PR output.
      - name: Restore native CUDA Cargo cache
        id: restore
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-wallet-pir
          shared-key: ${{ steps.identity.outputs.shared-key }}
          add-rust-environment-hash-key: 'false'
          workspaces: ". -> target/native-cuda"
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Record restored Cargo state
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: umask 022 && python3 tools/ci/cargo_cache.py restored --lane native-cuda --cache-hit "$CACHE_HIT"
      - name: Build isolated native CUDA binaries and record ABI
        run: umask 022 && tools/ci/build-cuda.sh
      - name: Assemble checksummed native CUDA bundle
        env:
          SHA: ${{ github.sha }}
          # Checkout's temporary HOME differs from this container shell's HOME.
          # Trust only this exact Actions checkout for Git provenance checks.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: >-
          umask 022 &&
          python3 tools/ci/stage.py artifact:cuda -- python3 tools/ci/release.py assemble --sha "$SHA"
          --kind enhance-pir-native-cuda --target target/native-cuda
          --build-metadata target/native-cuda/build.json --output release-bundles-native-cuda
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report
      - uses: actions/upload-artifact@v4
        with:
          name: enhance-pir-native-cuda-${{ github.sha }}
          path: release-bundles-native-cuda/enhance-pir-native-cuda.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
