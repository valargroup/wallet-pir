name: Deploy continuous transparent publisher

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full tested commit SHA on main
        required: true
        type: string
      mode:
        description: Shadow upgrades and verifies; activate enables per-block publication
        required: true
        type: choice
        options: [shadow, activate, rollback]
      initial_publication:
        description: Existing verified full-chain publication on the coordinator
        required: true
        default: /srv/zakura/transparent-shards-v7-full
        type: string
      directory_choice:
        description: Which newly built shards publish a directory choice table (shadow mode)
        required: true
        default: 'off'
        type: choice
        options: ['off', sealed, all]

concurrency:
  group: wallet-pir-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, wallet-pir-deploy]
    environment: production
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify tested main revision
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          status="$(curl -fsS "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/main...$SHA" | jq -er .status)"
          [[ "$status" == identical || "$status" == behind ]]
          successes="$(curl -fsS "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci-full.yml/runs?head_sha=$SHA&status=success&per_page=1" | jq -er '.workflow_runs | length')"
          [[ "$successes" -ge 1 ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Locate qualified release artifact
        if: inputs.mode == 'shadow'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref }}
        run: python3 tools/ci/release.py resolve --sha "$SHA" --kind transparent-publisher
      - name: Clear previous artifact download
        if: inputs.mode == 'shadow'
        run: rm -rf "$RUNNER_TEMP/qualified-transparent-publisher"
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'shadow'
        with:
          name: transparent-publisher-${{ inputs.ref }}
          run-id: ${{ steps.release.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualified-transparent-publisher
      - name: Verify and unpack release artifact
        if: inputs.mode == 'shadow'
        env:
          SHA: ${{ inputs.ref }}
        run: >-
          python3 tools/ci/release.py extract --sha "$SHA" --kind transparent-publisher
          --archive "$RUNNER_TEMP/qualified-transparent-publisher/transparent-publisher.tar.gz" --output artifact

      - name: Install, verify or activate
        env:
          WALLET_PIR_DEPLOY_SSH_KEY: ${{ secrets.WALLET_PIR_DEPLOY_SSH_KEY }}
          TRANSPARENT_SSH_KNOWN_HOSTS: ${{ vars.TRANSPARENT_SSH_KNOWN_HOSTS }}
          TRANSPARENT_FLEET_JSON: ${{ vars.TRANSPARENT_FLEET_JSON }}
          TRANSPARENT_ROUTER_HOST: ${{ vars.TRANSPARENT_ROUTER_HOST }}
          MODE: ${{ inputs.mode }}
          SHA: ${{ inputs.ref }}
          INITIAL: ${{ inputs.initial_publication }}
          DIRECTORY_CHOICE: ${{ inputs.directory_choice }}
        run: |
          set -euo pipefail
          mkdir -p publisher-evidence
          sudo --preserve-env=WALLET_PIR_DEPLOY_SSH_KEY,TRANSPARENT_SSH_KNOWN_HOSTS,TRANSPARENT_FLEET_JSON,TRANSPARENT_ROUTER_HOST \
            python3 transparent/ops/scripts/deploy-transparent-publisher.py "$MODE" \
            --artifacts "$PWD/artifact" --initial-publication "$INITIAL" --source-sha "$SHA" \
            --directory-choice "$DIRECTORY_CHOICE" \
            2>&1 | tee publisher-evidence/deploy.log

      - name: Capture nonsecret serving evidence
        if: always()
        run: |
          mkdir -p publisher-evidence
          curl -fsS --max-time 10 http://127.0.0.1:8094/v1/status > publisher-evidence/status.json || true
          curl -fsS --max-time 10 http://127.0.0.1:8094/metrics > publisher-evidence/metrics.txt || true
          # Output is intentionally owned by the runner for artifact upload.
          # shellcheck disable=SC2024
          sudo journalctl -u transparent-publish-controller --since '20 minutes ago' --no-pager > publisher-evidence/controller.log || true
          for binary in transparent-publish-controller transparent-shard-server shard-control shard-assign; do
            test ! -f "artifact/$binary" || sha256sum "artifact/$binary"
          done > publisher-evidence/binaries.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transparent-publisher-${{ inputs.mode }}-${{ github.run_id }}
          path: publisher-evidence/

      - name: Report queue and stage timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/timings.py --run "$GITHUB_RUN_ID"
