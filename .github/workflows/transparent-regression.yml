name: Transparent PIR regression
on:
  workflow_dispatch:
    inputs:
      fixture:
        description: Repository path to a frozen regression fixture
        default: tools/transparent/fixtures/regression/mainnet.json
        required: true
        type: string
      shard_url:
        default: https://transparent-pir.valargroup.dev
        required: true
        type: string
      filter_url:
        default: https://enhance-pir.valargroup.dev
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: transparent-regression
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - name: Run every frozen case
        env:
          FIXTURE: ${{ inputs.fixture }}
          SHARD_URL: ${{ inputs.shard_url }}
          FILTER_URL: ${{ inputs.filter_url }}
        run: |
          cargo run --locked --release -p transparent-tools --bin transparent-regression -- \
            --fixture "$FIXTURE" --shard-url "$SHARD_URL" --filter-url "$FILTER_URL" \
            --source-sha "$GITHUB_SHA" --out-dir regression-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: transparent-regression
          path: regression-results/
          if-no-files-found: error
