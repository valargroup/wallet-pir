name: Deploy receiver PIR

# Runs ops/scripts/wallet-pir-deploy.py for the receiver service, the commands
# receiver/ops/digitalocean/README.md describes, from the coordinator. The
# runner is the pinned coordinator, so the tool takes the production lock there
# directly: the same lock an operator's run takes. The repository does not
# describe the live fleet, so the inventory comes from production variables.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA on main with a successful CI full run
        required: true
        type: string
      mode:
        description: >-
          plan only reads. preflight also stages the release on the Droplet.
          capture-baseline records the live unit that preflight and deploy
          check. deploy and rollback change production.
        required: true
        default: plan
        type: choice
        options: [plan, preflight, capture-baseline, deploy, rollback, status]
      allow_unit_drift:
        description: Accept the unit drift that plan reported (deploy only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: enhance-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.mode }} receiver PIR
    runs-on: [self-hosted, Linux, X64, wallet-pir-deploy]
    timeout-minutes: 45
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      SHA: ${{ inputs.ref }}
      MODE: ${{ inputs.mode }}
      # Like the CUDA workflow's, apart from an operator's state: `rollback`
      # restores this journal's transactions, against this baseline.
      STATE_DIR: /var/lib/wallet-pir-deploy/receiver
    steps:
      - name: Verify tested revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          api_headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          # On main, not necessarily its head, as the other deploy workflows
          # allow. "identical" and "behind" are the compare statuses of an ancestor.
          status="$(curl --fail --silent --show-error "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" | jq -er '.status')"
          [[ "$status" == "identical" || "$status" == "behind" ]] \
            || { echo "$SHA is not on main (compare status: $status)"; exit 1; }
          successful="$(curl --fail --silent --show-error "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci-full.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            | jq -er '.workflow_runs | length')"
          [[ "$successful" -ge 1 ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Locate qualified release artifact
        id: release
        if: contains(fromJSON('["plan", "preflight", "deploy"]'), inputs.mode)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/release.py resolve --sha "$SHA" --kind receiver-pir
      - name: Clear previous artifact download
        run: rm -rf "$RUNNER_TEMP/qualified-receiver-pir"
      - uses: actions/download-artifact@v4
        if: steps.release.outcome == 'success'
        with:
          name: receiver-pir-${{ inputs.ref }}
          run-id: ${{ steps.release.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualified-receiver-pir

      - name: Prepare ephemeral SSH material and inventory
        env:
          DEPLOY_SSH_KEY: ${{ secrets.WALLET_PIR_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.WALLET_PIR_RECEIVER_SSH_KNOWN_HOSTS }}
          RECEIVER_HOST: ${{ vars.WALLET_PIR_RECEIVER_HOST }}
          NEAR_KEY: ${{ vars.WALLET_PIR_RECEIVER_NEAR_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?production deployment SSH key is empty}"
          : "${KNOWN_HOSTS:?WALLET_PIR_RECEIVER_SSH_KNOWN_HOSTS is empty}"
          : "${RECEIVER_HOST:?WALLET_PIR_RECEIVER_HOST is empty}"
          : "${NEAR_KEY:?WALLET_PIR_RECEIVER_NEAR_KEY is empty}"
          dir="$RUNNER_TEMP/receiver-deploy"
          rm -rf "$dir"
          install -m 0700 -d "$dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$dir/key"
          printf '%s\n' "$KNOWN_HOSTS" >"$dir/known_hosts"
          chmod 0600 "$dir/key" "$dir/known_hosts"
          # The inventory deploy-inventory.example.json shows for the receiver,
          # with the lock pinned to the coordinator this job runs on.
          python3 - "$dir" <<'EOF'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'ops/lib')
          from wallet_pir_ops.control_attribution import COORDINATOR

          directory = Path(sys.argv[1])
          listen = '10.70.0.11:18380'
          known_hosts = directory / 'known_hosts'
          inventory = {
              'lock': {'type': 'pinned_host', 'machine_id': COORDINATOR},
              'ssh': {
                  'mode': 'pinned', 'user': 'root', 'key': str(directory / 'key'),
                  'known_hosts': str(known_hosts),
                  'known_hosts_sha256': hashlib.sha256(known_hosts.read_bytes()).hexdigest(),
              },
              'hosts': {'receiver-01': {'address': os.environ['RECEIVER_HOST']}},
              'services': {'receiver': {
                  'template_vars': {'NEAR_KEY': os.environ['NEAR_KEY']},
                  'roles': {'server': [{'host': 'receiver-01', 'vars': {'listen': listen}}]},
                  'exact_check': {
                      'host': 'receiver-01',
                      'argv': [
                          '{release_dir}/receiver-directory', 'probe',
                          '--origin', 'https://receiver-pir.valargroup.dev',
                          '--health-url', f'http://{listen}/v1/receiver/health',
                          '--rpc-url', 'http://10.70.0.19:8232', '--rpc-url', 'http://10.70.0.6:8232',
                          '--no-auth', '--witnesses', '--await-feed-reads', '300',
                      ],
                      'timeout': 480,
                  },
              }},
          }
          (directory / 'inventory.json').write_text(json.dumps(inventory, indent=2) + '\n')
          EOF

      - name: Run the deploy tool
        env:
          ALLOW_UNIT_DRIFT: ${{ inputs.allow_unit_drift }}
        run: |
          set -euo pipefail
          mkdir -p receiver-evidence
          # The production lock is root's, on the pinned coordinator.
          tool=(sudo python3 ops/scripts/wallet-pir-deploy.py
            --inventory "$RUNNER_TEMP/receiver-deploy/inventory.json" --state-dir "$STATE_DIR")
          release=(--archive "$RUNNER_TEMP/qualified-receiver-pir/receiver-pir.tar.gz" --sha "$SHA")
          drift=()
          if [[ "$ALLOW_UNIT_DRIFT" == true ]]; then drift=(--allow-unit-drift); fi
          {
            case "$MODE" in
              plan) "${tool[@]}" plan receiver "${release[@]}" ;;
              preflight) "${tool[@]}" preflight receiver "${release[@]}" --stage ;;
              capture-baseline)
                "${tool[@]}" capture-baseline receiver
                sudo cat "$STATE_DIR/baselines/receiver.json" ;;
              deploy)
                "${tool[@]}" deploy receiver "${release[@]}" "${drift[@]}"
                "${tool[@]}" status receiver ;;
              rollback)
                "${tool[@]}" rollback receiver
                "${tool[@]}" status receiver ;;
              status) "${tool[@]}" status receiver ;;
            esac
          } 2>&1 | tee "receiver-evidence/$MODE.log"

      - name: Remove ephemeral SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/receiver-deploy"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receiver-deployment-${{ inputs.mode }}-${{ github.run_id }}
          path: receiver-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Report queue and stage timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/timings.py --run "$GITHUB_RUN_ID"
