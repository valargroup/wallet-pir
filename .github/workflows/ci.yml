name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include-cuda:
        description: Explicitly run CUDA integration checks
        type: boolean
        default: false
      comparison-base:
        description: Compare against this commit to replay a representative change
        type: string
        default: ''
      hosted:
        description: Measure PR feedback on a hosted runner
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: fast-${{ inputs.hosted && 'hosted-' || '' }}${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C target-cpu=x86-64-v3
  CFLAGS: -mpclmul
  CXXFLAGS: -mpclmul

defaults:
  run:
    shell: bash

jobs:
  fast:
    name: Fast checks
    # Reserve this queue for main. PRs and branch dispatches use hosted runners
    # so their cold builds cannot delay a main push.
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.hosted && vars.WALLET_PIR_MAIN_RUNNER || '"ubuntu-24.04"') }}
    # Let validation finish; enforce the feedback target afterwards on main only.
    # GitHub's default job timeout remains the runaway safety limit.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch comparison revision
        env:
          BASE: ${{ inputs.comparison-base || github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 022
          set -euo pipefail
          BASE=$(python3 tools/ci/feedback_base.py)
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]]; then
            [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$BASE"
          fi
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true
      - name: Reject generated noise
        env:
          BASE: ${{ env.FAST_BASE }}
        run: python3 tools/ci/hygiene.py --committed-only --base "$BASE"
      - name: Select affected packages
        id: affected
        env:
          BASE: ${{ env.FAST_BASE }}
        run: umask 022 && TMPDIR="$RUNNER_TEMP" python3 tools/ci/fast.py --committed-only --base "$BASE" --select-only --github-output
      - uses: ./.github/actions/rust-setup
        if: steps.affected.outputs.rust == 'true'
        with:
          lane: fast
          scope: affected
      - name: Require an existing warm build cache on main
        if: github.event_name == 'push' && steps.affected.outputs.rust == 'true'
        run: umask 022 && python3 tools/ci/cargo_cache.py require-warm --lane fast
      - name: Run affected fast checks
        env:
          BASE: ${{ env.FAST_BASE }}
        run: umask 022 && TMPDIR="$RUNNER_TEMP" python3 tools/ci/fast.py --committed-only --base "$BASE" --unit-jobs 3
      - name: Report Cargo cache reuse
        if: always() && steps.affected.outputs.rust == 'true'
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

      - name: Report queue and stage timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: umask 022 && python3 tools/ci/timings.py --run "$GITHUB_RUN_ID"

      - name: Check main feedback timing after validation
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: umask 022 && python3 tools/ci/timings.py --run "$GITHUB_RUN_ID" --check-fast-seconds 180

  select-cuda:
    name: Select CUDA changes
    runs-on: ubuntu-24.04
    outputs:
      cuda: ${{ steps.affected.outputs.cuda }}
    steps:
      - uses: actions/checkout@v4
      - name: Select CUDA contracts and dependencies
        id: affected
        env:
          BASE: ${{ inputs.comparison-base || github.event.pull_request.base.sha || github.event.before }}
          INCLUDE_CUDA: ${{ inputs.include-cuda }}
        run: |
          set -euo pipefail
          if [[ "$INCLUDE_CUDA" == true ]]; then
            echo 'cuda=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$BASE" ]]; then
            echo 'cuda=false' >> "$GITHUB_OUTPUT"
          else
            if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]]; then
              [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
              git fetch --no-tags --depth=1 origin "$BASE"
            fi
            python3 tools/ci/cuda_changes.py --base "$BASE" --github-output
          fi

  cuda:
    name: CUDA
    needs: select-cuda
    if: needs.select-cuda.outputs.cuda == 'true'
    uses: ./.github/workflows/ci-cuda.yml
