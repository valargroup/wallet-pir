name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C target-cpu=x86-64-v3
  CFLAGS: -mpclmul
  CXXFLAGS: -mpclmul

defaults:
  run:
    shell: bash

jobs:
  fast:
    name: Fast checks
    # Reserve this queue for main. PRs and branch dispatches use hosted runners
    # so their cold builds cannot delay a main push.
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.WALLET_PIR_FAST_RUNNER || '"ubuntu-24.04"') }}
    # Cold preparation is explicit; main must fail promptly rather than wait.
    timeout-minutes: ${{ github.event_name == 'push' && 3 || 30 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch comparison revision
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          umask 022
          set -euo pipefail
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]]; then
            [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$BASE"
          fi
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true
      - name: Select affected packages
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: umask 022 && python3 tools/ci/fast.py --committed-only --base "$BASE" --select-only --github-output
      - uses: ./.github/actions/rust-setup
        if: steps.affected.outputs.rust == 'true'
        with:
          lane: fast
          scope: affected
      - name: Require an existing warm build cache on main
        if: github.event_name == 'push' && steps.affected.outputs.rust == 'true'
        run: umask 022 && python3 tools/ci/cargo_cache.py require-warm --lane fast
      - name: Run affected fast checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: umask 022 && python3 tools/ci/fast.py --committed-only --base "$BASE"
      - name: Report Cargo cache reuse
        if: always() && steps.affected.outputs.rust == 'true'
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report

      - name: Report queue and stage timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: umask 022 && python3 tools/ci/timings.py --run "$GITHUB_RUN_ID"
