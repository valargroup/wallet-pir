name: Deploy Enhance PIR

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA on main with a successful CI run
        required: true
        type: string
      artifact_only:
        description: Fetch the qualified release for isolated verification without deploying
        required: false
        default: false
        type: boolean
      prepare_only:
        description: Rebuild schema-v7 journal beside production without changing services
        required: false
        default: false
        type: boolean
      allow_topology_change:
        description: Accept a non-append worker inventory change
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: enhance-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production fleet
    runs-on: [self-hosted, Linux, X64, wallet-pir-deploy]
    timeout-minutes: ${{ inputs.prepare_only && 360 || 60 }}
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          api_headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          main_sha="$(curl --fail --silent --show-error "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -er '.object.sha')"
          [[ "$SHA" == "$main_sha" ]]
          successful="$(curl --fail --silent --show-error "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci-full.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            | jq -er '.workflow_runs | length')"
          [[ "$successful" -ge 1 ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Locate qualified release artifact
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref }}
        run: python3 tools/ci/release.py resolve --sha "$SHA" --kind enhance-pir
      - name: Clear previous artifact download
        run: rm -rf "$RUNNER_TEMP/qualified-enhance-pir"
      - uses: actions/download-artifact@v4
        with:
          name: enhance-pir-${{ inputs.ref }}
          run-id: ${{ steps.release.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualified-enhance-pir
      - name: Verify and unpack release artifact
        env:
          SHA: ${{ inputs.ref }}
        run: >-
          python3 tools/ci/release.py extract --sha "$SHA" --kind enhance-pir
          --archive "$RUNNER_TEMP/qualified-enhance-pir/enhance-pir.tar.gz" --output artifact

      - name: Prepare ephemeral SSH material
        if: ${{ !inputs.artifact_only }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.WALLET_PIR_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.WALLET_PIR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?production deployment SSH key is empty}"
          install -m 0700 -d "$RUNNER_TEMP/enhance-pir-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$RUNNER_TEMP/enhance-pir-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" >"$RUNNER_TEMP/enhance-pir-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/enhance-pir-ssh/key" "$RUNNER_TEMP/enhance-pir-ssh/known_hosts"
      - name: Deploy and verify
        if: ${{ !inputs.artifact_only }}
        env:
          WALLET_PIR_COORDINATOR_HOST: ${{ vars.WALLET_PIR_COORDINATOR_HOST }}
          WALLET_PIR_DEPLOY_USER: ${{ vars.WALLET_PIR_DEPLOY_USER }}
          ENHANCE_PUBLIC_URL: ${{ vars.ENHANCE_PUBLIC_URL }}
          ENHANCE_WORKERS_JSON: ${{ vars.ENHANCE_WORKERS_JSON }}
          ENHANCE_RELEASE_SHA: ${{ inputs.ref }}
          ENHANCE_ARTIFACT_DIR: ${{ github.workspace }}/artifact
          WALLET_PIR_SSH_KEY_PATH: ${{ runner.temp }}/enhance-pir-ssh/key
          WALLET_PIR_KNOWN_HOSTS_PATH: ${{ runner.temp }}/enhance-pir-ssh/known_hosts
          ENHANCE_SERVER_SERVICE_FILE: ${{ github.workspace }}/artifact/enhance-pir-server.service
          ENHANCE_WORKER_SERVICE_FILE: ${{ github.workspace }}/artifact/enhance-pir-worker.service
          ENHANCE_APM_SERVICE_FILE: ${{ github.workspace }}/artifact/pir-apm.service
          TRANSPARENT_FILTER_SERVICE_FILE: ${{ github.workspace }}/artifact/transparent-filter-server.service
          ENHANCE_CADDYFILE: ${{ github.workspace }}/artifact/Caddyfile
          ENHANCE_APM_ENVIRONMENT: production
          ENHANCE_ALLOW_TOPOLOGY_CHANGE: ${{ inputs.allow_topology_change }}
          ENHANCE_PREPARE_ONLY: ${{ inputs.prepare_only }}
          PIR_APM_SLACK_WEBHOOK_URL: ${{ secrets.PIR_APM_SLACK_WEBHOOK_URL }}
        run: |
          if [[ "$ENHANCE_PREPARE_ONLY" == "true" ]]; then
            flock -n /run/lock/wallet-pir-production.lock enhance/ops/scripts/prepare-enhance-pir.sh
          else
            flock -n /run/lock/wallet-pir-production.lock enhance/ops/scripts/deploy-enhance-pir.sh deploy
          fi
      - name: Deployment summary
        if: always()
        run: |
          {
            echo '## Enhance PIR production deployment'
            echo
            echo '- Revision: ${{ inputs.ref }}'
            echo '- Endpoint: ${{ vars.ENHANCE_PUBLIC_URL }}'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Remove SSH material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/enhance-pir-ssh/key" "$RUNNER_TEMP/enhance-pir-ssh/known_hosts"
          rmdir "$RUNNER_TEMP/enhance-pir-ssh" 2>/dev/null || true

      - name: Report queue and stage timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/timings.py --run "$GITHUB_RUN_ID"
