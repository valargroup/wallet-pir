name: Migrate Wallet PIR runner name

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Register replacement runner
    runs-on: [self-hosted, Linux, X64, wallet-pir-deploy]
    timeout-minutes: 10
    environment: production
    steps:
      - name: Register replacement and schedule old service retirement
        env:
          RUNNER_TOKEN: ${{ secrets.WALLET_PIR_RUNNER_REGISTRATION_TOKEN }}
        run: |
          set -euo pipefail
          : "${RUNNER_TOKEN:?runner registration token is empty}"
          old_root="$(dirname "$(dirname "$(dirname "$GITHUB_WORKSPACE")")")"
          test -x "$old_root/bin/Runner.Listener"
          old_service="$(cat "$old_root/.service")"
          [[ "$old_service" =~ ^actions\.runner\.[A-Za-z0-9._-]+\.service$ ]]
          version="$("$old_root/bin/Runner.Listener" --version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          service_user="$(id -un)"
          new_root=/opt/actions-runner-wallet-pir
          sudo rm -rf "$new_root"
          sudo install -d -m 0755 -o "$service_user" -g "$(id -gn)" "$new_root"
          curl --fail --silent --show-error --location \
            "https://github.com/actions/runner/releases/download/v${version}/actions-runner-linux-x64-${version}.tar.gz" |
            tar -xz -C "$new_root"
          cd "$new_root"
          RUNNER_ALLOW_RUNASROOT=1 ./config.sh --unattended \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --token "$RUNNER_TOKEN" \
            --name wallet-pir-coordinator \
            --labels wallet-pir-deploy \
            --work _work
          sudo ./svc.sh install "$service_user"
          sudo ./svc.sh start
          sudo systemd-run --quiet --unit wallet-pir-retire-old-runner \
            --on-active=90s /usr/bin/systemctl disable --now "$old_service"
