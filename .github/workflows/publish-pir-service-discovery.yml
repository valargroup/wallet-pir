name: Publish pir-service-discovery

# Publishes only the pir-service-discovery crate, from an exact main commit,
# after an operator dispatches it. See docs/service-discovery-release.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish; must equal Cargo.toml and a CHANGELOG.md heading
        required: true
      commit:
        description: Full main commit SHA to publish
        required: true

permissions:
  contents: read

concurrency:
  group: publish-pir-service-discovery
  cancel-in-progress: false

env:
  CRATE: pir-service-discovery
  CRATE_DIR: src/shared/pir-service-discovery

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Check commit, version and changelog
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be a full SHA"; exit 1; }
          [[ "$VERSION" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]] || { echo "version must be stable X.Y.Z with X >= 1"; exit 1; }
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "commit is not on main"; exit 1; }
          manifest=$(cargo metadata --no-deps --format-version 1 --manifest-path "$CRATE_DIR/Cargo.toml" \
            | jq -r --arg name "$CRATE" '.packages[] | select(.name == $name) | .version')
          test "$manifest" = "$VERSION" || { echo "Cargo.toml has $manifest"; exit 1; }
          grep -qx "## $VERSION" "$CRATE_DIR/CHANGELOG.md" || { echo "CHANGELOG.md has no $VERSION heading"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$CRATE-v$VERSION" >/dev/null; then
            echo "tag $CRATE-v$VERSION already exists"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and dry-run the packaged crate
        run: |
          set -euo pipefail
          cargo test --locked -p "$CRATE"
          cargo publish --dry-run --locked -p "$CRATE"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    # Protected environment: required reviewers approve each publication.
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Confirm the validated commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: dtolnay/rust-toolchain@stable
      # The crates.io token lives in Infisical and is read at runtime through a
      # narrowly scoped machine identity using GitHub OIDC; nothing is stored
      # in GitHub secrets or printed.
      # v1.0.18; v1 is not a published ref, so pin the release commit.
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_CRATES_IO_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_CRATES_IO_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_CRATES_IO_ENV_SLUG }}
          secret-path: ${{ vars.INFISICAL_CRATES_IO_SECRET_PATH }}
      - name: Publish
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRY_TOKEN:-}" || { echo "CARGO_REGISTRY_TOKEN was not provided"; exit 1; }
          cargo publish --locked -p "$CRATE"
      - name: Tag the published commit
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git tag "$CRATE-v$VERSION" "$COMMIT"
          git push origin "refs/tags/$CRATE-v$VERSION"
