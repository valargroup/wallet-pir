name: Audit qualification matrix

# Explicit same-revision coverage audit; never publishes deployable artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    name: Matrix
    uses: ./.github/workflows/ci-full.yml
    with:
      family: ''

  baseline:
    name: Baseline / ${{ matrix.family }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family: [transparent, enhance, receiver]
    env:
      RUSTFLAGS: -Dwarnings -C target-cpu=x86-64-v3
      CFLAGS: -mpclmul
      CXXFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-test
          scope: ${{ matrix.family }}
      - run: python3 tools/ci/test_matrix.py baseline --family '${{ matrix.family }}' --output "$RUNNER_TEMP/baseline/${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.family }}-${{ github.sha }}
          path: ${{ runner.temp }}/baseline/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: python3 tools/ci/cargo_cache.py report

  compare:
    name: Compare cases / ${{ matrix.family }}
    needs: [matrix, baseline]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        family: [transparent, enhance, receiver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: baseline-${{ matrix.family }}-${{ github.sha }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          pattern: qualification-${{ matrix.family }}-${{ github.sha }}-*
          path: qualification-receipts
          merge-multiple: true
      - run: python3 tools/ci/test_matrix.py compare --family '${{ matrix.family }}' --receipts qualification-receipts --baseline 'baseline/${{ matrix.family }}.json'
