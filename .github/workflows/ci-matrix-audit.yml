name: Audit qualification matrix

# Explicit same-revision coverage audit; never publishes deployable artifacts.
on:
  workflow_dispatch:
    inputs:
      include-cuda:
        description: Audit CUDA coverage as well as CPU coverage
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    name: Matrix
    uses: ./.github/workflows/ci-full.yml
    with:
      family: ''
      include-cuda: ${{ inputs.include-cuda }}

  baseline:
    name: Baseline / ${{ matrix.family }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family: [transparent, enhance, receiver]
    env:
      RUSTFLAGS: -Dwarnings -C target-cpu=x86-64-v3
      CFLAGS: -mpclmul
      CXXFLAGS: -mpclmul
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/rust-setup
        with:
          lane: full-test
          scope: ${{ matrix.family }}
      - env:
          INCLUDE_CUDA: ${{ inputs.include-cuda }}
        run: |
          args=()
          [[ "$INCLUDE_CUDA" != true ]] || args+=(--include-cuda)
          python3 tools/ci/test_matrix.py baseline --family '${{ matrix.family }}' --output "$RUNNER_TEMP/baseline/${{ matrix.family }}.json" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: baseline-${{ matrix.family }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baseline/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: python3 tools/ci/cargo_cache.py report

  compare:
    name: Compare cases / ${{ matrix.family }}
    needs: [matrix, baseline]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        family: [transparent, enhance, receiver]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: baseline-${{ matrix.family }}-${{ github.sha }}-${{ github.run_attempt }}
          path: baseline
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: qualification-${{ matrix.family }}-${{ github.sha }}-${{ github.run_attempt }}-*
          path: qualification-receipts
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: inputs.include-cuda && matrix.family == 'enhance'
        with:
          name: qualification-cuda-${{ github.sha }}-${{ github.run_attempt }}
          path: qualification-receipts/cuda
      - env:
          INCLUDE_CUDA: ${{ inputs.include-cuda }}
        run: |
          args=()
          [[ "$INCLUDE_CUDA" != true ]] || args+=(--include-cuda)
          python3 tools/ci/test_matrix.py compare --family '${{ matrix.family }}' --receipts qualification-receipts --baseline 'baseline/${{ matrix.family }}.json' "${args[@]}"
