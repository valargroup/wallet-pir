name: Release

# Builds the two production executables for every main commit and publishes
# them as the GitHub release `build-<sha12>`. Hosts download their asset from
# that release with `pirctl prepare` (tools/deploy/pirctl); nothing is pushed to
# a host from here. The query node installer keeps its own tagged releases
# (release-query-server.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CFLAGS: -mpclmul
  CXXFLAGS: -mpclmul
  # The same CPU floor the installer release uses; every fleet host meets it.
  RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq
  PRODUCTS: enhance,status,transparent-history,transparent-detail,receiver,native-reinspiring

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - package: pir-publisher
            scope: publisher
          - package: pir-query-server
            scope: query-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          lane: release
          scope: ${{ matrix.scope }}
      - name: Build
        env:
          PACKAGE: ${{ matrix.package }}
        run: cargo build --locked --release -p "$PACKAGE" --features "$PRODUCTS"
      - name: Package
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          out="$RUNNER_TEMP/$PACKAGE"
          mkdir -p "$out"
          cp "$CARGO_TARGET_DIR/release/$PACKAGE" "$out/"
          printf '%s\n' "$GITHUB_SHA" > "$out/revision"
          "$out/$PACKAGE" --contract-info > "$RUNNER_TEMP/$PACKAGE.contract.json"
          tar -C "$out" -czf "$RUNNER_TEMP/$PACKAGE.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.package }}
          path: |
            ${{ runner.temp }}/${{ matrix.package }}.tar.gz
            ${{ runner.temp }}/${{ matrix.package }}.contract.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish build release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          sparse-checkout: tools/deploy
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tools/deploy/pirctl assets/
          cd assets
          # One contract file per release: the driver compares its publisher
          # major with the live discovery document before a partial deploy.
          jq -s '{publisher: .[0], query_server: .[1]}' \
            pir-publisher.contract.json pir-query-server.contract.json > contract.json
          files=(pir-publisher.tar.gz pir-query-server.tar.gz contract.json pirctl)
          sha256sum "${files[@]}" > SHA256SUMS
          tag="build-${GITHUB_SHA:0:12}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes "Build of $GITHUB_SHA." --latest=false "${files[@]}" SHA256SUMS
      - name: Keep the newest 30 build releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[30:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
