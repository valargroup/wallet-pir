name: Qualify services

on:
  workflow_dispatch:
    inputs:
      include-cuda:
        description: Qualify CUDA and produce its artifact at this exact revision
        type: boolean
        default: false
      family:
        description: Service to qualify at this exact main revision
        type: choice
        options: [all, ops, receiver, transparent, enhance]
        default: all

permissions:
  contents: read
  actions: read

concurrency:
  # Explicit qualification retains its pinned revision as main advances.
  group: qualify-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  select:
    name: Select cumulative service changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      ops: ${{ steps.affected.outputs.ops }}
      receiver: ${{ steps.affected.outputs.receiver }}
      transparent: ${{ steps.affected.outputs.transparent }}
      enhance: ${{ steps.affected.outputs.enhance }}
      cuda: ${{ steps.affected.outputs.cuda }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select services since each last qualified ancestor
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          FAMILY: ${{ inputs.family || 'affected' }}
          INCLUDE_CUDA: ${{ inputs.include-cuda }}
        run: |
          args=()
          [[ "$INCLUDE_CUDA" != true ]] || args+=(--include-cuda)
          python3 tools/ci/qualification.py select --sha "$GITHUB_SHA" --family "$FAMILY" "${args[@]}"

  common:
    name: Common
    needs: select
    uses: ./.github/workflows/ci-full.yml
    with:
      family: common

  shared:
    name: Shared
    needs: select
    if: needs.select.outputs.receiver == 'true' || needs.select.outputs.transparent == 'true' || needs.select.outputs.enhance == 'true'
    uses: ./.github/workflows/ci-full.yml
    with:
      family: shared

  ops:
    name: Operations
    needs: select
    if: needs.select.outputs.ops == 'true'
    uses: ./.github/workflows/ci-full.yml
    with:
      family: ops
      service-only: true
      defer-release: true

  receiver:
    name: Receiver
    needs: select
    if: needs.select.outputs.receiver == 'true'
    uses: ./.github/workflows/ci-full.yml
    with:
      family: receiver
      service-only: true
      defer-release: true

  transparent:
    name: Transparent
    needs: select
    if: needs.select.outputs.transparent == 'true'
    uses: ./.github/workflows/ci-full.yml
    with:
      family: transparent
      service-only: true
      defer-release: true

  enhance:
    name: Enhance
    needs: select
    if: needs.select.outputs.enhance == 'true'
    uses: ./.github/workflows/ci-full.yml
    with:
      family: enhance
      include-cuda: ${{ needs.select.outputs.cuda == 'true' }}
      service-only: true
      defer-release: true

  publish-ops:
    name: Operations / Prepare qualified release artifacts
    needs: [select, common, ops]
    if: ${{ !cancelled() && needs.select.outputs.ops == 'true' && needs.common.result == 'success' && needs.ops.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/qualify-artifacts
        with:
          family: ops

  publish-receiver:
    name: Receiver / Prepare qualified release artifacts
    needs: [select, common, receiver, shared]
    if: ${{ !cancelled() && needs.select.outputs.receiver == 'true' && needs.common.result == 'success' && needs.receiver.result == 'success' && needs.shared.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/qualify-artifacts
        with:
          family: receiver

  publish-transparent:
    name: Transparent / Prepare qualified release artifacts
    needs: [select, common, transparent, shared]
    if: ${{ !cancelled() && needs.select.outputs.transparent == 'true' && needs.common.result == 'success' && needs.transparent.result == 'success' && needs.shared.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/qualify-artifacts
        with:
          family: transparent

  publish-enhance:
    name: Enhance / Prepare qualified release artifacts
    needs: [select, common, enhance, shared]
    if: ${{ !cancelled() && needs.select.outputs.enhance == 'true' && needs.common.result == 'success' && needs.enhance.result == 'success' && needs.shared.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/qualify-artifacts
        with:
          family: enhance

  publish-cuda:
    name: Enhance / Prepare native CUDA release artifact (Ubuntu 22.04)
    needs: [select, common, shared, enhance]
    if: ${{ !cancelled() && needs.select.outputs.cuda == 'true' && needs.common.result == 'success' && needs.shared.result == 'success' && needs.enhance.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/qualify-artifacts
        with:
          family: enhance
          cuda: 'true'
