name: Prepare fast validation

# Explicit cold/dependency validation before landing an upgrade. Only a main
# preparation uses the trusted fast runner; branch preparation stays hosted.
on:
  workflow_dispatch:
    inputs:
      comparison-base:
        description: Full SHA to warm the affected Cargo graph (defaults to successful main history)
        type: string
        default: ''
      stress:
        description: Repeat each encrypted HTTP and recovery smoke 50 times
        type: boolean
        default: false
      correctness:
        description: Prepare complete CPU correctness and enforce three warm runs
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'fast-refs/heads/main' || format('prepare-fast-{0}', github.ref) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C target-cpu=x86-64-v3
  CFLAGS: -mpclmul
  CXXFLAGS: -mpclmul

jobs:
  prepare:
    name: Prepare and validate cold fast units
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/main' && vars.WALLET_PIR_MAIN_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch comparison revision
        env:
          BASE: ${{ inputs.comparison-base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 022
          BASE=$(python3 tools/ci/feedback_base.py --prepare)
          if [[ -n "$BASE" ]]; then
            [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$BASE"
          fi
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true
      - uses: ./.github/actions/rust-setup
        with:
          lane: fast
          scope: affected
      - name: Rebuild changed test crates before correctness preparation
        if: inputs.correctness
        # The persistent incremental cache has produced stale hidden symbols
        # when these test crates switch between reference and native features.
        # Repair it once in cold preparation, never between timed warm runs.
        run: cargo clean --profile release-fast -p enhance-shared -p enhance-publisher -p transparent-publisher -p transparent-shared
      - name: Compile fast units
        run: umask 022 && TMPDIR="$RUNNER_TEMP" python3 tools/ci/fast.py --all --compile-only
      - name: Validate prepared units
        if: ${{ !inputs.correctness }}
        run: umask 022 && TMPDIR="$RUNNER_TEMP" python3 tools/ci/fast.py --all --unit-jobs 2
      # The complete workspace and the affected roots can unify dependency
      # features differently. Finish with the graph the routine check selects.
      - name: Validate affected fast units
        if: ${{ !inputs.correctness }}
        env:
          BASE: ${{ env.FAST_BASE }}
        run: umask 022 && TMPDIR="$RUNNER_TEMP" python3 tools/ci/fast.py --committed-only --base "$BASE" --unit-jobs 3
      - name: Repeat independent HTTP and recovery checks
        if: inputs.stress
        run: umask 022 && TMPDIR="$RUNNER_TEMP" python3 tools/ci/integration_tests.py --tier fast --smoke-only --repeat 50
      - name: Validate three warm fast runs
        if: inputs.correctness
        run: |
          set -euo pipefail
          umask 022
          for attempt in 1 2 3; do
            receipt=".local-pir/fast-repeat/$attempt"
            mkdir -p "$receipt"
            git rev-parse HEAD > "$receipt/source.txt"
            TMPDIR="$RUNNER_TEMP" WALLET_PIR_STAGE_LOG="$PWD/$receipt/stages.jsonl" \
              timeout --signal=TERM --kill-after=5s 300s \
              python3 tools/ci/fast.py --all --unit-jobs 3 2>&1 | tee "$receipt/run.log"
          done
      - name: Diagnose complete CPU correctness
        id: correctness-preparation
        if: inputs.correctness && !cancelled()
        run: umask 022 && TMPDIR="$RUNNER_TEMP" python3 tools/ci/correctness.py --record-only
      - name: Validate three warm complete correctness runs
        if: inputs.correctness && !cancelled() && steps.correctness-preparation.outcome == 'success'
        run: |
          set -euo pipefail
          umask 022
          for attempt in 1 2 3; do
            echo "Complete correctness run $attempt"
            TMPDIR="$RUNNER_TEMP" python3 tools/ci/correctness.py --offline
          done
      - name: Retain complete correctness case and stage receipts
        if: always() && inputs.correctness
        uses: actions/upload-artifact@v4
        with:
          name: complete-correctness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local-pir/correctness/
            .local-pir/fast-repeat/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Report Cargo cache reuse
        if: always()
        continue-on-error: true
        run: umask 022 && python3 tools/ci/cargo_cache.py report
