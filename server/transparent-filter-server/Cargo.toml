[package]
name = "transparent-filter-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "transparent_filter_server"
path = "src/lib.rs"

[[bin]]
name = "shard-publish"
path = "src/bin/shard-publish.rs"

[[bin]]
name = "shard-census"
path = "src/bin/shard-census.rs"

[[bin]]
name = "transparent-event-ingest"
path = "src/bin/event-ingest.rs"

[[bin]]
name = "transparent-filter-server"
path = "src/bin/server.rs"

[[bin]]
name = "shard-cutoff"
path = "src/bin/shard-cutoff.rs"

[[bin]]
name = "journal-inventory"
path = "src/bin/journal-inventory.rs"

[[bin]]
name = "event-spotcheck"
path = "src/bin/event-spotcheck.rs"

[[bin]]
name = "shard-verify"
path = "src/bin/shard-verify.rs"

[dependencies]
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "223626ffdd28bd1400dd0b62027a8f366665aa4f" }
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transparent-events = { path = "../../pir/transparent-events" }
transparent-filter = { path = "../../pir/transparent-filter" }
transparent-shard = { path = "../../pir/transparent-shard" }
transparent-shard-server = { path = "../transparent-shard-server" }
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", rev = "1faf150fc3648aae22c55a6b30f8f5a9b9ce934e" }
# Pinned to the same revision as `zakura-chain`, and it must stay that way: this
# opens the deployed node's RocksDB directly, so the on-disk format the code
# expects has to be the format the running `zakurad` wrote. The coordinator runs
# `zakurad 1.3.0+g1faf150fc364`.
zakura-state = { git = "https://github.com/zakura-core/zakura.git", rev = "1faf150fc3648aae22c55a6b30f8f5a9b9ce934e" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
