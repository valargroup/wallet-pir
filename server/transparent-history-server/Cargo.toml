[package]
name = "transparent-history-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "transparent_history_server"
path = "src/lib.rs"

[[bin]]
name = "transparent-history-server"
path = "src/bin/server.rs"

[dependencies]
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
# Reused for deserialize_first_dim_query and RowPlaintextIter. A second copy of
# the query and row encodings could drift from the one the deployed coordinator
# uses, and a drift there decodes to the wrong row rather than failing.
enhance-pir-server = { path = "../enhance-pir-server" }
hex = "0.4"
inspiring = { git = "https://github.com/valargroup/ipir-sp.git", rev = "83a3732062da3ceb58a603c18b6fa44e847c3418" }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "83a3732062da3ceb58a603c18b6fa44e847c3418", features = ["experimental-key-reuse"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["limit"] }
transparent-history-pir = { path = "../../pir/transparent-history" }

[dev-dependencies]
tempfile = "3"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
