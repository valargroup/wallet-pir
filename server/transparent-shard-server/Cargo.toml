[package]
name = "transparent-shard-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "transparent_shard_server"
path = "src/lib.rs"

[[bin]]
name = "transparent-shard-server"
path = "src/bin/server.rs"

[dependencies]
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
# Reused for deserialize_first_dim_query and RowPlaintextIter. A second copy of
# the query and row encodings could drift from the one the deployed coordinator
# uses, and a drift there decodes to the wrong row rather than failing.
enhance-pir-server = { path = "../enhance-pir-server" }
hex = "0.4"
inspiring = { git = "https://github.com/valargroup/ipir-sp.git", rev = "223626ffdd28bd1400dd0b62027a8f366665aa4f" }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "223626ffdd28bd1400dd0b62027a8f366665aa4f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transparent-filter = { path = "../../pir/transparent-filter" }
transparent-shard = { path = "../../pir/transparent-shard" }

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
transparent-events = { path = "../../pir/transparent-events" }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "223626ffdd28bd1400dd0b62027a8f366665aa4f" }
tower = { version = "0.5", features = ["util"] }
transparent-wallet = { path = "../../pir/transparent-wallet" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
