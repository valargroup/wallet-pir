[package]
name = "transparent-shard-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "transparent_shard_server"
path = "src/lib.rs"

[[bin]]
name = "transparent-shard-server"
path = "src/bin/server.rs"

[[bin]]
name = "shard-scaling"
path = "src/bin/shard-scaling.rs"

[[bin]]
name = "shard-residency"
path = "src/bin/shard-residency.rs"

[dependencies]
spiral-rs = { package = "valar-spiral-rs", git = "https://github.com/valargroup/spiral-rs.git", rev = "6f5b66c6a5a639827c6486c59d31c7ec2d4399a8" }
axum = "0.7"
http-body = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
# Reused for deserialize_first_dim_query and RowPlaintextIter. A second copy of
# the query and row encodings could drift from the one the deployed coordinator
# uses, and a drift there decodes to the wrong row rather than failing.
enhance-pir-server = { path = "../enhance-pir-server" }
hex = "0.4"
inspiring = { git = "https://github.com/valargroup/ipir-sp.git", rev = "61dc83e7410ff13ccfdd9ad1e830b711bd9080ed" }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "61dc83e7410ff13ccfdd9ad1e830b711bd9080ed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.36"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transparent-filter = { path = "../../pir/transparent-filter" }
transparent-shard = { path = "../../pir/transparent-shard" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
base64 = "0.22"
http-body = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
transparent-events = { path = "../../pir/transparent-events" }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "61dc83e7410ff13ccfdd9ad1e830b711bd9080ed" }
tower = { version = "0.5", features = ["util"] }
transparent-wallet = { path = "../../pir/transparent-wallet", features = ["reqwest"] }
transparent-wallet-store = { path = "../../pir/transparent-wallet-store" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
