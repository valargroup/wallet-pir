[workspace]
resolver = "2"
members = [
    "src/pir-publisher",
    "src/pir-query-server",
    "tools/pir-e2e-tests",
    "src/receiver/receiver-store",
    "src/receiver/receiver-indexer",
    "src/receiver/receiver-pir-server",
    "src/shared/pir-observability",
    "src/shared/pir-control",
    "src/shared/pir-runtime",
    "src/shared/pir-cuda",
    "src/shared/pir-pipeline",
    "src/shared/pir-publication",
    "src/shared/pir-sync-manager",
    "src/shared/pir-service-discovery",
    "src/shared/pir-serving",
    # Bounded node JSON-RPC transport, free of chain decoding.
    "src/shared/pir-node-rpc",
    # Zakura node reads and chain interpretation for the publishers and tools.
    "src/shared/pir-chain",
    # Protocol libraries, clients and stores.
    "src/enhance/enhance-shared",
    "src/status/status-shared",
    "src/status/status-publisher",
    "src/transparent/transparent-shared",
    # Services and operational dashboard.
    "src/enhance/enhance-publisher",
    "src/shared/pir-apm",
    "src/transparent/transparent-publisher",
    # Development and validation tools; package/binary names stay stable.
    "tools/enhance/client",
    "tools/enhance/native-certificate",
    "tools/enhance/loadtest",
    "tools/shared/pir-monitor",
    "tools/transparent",
]

# TEMPORARY: the wallet-libraries one-time swap detection branch, so CI runs
# before that change lands. Move back to a main revision once it merges.
[patch.crates-io]
zakura-filters = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "3b1042cd2abf3fa59835d35744f3a7c1fc8dd8b1" }
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "3b1042cd2abf3fa59835d35744f3a7c1fc8dd8b1" }
zakura-pir-protocol = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "3b1042cd2abf3fa59835d35744f3a7c1fc8dd8b1" }
zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "3b1042cd2abf3fa59835d35744f3a7c1fc8dd8b1" }
zakura-pir-query-server = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "3b1042cd2abf3fa59835d35744f3a7c1fc8dd8b1" }
zakura-pir-server-core = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "3b1042cd2abf3fa59835d35744f3a7c1fc8dd8b1" }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
inspiring = { git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
reinspiring = { git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
simplepir-kernel = { git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }

# Common uses the published 4.0.0 release, so it needs no patch.

# spiral-rs's Barrett reduction is intentionally wrapping: `barrett_raw_u128`
# computes `zy * cr1 + tmp3 + carry` and relies on it wrapping modulo 2^64. That
# is correct, but it panics under debug overflow checks whenever the input
# exceeds 2^64 — which IPIR's fused collapse does by design, since it
# accumulates a whole block into a u128 before reducing once. The algorithm's
# own bound assertion still runs; only this crate's arithmetic is exempted, and
# only so that `cargo test` in debug can exercise the IPIR path at all.
[profile.dev.package.valar-spiral-rs]
overflow-checks = false
# A named package entry does not inherit from `package."*"`, so repeat it here.
opt-level = 3

[profile.test.package.valar-spiral-rs]
overflow-checks = false
# A named package entry does not inherit from `package."*"`, so repeat it here.
opt-level = 3

# Deploy artifacts: maximum optimization, slow to link.
[profile.release]
lto = "fat"
codegen-units = 1

# Local iteration and the fast test tier. Debuginfo is trimmed to line tables
# (full debuginfo dominates link time and bloats target/debug), while
# dependencies are optimized so the crypto stack (Sinsemilla, pasta, blake2)
# does not run interpreted-slow under `cargo test`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

# Optimized codegen without whole-program LTO, for local and CI runs of the
# slow test tier. Not used for deploy artifacts.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# The fast runner caps the job at 6 GiB and deletes incremental sessions before
# this compile. A from-scratch rustc of this host runs out of memory when a
# few large codegen units are optimized together. Many small units keep that
# rustc inside the cap. Stable rustc has no flag for a per-crate codegen
# thread cap. Dependencies stay fully optimized, and deploy binaries stay on
# the fat-LTO release profile above. There is no incremental session to poison.
[profile.release-fast.package.pir-query-server]
opt-level = 1
codegen-units = 256
incremental = false
