[workspace]
resolver = "2"
members = [
    "src/receiver/receiver-store",
    "src/receiver/receiver-indexer",
    "src/receiver/receiver-pir-server",
    "src/shared/pir-observability",
    "src/shared/pir-control",
    "src/shared/pir-runtime",
    "src/shared/pir-pipeline",
    "src/shared/pir-serving",
    # Protocol libraries, clients and stores.
    "src/enhance/enhance-pir",
    "src/enhance/enhance-serving",
    "src/status/status-protocol",
    "src/status/status-serving",
    "src/status/status-publication",
    "src/transparent/transparent-blocks",
    "src/shared/transparent-server-backend",
    # Services and operational dashboard.
    "src/enhance/enhance-pir-server",
    "src/status/status-pir-server",
    "src/shared/pir-apm",
    "src/transparent/transparent-filter-server",
    "src/transparent/transparent-block-server",
    "src/transparent/transparent-shard-server",
    # Development and validation tools; package/binary names stay stable.
    "src/enhance/loadtest",
    "src/enhance/monitor",
    "src/transparent/transparent-loadtest",
    "src/transparent/transparent-regression",
    "src/transparent/transparent-measure",
]

# spiral-rs's Barrett reduction is intentionally wrapping: `barrett_raw_u128`
# computes `zy * cr1 + tmp3 + carry` and relies on it wrapping modulo 2^64. That
# is correct, but it panics under debug overflow checks whenever the input
# exceeds 2^64 — which IPIR's fused collapse does by design, since it
# accumulates a whole block into a u128 before reducing once. The algorithm's
# own bound assertion still runs; only this crate's arithmetic is exempted, and
# only so that `cargo test` in debug can exercise the IPIR path at all.
[profile.dev.package.valar-spiral-rs]
overflow-checks = false
# A named package entry does not inherit from `package."*"`, so repeat it here.
opt-level = 3

[profile.test.package.valar-spiral-rs]
overflow-checks = false
# A named package entry does not inherit from `package."*"`, so repeat it here.
opt-level = 3

# Deploy artifacts: maximum optimization, slow to link.
[profile.release]
lto = "fat"
codegen-units = 1

# Local iteration and the fast test tier. Debuginfo is trimmed to line tables
# (full debuginfo dominates link time and bloats target/debug), while
# dependencies are optimized so the crypto stack (Sinsemilla, pasta, blake2)
# does not run interpreted-slow under `cargo test`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

# Optimized codegen without whole-program LTO, for local and CI runs of the
# slow test tier. Not used for deploy artifacts.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
