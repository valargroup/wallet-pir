[package]
name = "enhance-schema9-worker-capacity-benchmark"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "225972648cc2982abfac66ba5b7a3930b223051a" }
inspiring = { git = "https://github.com/valargroup/ipir-sp.git", rev = "225972648cc2982abfac66ba5b7a3930b223051a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
rayon = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
sysinfo = "0.36"
tracing = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "enhance-worker-capacity"
path = "src/worker_capacity.rs"
