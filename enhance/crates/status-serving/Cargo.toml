[package]
name = "status-serving"
version = "0.0.1"
edition = "2021"
description = "Status PIR serving runtime: generations, distributed controller and workers; no chain reading or publication"
publish = false

[features]
default = []
native-reinspiring = ["enhance-serving/native-reinspiring", "dep:reinspiring"]
cuda = ["enhance-serving/cuda"]

[dependencies]
# Durable artifact writes and the native hint runtime are shared with Enhance serving.
enhance-serving = { path = "../enhance-serving" }
pir-control = { path = "../../../shared/pir-control", features = ["admission"] }
pir-runtime = { path = "../../../shared/pir-runtime" }
rayon = "1"
reinspiring = { version = "=0.1.3-rc.1", optional = true }
axum = "0.7"
enhance-pir = { path = "../enhance-pir", version = "=0.0.1" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
ipir-sp = "=0.1.0-rc.7"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
