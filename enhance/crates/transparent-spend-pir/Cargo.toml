[package]
name = "transparent-spend-pir"
version = "0.1.0"
edition = "2021"

[lib]
name = "transparent_spend_pir"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "dac5b050cfa00770405f9d6b464b8adb2b17a3c0" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros"] }
