[package]
name = "enhance-pir"
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Client and protocol types for private retrieval of Ironwood note enhancement records"
documentation = "https://docs.rs/enhance-pir"
readme = "README.md"
keywords = ["pir", "zcash", "privacy"]

[lib]
name = "enhance_pir"
path = "src/lib.rs"

[[bin]]
name = "enhance-pir-cli"
path = "src/bin/client.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:tokio"]

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"], optional = true }
hex = "0.4"
ipir-sp = { version = "=0.1.0-rc.2", git = "https://github.com/valargroup/ipir-sp.git", rev = "1d8aea341d844df97ef6eb244c24b0a050eb3e9b" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
