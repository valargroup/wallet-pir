[package]
name = "enhance-serving"
version = "0.0.1"
edition = "2021"
description = "Enhance PIR coordinator and worker serving runtime; no chain reading or ingestion"
publish = false

[features]
# Restore the larger ordinary-domain test campaigns during full qualification.
qualification-tests = []
default = []
native-reinspiring = ["enhance-pir/native-reinspiring", "dep:pir-native", "dep:reinspiring", "ipir-sp/native-reinspiring"]
cuda = ["ipir-sp/cuda", "dep:simplepir-kernel"]
# Exposes the journal's injected I/O failure to the application's ingest tests.
fault-injection = []

[dependencies]
pir-observability = { path = "../../../shared/pir-observability" }
pir-control = { path = "../../../shared/pir-control", features = ["admission"] }
pir-runtime = { path = "../../../shared/pir-runtime" }
reinspiring = { version = "=0.1.3-rc.1", optional = true }
pir-native = { package = "zakura-pir-native", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "886db40137caef486d32d5bc594b2c20b1dde75e", optional = true }
simplepir-kernel = { version = "=0.1.0-rc.4", optional = true, features = ["cuda"] }
axum = "0.7"
base64 = "0.22"
enhance-pir = { path = "../enhance-pir", version = "=0.0.1" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
hdrhistogram = "7"
http-body = "1"
inspiring = "=0.1.0-rc.3"
ipir-sp = "=0.1.0-rc.7"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"

[dev-dependencies]
simplepir-kernel = "=0.1.0-rc.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
