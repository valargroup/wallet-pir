[package]
name = "enhance-serving"
version = "0.0.1"
edition = "2021"
description = "Enhance PIR coordinator and worker serving runtime; no chain reading or ingestion"
publish = false

[features]
# Compile campaign-only correctness tests in full qualification.
full-tests = ["enhance-runtime/full-tests"]
default = []
native-reinspiring = ["enhance-runtime/native-reinspiring"]
cuda = ["enhance-runtime/cuda"]
# Exposes the journal's injected I/O failure to the application's ingest tests.
fault-injection = ["enhance-runtime/fault-injection"]

[dependencies]
enhance-runtime = { path = "../enhance-runtime" }
pir-observability = { path = "../../../shared/pir-observability" }
pir-control = { path = "../../../shared/pir-control", features = ["admission"] }
pir-runtime = { path = "../../../shared/pir-runtime" }
axum = "0.7"
base64 = "0.22"
enhance-pir = { path = "../enhance-pir", version = "=0.0.1" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
hdrhistogram = "7"
http-body = "1"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"

[dev-dependencies]
enhance-runtime = { path = "../enhance-runtime", features = ["testing"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
