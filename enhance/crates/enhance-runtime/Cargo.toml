[package]
name = "enhance-runtime"
version = "0.0.1"
edition = "2021"
description = "Enhance PIR execution, prepared artifacts and journal storage"
publish = false

[features]
# Compile campaign-only correctness tests in full qualification.
full-tests = []
default = []
native-reinspiring = ["enhance-pir/native-reinspiring", "dep:pir-native", "dep:reinspiring", "ipir-sp/native-reinspiring"]
cuda = ["ipir-sp/cuda", "dep:simplepir-kernel", "simplepir-kernel/cuda"]
# Exposes the journal's injected I/O failure to the application's ingest tests.
fault-injection = []
## Fault kernels used by the real worker HTTP and runtime tests.
testing = ["dep:simplepir-kernel"]

[dependencies]
pir-control = { path = "../../../shared/pir-control" }
pir-runtime = { path = "../../../shared/pir-runtime" }
reinspiring = { version = "=0.1.3-rc.1", optional = true }
pir-native = { package = "zakura-pir-native", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "886db40137caef486d32d5bc594b2c20b1dde75e", optional = true }
simplepir-kernel = { version = "=0.1.0-rc.4", optional = true }
axum = "0.7"
base64 = "0.22"
enhance-pir = { path = "../enhance-pir", version = "=0.0.1" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
inspiring = "=0.1.0-rc.3"
ipir-sp = "=0.1.0-rc.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"

[dev-dependencies]
simplepir-kernel = "=0.1.0-rc.4"
tempfile = "3"
