[package]
name = "pir-monitor"
version = "0.1.0"
edition = "2021"
publish = false

[features]
native-reinspiring = ["enhance-pir/native-reinspiring"]

[dependencies]
anyhow = "1"
axum = "0.7"
enhance-pir = { path = "../../crates/enhance-pir" }
pir-apm = { path = "../../services/pir-apm" }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
