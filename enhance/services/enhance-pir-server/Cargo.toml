[package]
name = "enhance-pir-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "enhance_pir_server"
path = "src/lib.rs"

[[bin]]
name = "enhance-pir-server"
path = "src/bin/server.rs"

[[bin]]
name = "enhance-pir-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "enhance-pir-qualify"
path = "src/bin/qualify.rs"

[[bin]]
name = "enhance-pir-v4"
path = "src/bin/v4.rs"

[dependencies]
axum = "0.7"
base64 = "0.22"
enhance-pir = { path = "../../crates/enhance-pir" }
transparent-spend-pir = { path = "../../crates/transparent-spend-pir" }
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hdrhistogram = "7"
inspiring = { git = "https://github.com/valargroup/ipir-sp.git", rev = "dac5b050cfa00770405f9d6b464b8adb2b17a3c0" }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "dac5b050cfa00770405f9d6b464b8adb2b17a3c0" }
prometheus = { version = "0.13", default-features = false, features = ["process"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.36"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", rev = "1faf150fc3648aae22c55a6b30f8f5a9b9ce934e" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
orchard = { package = "zakura-orchard", version = "=1.0.1", default-features = false }
zcash_note_encryption = "=0.4.2"
