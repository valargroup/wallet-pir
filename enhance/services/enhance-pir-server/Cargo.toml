[package]
name = "enhance-pir-server"
version = "0.0.1"
edition = "2021"

[lib]
name = "enhance_pir_server"
path = "src/lib.rs"

[[bin]]
name = "enhance-pir-server"
path = "src/bin/server.rs"

[[bin]]
name = "status-pir"
path = "src/bin/status.rs"

[features]
default = []
native-reinspiring = ["enhance-pir/native-reinspiring", "dep:pir-native", "dep:reinspiring", "ipir-sp/native-reinspiring"]
cuda = ["ipir-sp/cuda", "dep:simplepir-kernel"]

[dependencies]
pir-control = { path = "../../../shared/pir-control", features = ["admission"] }
rayon="1"
reinspiring = { version = "=0.1.3-rc.1", optional = true }
pir-native = { path = "../../../shared/pir-native", optional = true }
simplepir-kernel = { version = "=0.1.0-rc.4", optional = true, features = ["cuda"] }
axum = "0.7"
base64 = "0.22"
enhance-pir = { path = "../../crates/enhance-pir", version = "=0.0.1" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
hdrhistogram = "7"
http-body = "1"
inspiring = "=0.1.0-rc.3"
ipir-sp = "=0.1.0-rc.7"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Node reads, Enhance extraction, fees and Status chain reads, pinned to an exact
# wallet-libraries revision.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "513537bec79ea834a5eb145c3e01883fc3dfda5e" }

[dev-dependencies]
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "513537bec79ea834a5eb145c3e01883fc3dfda5e", features = ["testing"] }
# Independent wallet Enhance client, which is native-only, and the synthetic
# Ironwood output fixture that authenticates PIR-returned records.
zakura-pir-enhance = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "18efb63b4e4d48826d7a4029588ccafa9e48c34c", default-features = false, features = ["testing"] }
simplepir-kernel = "=0.1.0-rc.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "cuda_domain"
required-features = ["cuda"]

[[example]]
name = "native_certificate"
required-features = ["native-reinspiring"]
