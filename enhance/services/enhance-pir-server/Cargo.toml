[package]
name = "enhance-pir-server"
version = "0.0.1"
edition = "2021"

[lib]
name = "enhance_pir_server"
path = "src/lib.rs"

[[bin]]
name = "enhance-pir-server"
path = "src/bin/server.rs"

[[bin]]
name = "status-pir"
path = "src/bin/status.rs"

[features]
default = []
native-reinspiring = ["enhance-serving/native-reinspiring", "status-serving/native-reinspiring", "enhance-pir/native-reinspiring", "dep:pir-native", "dep:reinspiring", "ipir-sp/native-reinspiring"]
cuda = ["enhance-serving/cuda", "status-serving/cuda", "ipir-sp/cuda"]

[dependencies]
pir-pipeline = { path = "../../../shared/pir-pipeline" }
# Serving libraries this application composes with chain reading and ingestion.
enhance-serving = { path = "../../crates/enhance-serving" }
status-serving = { path = "../../crates/status-serving" }
pir-control = { path = "../../../shared/pir-control", features = ["admission"] }
reinspiring = { version = "=0.1.3-rc.1", optional = true }
pir-native = { package = "zakura-pir-native", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "609cbd309625938ba70c115147a21b4c0db9fdf5", optional = true }
axum = "0.7"
enhance-pir = { path = "../../crates/enhance-pir", version = "=0.0.1" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Node reads, Enhance extraction, fees and Status chain reads, pinned to an exact
# wallet-libraries revision.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "609cbd309625938ba70c115147a21b4c0db9fdf5" }

[dev-dependencies]
# Independent Status client for the real HTTP runtime regression.
zakura-pir-status = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "609cbd309625938ba70c115147a21b4c0db9fdf5" }
enhance-serving = { path = "../../crates/enhance-serving", features = ["fault-injection"] }
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "609cbd309625938ba70c115147a21b4c0db9fdf5", features = ["testing"] }
# Independent wallet Enhance client, which is native-only, and the synthetic
# Ironwood output fixture that authenticates PIR-returned records.
zakura-pir-enhance = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "609cbd309625938ba70c115147a21b4c0db9fdf5", default-features = false, features = ["testing"] }
tempfile = "3"
# Used only by integration tests and examples.
base64 = "0.22"
inspiring = "=0.1.0-rc.3"
rayon = "1"
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "cuda_domain"
required-features = ["cuda"]

[[example]]
name = "native_certificate"
required-features = ["native-reinspiring"]
