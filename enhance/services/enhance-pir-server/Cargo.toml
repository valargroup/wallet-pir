[package]
name = "enhance-pir-server"
version = "0.0.1"
edition = "2021"

[lib]
name = "enhance_pir_server"
path = "src/lib.rs"

[[bin]]
name = "enhance-pir-server"
path = "src/bin/server.rs"

[features]
default = []
cuda = ["ipir-sp/cuda", "dep:simplepir-kernel"]

[dependencies]
simplepir-kernel = { git = "https://github.com/valargroup/ipir-sp.git", rev = "a16f456dfaf5fadca77d472c0c502a93cf0977d0", optional = true, features = ["cuda"] }
axum = "0.7"
base64 = "0.22"
enhance-pir = { path = "../../crates/enhance-pir", version = "=0.0.1" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
hdrhistogram = "7"
http-body = "1"
inspiring = { git = "https://github.com/valargroup/ipir-sp.git", rev = "a16f456dfaf5fadca77d472c0c502a93cf0977d0" }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "a16f456dfaf5fadca77d472c0c502a93cf0977d0" }
prometheus = { version = "0.13", default-features = false, features = ["process"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", rev = "1faf150fc3648aae22c55a6b30f8f5a9b9ce934e" }

[dev-dependencies]
simplepir-kernel = { git = "https://github.com/valargroup/ipir-sp.git", rev = "a16f456dfaf5fadca77d472c0c502a93cf0977d0" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
orchard = { package = "zakura-orchard", version = "=1.0.1", default-features = false }
zcash_note_encryption = "=0.4.2"

[[example]]
name = "cuda_domain"
required-features = ["cuda"]
