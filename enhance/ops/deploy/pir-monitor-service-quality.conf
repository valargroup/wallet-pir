# Host drop-in for the monitor's service probes (Status, Transparent and receiver):
# /etc/systemd/system/pir-monitor.service.d/90-service-quality.conf.
[Service]
Environment=PIR_MONITOR_SERVICE_PROBES_CONFIG=/etc/pir-monitor/service-probes.json
Environment=PIR_MONITOR_SERVICE_ALERT_MODE=shadow
# The monitor host's own node cookie for the probes' chain checks, read at start;
# restart the monitor after the node rotates it.
LoadCredential=chain-rpc-cookie:/etc/pir-monitor/credentials/chain-rpc-cookie
