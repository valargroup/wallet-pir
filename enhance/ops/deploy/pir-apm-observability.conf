[Service]
StateDirectory=pir-apm
StateDirectoryMode=0700
Environment=PIR_APM_STATE_PATH=/var/lib/pir-apm/incidents.sqlite
Environment=PIR_APM_ALERT_MODE=shadow
Environment=PIR_APM_CHAIN_RPC_URL=http://127.0.0.1:8232
Environment=PIR_APM_CHAIN_RPC_COOKIE=/run/credentials/pir-apm.service/chain-cookie
# LoadCredential reads the node cookie at start; restart APM after node-cookie rotation.
LoadCredential=chain-cookie:/root/.cache/zakura/.cookie
Environment=PIR_APM_PEER_STATUS_URL=https://monitor-pir.valargroup.dev/monitor-status
Environment=PIR_APM_PUBLIC_URL=https://enhance-pir.valargroup.dev/apm/
# Optional Transparent scaler alerts (Track A); set only once the scaler writes this file.
#Environment=PIR_APM_SCALER_STATUS=/opt/transparent-publisher/scaler/status.json
#Environment=PIR_APM_SCALING_ALERT_MODE=shadow
