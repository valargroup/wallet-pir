# Status PIR role descriptor; templates sit beside it.
[services.status]
root = "/opt/status-pir"
binary = "status-pir"
artifact_kinds = ["status-pir"]
self_check = ["--help"]
min_free_bytes = 1073741824
order = ["worker", "external-worker", "router", "controller"]
# The supervised control sessions that carry the controller's forwards.
ancillary = ["supervision"]
# Supplied by the inventory's services.status.template_vars.
template_vars = ["NETWORK"]

[services.status.roles.worker]
unit = "status-worker.service"
mode = "template"
template = "status-worker.service.in"
# Ready needs a fresh controller heartbeat and manifest.
health = "http://127.0.0.1:8481/control/health"
ready = { field = "ready", equals = true }
ready_timeout = 180

[services.status.roles.external-worker]
unit = "status-pir-worker.service"
mode = "role"
template = "status-worker.role.service"
renderer = "ops.status.lib.roles:status_worker"
optional = true
# Settings: network_hex, listen, artifact_origin, state_dir, cuda?, limits?.
# Identity carries binary_sha256; readiness needs the controller's fence,
# activation and heartbeat, which the deploy never manufactures.
health = "http://{listen}/control/identity"
ready_timeout = 180

[services.status.roles.router]
unit = "status-router.service"
mode = "template"
template = "status-router.service.in"
health = "http://127.0.0.1:8482/control/health"
ready = { field = "ready", equals = true }
ready_timeout = 180

[services.status.roles.controller]
unit = "status-controller-qualification.service"
# Drop-ins from earlier rollouts carry its live arguments (controller-native.json,
# --public-listen); the managed drop-in keeps them and swaps only the binary.
mode = "exec-drop-in"
template = "status-controller-qualification.service.in"
health = "http://127.0.0.1:8480/internal/health"
ready_timeout = 180
