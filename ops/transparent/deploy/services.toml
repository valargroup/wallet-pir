# Role discovery and process status use the common inventory. Publication,
# activation and rollback stay in the named product driver, not the binary engine.
# Unit names are defaults; the operator inventory names the actual v12/4k8 units.
# The journal writer is a duty of one controller instance, not a unit of its
# own; public routing is a shared ancillary unit listed once in the inventory.
[services.transparent-history]
driver = "transparent-history"
root = "/opt/transparent-publisher"
binary = "transparent-shard-server"
order = ["worker", "external-worker", "provider", "controller"]
ancillary = ["routing"]

[services.transparent-history.roles.worker]
unit = "transparent-shard-server.service"
mode = "exec-drop-in"
health = "http://{listen}/v1/health"
ready = { field = "ready", equals = true }
ready_url = "http://{listen}/v1/ready"

# An external worker: rendered by ops/transparent/lib/roles.py from the
# inventory entry's settings and installed only where the entry says
# `"install": true`. The shared engine installs, verifies and rolls back the
# unit; publications, assignments and activation stay with the controller.
[services.transparent-history.roles.external-worker]
unit = "transparent-history-worker.service"
mode = "role"
template = "transparent-history-worker.role.service"
renderer = "ops.transparent.lib.roles:history_worker"
optional = true
# /v1/ready carries identity and `ready`, and answers 503 until the loaded set
# is warm; /v1/health carries no readiness.
health = "http://{listen}/v1/ready"
ready = { field = "ready", equals = true }
ready_timeout = 900

# Standalone history only; no fleet inventory is needed by the role renderer.
[services.transparent-history.roles.provider]
unit = "transparent-history-provider.service"
mode = "role"
template = "transparent-history-provider.role.service"
renderer = "ops.transparent.lib.roles:history_provider"
optional = true
# Exclusive state must be checked by its unit user while stopped, never by the
# fleet deploy identity against a live provider. Rendering/private status remain available.
shared_lifecycle = false
health = "http://{listen}/v1/provider-status"
ready_url = "http://{listen}/v1/ready"
ready_timeout = 900

[services.transparent-history.roles.controller]
unit = "transparent-v12-publish-controller.service"
mode = "exec-drop-in"
health = "http://{listen}/v1/status"
responsibilities = ["journal-writer"]
