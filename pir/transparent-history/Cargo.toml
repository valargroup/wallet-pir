[package]
name = "transparent-history-pir"
version = "0.1.0"
edition = "2021"

[lib]
name = "transparent_history_pir"
path = "src/lib.rs"

[[bin]]
name = "transparent-history-cli"
path = "src/bin/cli.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
inspiring = { git = "https://github.com/valargroup/ipir-sp.git", rev = "83a3732062da3ceb58a603c18b6fa44e847c3418" }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "83a3732062da3ceb58a603c18b6fa44e847c3418", features = ["experimental-key-reuse"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
