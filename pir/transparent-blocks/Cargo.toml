[package]
name = "transparent-blocks"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
flate2 = "1"
hex = "0.4"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
transparent-events = { path = "../transparent-events" }
transparent-wallet = { path = "../transparent-wallet" }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"
