[package]
name = "txid-sizing-export"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
# The included extractor gates its tests on this feature. Keep those regressions
# in ordinary exporter tests; their synthetic-block dependencies stay dev-only.
default = ["fixtures"]
fixtures = []

[dependencies]
rusqlite = "0.37"
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
sha2 = "0.10"
thiserror = "2"
# Transaction and block reads through the server adapter, at the revision the
# services pin.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "12c3b438c80f3fe7a2f7bf2fbb25c41f556edbb6", default-features = false, features = ["transparent"] }

zakura-pir-protocol = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "12c3b438c80f3fe7a2f7bf2fbb25c41f556edbb6", default-features = false, features = ["transparent"] }
zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "12c3b438c80f3fe7a2f7bf2fbb25c41f556edbb6", default-features = false, features = ["transparent"] }

[build-dependencies]
sha2 = "0.10"
serde_json = "1"
toml = "0.8.23"

[dev-dependencies]
toml = "0.8.23"
# Raw synthetic blocks for the shared extractor's tests.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "12c3b438c80f3fe7a2f7bf2fbb25c41f556edbb6", default-features = false, features = ["transparent", "testing"] }

zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "12c3b438c80f3fe7a2f7bf2fbb25c41f556edbb6", default-features = false, features = ["transparent", "testing"] }

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

# Keep Common on the same revision as the service workspace.
[patch.crates-io]
zakura-address = { git = "https://github.com/zakura-core/common.git", rev = "36c0f2134ee028545d822ac9abdc764cef0f8dcb" }
