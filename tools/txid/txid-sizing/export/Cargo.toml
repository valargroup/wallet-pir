[package]
name = "txid-sizing-export"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
# The included extractor gates its tests on this feature. Keep those regressions
# in ordinary exporter tests; their synthetic-block dependencies stay dev-only.
default = ["fixtures"]
fixtures = []

[dependencies]
rusqlite = "0.37"
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
sha2 = "0.10"
thiserror = "2"
# Transaction and block reads through the services' local server adapter.
zakura-server-chain = { path = "../../../../src/shared/pir-chain", default-features = false, features = ["transparent"] }

zakura-pir-protocol = { version = "=0.0.1-rc1", default-features = false, features = ["transparent"] }
zakura-pir-publisher = { version = "=0.0.1-rc1", default-features = false, features = ["transparent"] }

[build-dependencies]
sha2 = "0.10"
serde_json = "1"
toml = "0.8.23"

[dev-dependencies]
toml = "0.8.23"
# Raw synthetic blocks for the shared extractor's tests.
zakura-server-chain = { path = "../../../../src/shared/pir-chain", default-features = false, features = ["transparent", "testing"] }

zakura-pir-client = { version = "=0.0.1-rc1", default-features = false, features = ["transparent", "testing"] }

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

# Match the service workspace's library family and published Common release.
[patch.crates-io]
zakura-filters = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "aacbc9705a667ee0009cc55a45f6cd09ef96fd3e" }
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "aacbc9705a667ee0009cc55a45f6cd09ef96fd3e" }
zakura-pir-protocol = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "aacbc9705a667ee0009cc55a45f6cd09ef96fd3e" }
zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "aacbc9705a667ee0009cc55a45f6cd09ef96fd3e" }
zakura-pir-query-server = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "aacbc9705a667ee0009cc55a45f6cd09ef96fd3e" }
zakura-pir-server-core = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "aacbc9705a667ee0009cc55a45f6cd09ef96fd3e" }
zakura-receiver-crypto = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "aacbc9705a667ee0009cc55a45f6cd09ef96fd3e" }
zakura-receiver-directory = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "aacbc9705a667ee0009cc55a45f6cd09ef96fd3e" }
zakura-receiver-pir = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "aacbc9705a667ee0009cc55a45f6cd09ef96fd3e" }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
inspiring = { git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
reinspiring = { git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
simplepir-kernel = { git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }

# Common uses the published 4.0.0-rc2 family.
