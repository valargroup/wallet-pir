[services.query-server]
root = "/opt/wallet-pir-query"
binary = "pir-query-server"
artifact_kinds = ["pir-query-server", "pir-query-server-cuda"]
self_check = ["--help"]
min_free_bytes = 21474836480
order = ["combined"]

[services.query-server.roles.combined]
unit = "wallet-pir-query.service"
mode = "role"
template = "pir-query-server.service"
renderer = "wallet_pir_ops.query_role:combined"
optional = true
health = "http://{management_listen}/health"
ready_url = "http://{management_listen}/ready"
ready = { field = "ready", equals = true }
ready_timeout = 3600
