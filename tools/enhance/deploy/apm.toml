# Opt-in sidecar updates share the production lock without changing serving roles.
[services.apm]
root = "/opt/pir-apm"
binary = "pir-apm"
artifact_kinds = ["enhance-pir"]
self_check = ["--help"]
min_free_bytes = 1073741824
order = ["server"]

[services.apm.roles.server]
unit = "pir-apm.service"
mode = "exec-drop-in"
health = "http://127.0.0.1:3002/healthz"
ready_timeout = 240
# This existing loader reads systemd credentials before execing the sidecar.
# Pin it instead of replacing or copying credentials into a deployment request.
launcher = [
  { path = "/usr/bin/python3", sha256 = "e50d468e8b0adfb05733f5b87b3cff34829c4a8c1aea50c865aa8bdfe4bb150f" },
  { path = "/opt/enhance-pir/releases/observability-20260926/credential-exec.py", sha256 = "8f7dda08e57251db817c3422c38a2df7a1b1618214af08aaf1c33ef3be3afaa2" },
]
