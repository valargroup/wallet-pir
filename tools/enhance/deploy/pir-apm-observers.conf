# Host drop-in for central collection from per-host sidecars:
# /etc/systemd/system/pir-apm.service.d/80-observers.conf. The observer
# inventory and these credentials are installed by wallet-pir-monitoring.py
# (`install-observers`, `install-credentials --role collector`). The host family
# starts in the inventory's mode; other alert families keep their own modes.
[Service]
Environment=PIR_APM_OBSERVERS=/etc/pir-apm/observers.json
LoadCredential=collector.pem:/etc/pir-apm/credentials/collector.pem
LoadCredential=collector.key:/etc/pir-apm/credentials/collector.key
LoadCredential=monitoring-ca.pem:/etc/pir-apm/credentials/monitoring-ca.pem
