[package]
name = "enhance-pir-exercise"
version = "0.0.1"
edition = "2021"
description = "Synthetic Enhance publication and query workloads against isolated, unregistered workers"
publish = false

[[bin]]
name = "enhance-pir-exercise"
path = "src/main.rs"

[dependencies]
enhance-publisher = { path = "../../../src/shared/pir-publisher/enhance" }
enhance-query-server = { path = "../../../src/enhance/enhance-query-server" , features = ["client"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
