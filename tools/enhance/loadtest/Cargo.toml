[package]
name = "enhance-pir-load-test"
version = "0.0.1"
edition = "2021"
publish = false

[features]
native-reinspiring = ["enhance-shared/native-reinspiring"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
enhance-shared = { path = "../../../src/enhance/enhance-shared" , features = ["client"] }
hdrhistogram = "7"
humantime = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
