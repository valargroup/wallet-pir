[package]
name = "native-certificate"
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
publish = false
description = "Export native noise certificates for Enhance and Status snapshots"

[[bin]]
name = "native_certificate"
path = "src/main.rs"

[dependencies]
enhance-query-server = { path = "../../../src/enhance/enhance-query-server", features = ["native-reinspiring"] }
status-query-server = { path = "../../../src/status/status-query-server", features = ["native-reinspiring"] }
ipir-sp = "=0.1.0-rc.7"
rayon = "1"
reinspiring = "=0.1.3-rc.1"
serde_json = "1"
sha2 = "0.10"
zakura-pir-server-core = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2f87e6f235dc16840be1dd7fc88e6dd06f0a268", default-features = false }
