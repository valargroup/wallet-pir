[package]
name = "native-certificate"
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
publish = false
description = "Export native noise certificates for Enhance and Status snapshots"

[features]
default = []
# Kept off by default so a fast build that names this package does not switch
# Enhance and Status serving libraries onto native arithmetic.
native-reinspiring = [
    "dep:enhance-shared",
    "dep:status-shared",
    "dep:ipir-sp",
    "dep:rayon",
    "dep:reinspiring",
    "dep:zakura-pir-server-core",
    "enhance-shared/native-reinspiring",
    "status-shared/native-reinspiring",
]

[[bin]]
name = "native_certificate"
path = "src/main.rs"
required-features = ["native-reinspiring"]

[dependencies]
enhance-shared = { path = "../../../src/enhance/enhance-shared", optional = true }
status-shared = { path = "../../../src/status/status-shared", optional = true }
ipir-sp = { version = "=0.1.0-rc.7", optional = true }
rayon = { version = "1", optional = true }
reinspiring = { version = "=0.1.3-rc.1", optional = true }
serde_json = "1"
sha2 = "0.10"
zakura-pir-server-core = { version = "=0.0.1-rc4", default-features = false, optional = true }
