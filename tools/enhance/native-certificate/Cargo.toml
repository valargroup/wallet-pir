[package]
name = "native-certificate"
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
publish = false
description = "Export native noise certificates for Enhance and Status snapshots"

[features]
default = []
# Kept off by default so a fast build that names this package does not switch
# Enhance and Status query libraries onto native arithmetic.
native-reinspiring = [
    "dep:enhance-query-server",
    "dep:status-query-server",
    "dep:ipir-sp",
    "dep:rayon",
    "dep:reinspiring",
    "dep:zakura-pir-server-core",
    "enhance-query-server/native-reinspiring",
    "status-query-server/native-reinspiring",
]

[[bin]]
name = "native_certificate"
path = "src/main.rs"
required-features = ["native-reinspiring"]

[dependencies]
enhance-query-server = { path = "../../../src/enhance/enhance-query-server", optional = true }
status-query-server = { path = "../../../src/status/status-query-server", optional = true }
ipir-sp = { version = "=0.1.0-rc.7", optional = true }
rayon = { version = "1", optional = true }
reinspiring = { version = "=0.1.3-rc.1", optional = true }
serde_json = "1"
sha2 = "0.10"
zakura-pir-server-core = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2f87e6f235dc16840be1dd7fc88e6dd06f0a268", default-features = false, optional = true }
