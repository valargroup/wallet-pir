[package]
name = "enhance-pir-client"
version = "0.0.1"
edition = "2021"
description = "Diagnostic Enhance PIR command-line client; performs no wallet acceptance or note authentication"
publish = false

[[bin]]
name = "enhance-pir-cli"
path = "src/main.rs"

[features]
native-reinspiring = ["enhance-query-server/native-reinspiring"]

[dependencies]
enhance-query-server = { path = "../../../src/enhance/enhance-query-server" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
hex = "0.4"
serde_json = "1"
