#cloud-config
# Binaries are cross-compiled and installed under /opt/receiver-pir/releases, so
# the host needs no build tools.
package_update: true
packages: [ca-certificates, curl, ufw, caddy]
runcmd:
  - [useradd, --system, --home-dir, /srv/receiver-pir, --shell, /usr/sbin/nologin, receiver-pir]
  - [install, -d, -m, '0755', /opt/receiver-pir/releases, /etc/receiver-pir]
  - [install, -d, -o, receiver-pir, -g, receiver-pir, -m, '0750', /srv/receiver-pir]
  - [ufw, allow, '22/tcp']
  - [ufw, allow, '80/tcp']
  - [ufw, allow, '443/tcp']
  # Health for the PIR monitor; the cloud firewall narrows this further.
  - [ufw, allow, from, 10.70.0.0/16, to, any, port, '18380', proto, tcp]
  - [ufw, --force, enable]
