# Keep the existing Receiver host, installation root and publisher unit identity.
[services.receiver]
root = "/opt/receiver-pir"
binary = "pir-publisher"
artifact_kinds = ["receiver-pir"]
self_check = ["--help"]
min_free_bytes = 1073741824
order = ["server", "query"]
ancillary = ["routing"]

[services.receiver.roles.server]
unit = "receiver-pir.service"
mode = "role"
template = "receiver-pir.service.in"
renderer = "tools.receiver.lib.roles:publisher"
health = "http://{management_listen}/health"
ready_url = "http://{management_listen}/ready"
ready = { field = "ready", equals = true }
ready_timeout = 300

[services.receiver.roles.query]
unit = "receiver-query.service"
binary = "pir-query-server"
mode = "role"
template = "../deploy/receiver-query.service"
renderer = "tools.receiver.lib.roles:query"
optional = true
health = "http://{management_listen}/health"
ready_url = "http://{management_listen}/ready"
ready = { field = "ready", equals = true }
ready_timeout = 600
