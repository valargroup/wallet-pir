# Status PIR role descriptor; templates sit beside it.
# Worker and router unit/configuration changes are installed and rolled back together.
[services.status]
root = "/opt/status-pir"
binary = "pir-publisher"
artifact_kinds = ["status-pir"]
self_check = ["--help"]
min_free_bytes = 1073741824
order = ["worker", "external-worker", "router"]
# The supervised SSH sessions carry private monitoring and wallet-query forwards.
ancillary = ["supervision"]

[services.status.roles.worker]
unit = "status-worker.service"
binary = "pir-query-server"
mode = "role"
template = "status-worker.service.in"
renderer = "tools.status.lib.roles:worker"
# Ready needs a verified, canonical and fresh HTTPS publication.
health = "http://127.0.0.1:8481/control/health"
ready = { field = "ready", equals = true }
ready_timeout = 180

[services.status.roles.external-worker]
unit = "status-pir-worker.service"
binary = "pir-query-server"
mode = "role"
template = "status-worker.role.service"
renderer = "tools.status.lib.roles:status_worker"
optional = true
# Settings: network_hex, listen, publisher, state_dir, cuda?, limits?.
# Identity carries binary_sha256; serving readiness requires autonomous HTTPS synchronization.
health = "http://{listen}/control/identity"
ready_timeout = 180

[services.status.roles.router]
unit = "status-router.service"
binary = "pir-query-server"
mode = "role"
template = "status-router.service.in"
renderer = "tools.status.lib.roles:router"
health = "http://127.0.0.1:8482/control/health"
ready = { field = "ready", equals = true }
ready_timeout = 180
