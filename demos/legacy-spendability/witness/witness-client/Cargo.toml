[package]
name = "witness-client"
version = "0.1.0"
edition = "2021"

[features]
default = []
# YPIR is the default PIR backend: the client code selects it with
# `cfg(not(feature = "ipir"))`, so the `ypir` crate is a hard dependency and
# cannot be made optional. This feature is a no-op kept so that
# `--features ypir` and `--all-features` work uniformly across the workspace.
ypir = []
ipir = ["dep:ipir-sp", "dep:inspiring"]

[dependencies]
witness-types = { path = "../witness-types" }
pir-types = { path = "../../shared/pir-types" }
zakura-receiver-crypto = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "18efb63b4e4d48826d7a4029588ccafa9e48c34c" }
ypir = { package = "valar-ypir", git = "https://github.com/valargroup/ypir.git", branch = "valar/artifact", default-features = false }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "e875404cef33661906ab60af236dfb327e6b28b1", optional = true }
inspiring = { git = "https://github.com/valargroup/ipir-sp.git", rev = "e875404cef33661906ab60af236dfb327e6b28b1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
commitment-tree-db = { path = "../commitment-tree-db" }
commitment-ingest = { path = "../commitment-ingest" }
chain-ingest = { path = "../../shared/chain-ingest" }
witness-server = { path = "../witness-server" }
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
