[package]
name = "commitment-tree-db"
version = "0.1.0"
edition = "2021"

[dependencies]
witness-types = { path = "../witness-types" }
zakura-receiver-crypto = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "aab460222a9f38f1f9f70f0d2f04ba9ac977b2ea" }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
pir-types = { path = "../../shared/pir-types" }
chain-ingest = { path = "../../shared/chain-ingest" }
commitment-ingest = { path = "../commitment-ingest" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
