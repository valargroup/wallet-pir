[package]
name = "transparent-wallet"
version = "0.1.0-rc.4"
edition = "2021"
description = "Wallet-side private recovery of transparent history over PIR"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"

[lib]
name = "transparent_wallet"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
transparent-events = { package = "zakura-transparent-events", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "2abe75b56c1a4e4fac6de4f22e61527937e2598e" }
transparent-filter = { package = "zakura-transparent-filter", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "2abe75b56c1a4e4fac6de4f22e61527937e2598e" }
transparent-native = { package = "zakura-transparent-native", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "2abe75b56c1a4e4fac6de4f22e61527937e2598e" }
transparent-shard = { package = "zakura-transparent-shard", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "2abe75b56c1a4e4fac6de4f22e61527937e2598e" }

[features]
# Reference HTTP adapters for the shard service and filter origin.
reqwest = ["dep:reqwest"]
# The store conformance suite, for a wallet that brings its own storage.
testing = []

[dev-dependencies]
serde_json = "1"
