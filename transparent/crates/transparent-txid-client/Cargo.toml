[package]
name = "transparent-txid-client"
version = "0.1.0-rc.4"
edition = "2021"
description = "Synchronous, transport-agnostic wallet client for the tiered txid display PIR publication"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"

[lib]
name = "transparent_txid_client"
path = "src/lib.rs"

[features]
# Test hooks: a configurable placement refresh age and the cached revision
# list. Not for wallets.
testing = []

# No HTTP stack and no async runtime: the wallet supplies the transport.
[dependencies]
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
transparent-events = { version = "=0.1.0-rc.4", path = "../transparent-events" }
transparent-native = { version = "=0.1.0-rc.4", path = "../transparent-native" }
transparent-shard = { version = "=0.1.0-rc.4", path = "../transparent-shard" }

[dev-dependencies]
flate2 = "1"
# Only for the `txid-quality-canary` example's blocking HTTPS transport.
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
