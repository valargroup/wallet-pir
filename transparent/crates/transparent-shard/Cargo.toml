[package]
name = "transparent-shard"
version = "0.1.0-rc.3"
edition = "2021"
description = "Transparent PIR shard maps, manifests and table codecs"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"

[lib]
name = "transparent_shard"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
transparent-events = { version = "=0.1.0-rc.3", path = "../transparent-events" }
transparent-filter = { version = "=0.1.0-rc.3", path = "../transparent-filter" }
