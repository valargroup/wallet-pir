[package]
name = "transparent-shard"
version = "0.1.0"
edition = "2021"

[lib]
name = "transparent_shard"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
transparent-events = { path = "../transparent-events" }
transparent-filter = { path = "../transparent-filter" }
