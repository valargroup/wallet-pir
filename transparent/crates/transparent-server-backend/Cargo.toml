[package]
name = "transparent-server-backend"
version = "0.1.0-rc.4"
edition = "2021"
description = "Verified publications and prepared runtimes for Transparent PIR servers"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"

[features]
portable-kernel = []

[dependencies]
pir-observability = { version = "=0.1.0", path = "../../../shared/pir-observability" }
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
memmap2 = "0.9"
rayon = "1"
reinspiring = "=0.1.3-rc.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.36"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zakura-transparent-private-shared = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "854391d9e5355c1b5087cb383e855c442b378658" }
zakura-transparent-private-server = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "854391d9e5355c1b5087cb383e855c442b378658" }
# The native profile's operations; `client` too, for the runtime self-check,
# which prepares and decodes one query against every table it loads.
zakura-pir-native = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "854391d9e5355c1b5087cb383e855c442b378658", features = ["client", "server"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "thread"] }

[dev-dependencies]
tempfile = "3"
