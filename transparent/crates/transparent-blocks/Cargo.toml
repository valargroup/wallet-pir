[package]
name = "transparent-blocks"
version = "0.1.0-rc.4"
edition = "2021"

[dependencies]
anyhow = "1"
flate2 = "1"
hex = "0.4"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
transparent-events = { package = "zakura-transparent-events", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "0c110882ad6d36c9d3ad811903abdf37b13d35d5" }
zakura-pir-transparent = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "0c110882ad6d36c9d3ad811903abdf37b13d35d5", default-features = false, features = ["engine"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"
