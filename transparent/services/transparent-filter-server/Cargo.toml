[package]
name = "transparent-filter-server"
version = "0.1.0-rc.4"
edition = "2021"

[lib]
name = "transparent_filter_server"
path = "src/lib.rs"

[[bin]]
name = "shard-publish"
path = "src/bin/shard-publish.rs"

[[bin]]
name = "shard-census"
path = "src/bin/shard-census.rs"

[[bin]]
name = "transparent-event-ingest"
path = "src/bin/event-ingest.rs"

[[bin]]
name = "transparent-filter-server"
path = "src/bin/server.rs"

[[bin]]
name = "journal-convert-v1"
path = "src/bin/journal-convert-v1.rs"

[[bin]]
name = "sample-redigest"
path = "src/bin/sample-redigest.rs"

[[bin]]
name = "shard-cutoff"
path = "src/bin/shard-cutoff.rs"

[[bin]]
name = "journal-inventory"
path = "src/bin/journal-inventory.rs"

[[bin]]
name = "event-spotcheck"
path = "src/bin/event-spotcheck.rs"

[[bin]]
name = "shard-verify"
path = "src/bin/shard-verify.rs"

[[bin]]
name = "script-sample"
path = "src/bin/script-sample.rs"

[[bin]]
name = "filter-sweep"
path = "src/bin/filter-sweep.rs"

[[bin]]
name = "txid-display-controller"
path = "src/bin/txid-display-controller.rs"

[dependencies]
pir-observability = { path = "../../../shared/pir-observability" }
transparent-blocks = { path = "../../crates/transparent-blocks" }
tempfile = "3"
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
libc = "0.2"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
node-rpc = { path = "../../../shared/node-rpc" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transparent-events = { path = "../../crates/transparent-events" }
transparent-filter = { path = "../../crates/transparent-filter" }
transparent-native = { path = "../../crates/transparent-native" }
transparent-shard = { path = "../../crates/transparent-shard" }
transparent-shard-server = { path = "../transparent-shard-server" }
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", rev = "83738c07468bee30a7db8a8d678cb27bf60094f4" }
# Pinned to the same revision as `zakura-chain`, and it must stay that way: this
# opens the node's RocksDB directly. Before deploying this reader, verify that
# its database format matches the running node. This source pin is the Common 3
# node revision; changing it does not upgrade the deployed node.
zakura-state = { git = "https://github.com/zakura-core/zakura.git", rev = "83738c07468bee30a7db8a8d678cb27bf60094f4" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
