[package]
name = "transparent-block-server"
version = "0.1.0"
edition = "2021"
[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
transparent-blocks = { path = "../../crates/transparent-blocks" }
sysinfo = "0.36"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3"
