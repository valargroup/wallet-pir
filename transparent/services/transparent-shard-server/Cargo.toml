[package]
name = "transparent-shard-server"
version = "0.1.0-rc.4"
edition = "2021"
description = "Transparent PIR shard and txid display server"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"

[lib]
name = "transparent_shard_server"
path = "src/lib.rs"

[[bin]]
name = "transparent-shard-server"
path = "src/bin/server.rs"

[[bin]]
name = "shard-scaling"
path = "src/bin/shard-scaling.rs"

[[bin]]
name = "shard-residency"
path = "src/bin/shard-residency.rs"

[[bin]]
name = "transparent-txid-server"
path = "src/bin/txid-server.rs"

[features]
# Reproduce the existing non-AVX-512 backend on newer benchmark CPUs.
portable-kernel = []

[dependencies]
pir-control = { version = "=0.1.0", path = "../../../shared/pir-control" }
pir-observability = { version = "=0.1.0", path = "../../../shared/pir-observability" }
axum = "0.7"
rayon = "1"
http-body = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
memmap2 = "0.9"
reinspiring = "=0.1.3-rc.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.36"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transparent-filter = { version = "=0.1.0-rc.4", path = "../../crates/transparent-filter" }
# The native profile helper. Deliberately not enhance-pir[-server]: their
# `native-reinspiring` feature would switch the q48 Enhance binaries through
# feature unification.
transparent-native = { version = "=0.1.0-rc.4", path = "../../crates/transparent-native" }
transparent-shard = { version = "=0.1.0-rc.4", path = "../../crates/transparent-shard" }
# Record types for the display tooling's synthetic publications.
transparent-events = { version = "=0.1.0-rc.4", path = "../../crates/transparent-events" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "thread"] }

[dev-dependencies]
transparent-filter-server = { path = "../transparent-filter-server" }
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", rev = "83738c07468bee30a7db8a8d678cb27bf60094f4" }
rayon = "1"
base64 = "0.22"
http-body = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
transparent-events = { path = "../../crates/transparent-events" }
ipir-sp = "=0.1.0-rc.7"
tower = { version = "0.5", features = ["util"] }
transparent-wallet = { path = "../../crates/transparent-wallet", features = ["reqwest"] }
transparent-wallet-store = { path = "../../crates/transparent-wallet-store" }
transparent-txid-client = { path = "../../crates/transparent-txid-client", features = ["testing"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
