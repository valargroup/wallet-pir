[package]
name = "transparent-shard-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "transparent_shard_server"
path = "src/lib.rs"

[[bin]]
name = "transparent-shard-server"
path = "src/bin/server.rs"

[[bin]]
name = "shard-scaling"
path = "src/bin/shard-scaling.rs"

[[bin]]
name = "shard-residency"
path = "src/bin/shard-residency.rs"

[features]
# Reproduce the existing non-AVX-512 backend on newer benchmark CPUs.
portable-kernel = []

[dependencies]
axum = "0.7"
http-body = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", tag = "v0.1.0-rc.6" }
memmap2 = "0.9"
reinspiring = { git = "https://github.com/valargroup/ipir-sp.git", tag = "v0.1.0-rc.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.36"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transparent-filter = { path = "../../crates/transparent-filter" }
# The native profile helper. Deliberately not enhance-pir[-server]: their
# `native-reinspiring` feature would switch the q48 Enhance binaries through
# feature unification.
transparent-native = { path = "../../crates/transparent-native" }
transparent-shard = { path = "../../crates/transparent-shard" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
rayon = "1"
base64 = "0.22"
http-body = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
transparent-events = { path = "../../crates/transparent-events" }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", tag = "v0.1.0-rc.6" }
tower = { version = "0.5", features = ["util"] }
transparent-wallet = { path = "../../crates/transparent-wallet", features = ["reqwest"] }
transparent-wallet-store = { path = "../../crates/transparent-wallet-store" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
