[package]
name = "transparent-shard-server"
version = "0.1.0-rc.4"
edition = "2021"
description = "Transparent PIR shard and txid display server"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"

[lib]
name = "transparent_shard_server"
path = "src/lib.rs"

[[bin]]
name = "transparent-shard-server"
path = "src/bin/server.rs"

[[bin]]
name = "shard-scaling"
path = "src/bin/shard-scaling.rs"

[[bin]]
name = "shard-residency"
path = "src/bin/shard-residency.rs"

[[bin]]
name = "transparent-txid-server"
path = "src/bin/txid-server.rs"

[features]
# Reproduce the existing non-AVX-512 backend on newer benchmark CPUs.
portable-kernel = ["transparent-server-backend/portable-kernel"]

[dependencies]
transparent-server-backend = { path = "../../crates/transparent-server-backend" }
pir-control = { version = "=0.1.0", path = "../../../shared/pir-control" }
pir-observability = { version = "=0.1.0", path = "../../../shared/pir-observability" }
axum = "0.7"
rayon = "1"
http-body = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
reinspiring = "=0.1.3-rc.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.36"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The Transparent protocol and publisher crates.
zakura-transparent-private-shared = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "854391d9e5355c1b5087cb383e855c442b378658" }
zakura-transparent-private-server = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "854391d9e5355c1b5087cb383e855c442b378658" }
# The native profile's operations. Deliberately not enhance-pir[-server]: their
# `native-reinspiring` feature would switch the q48 Enhance binaries through
# feature unification. `client` too: the runtime self-check prepares and decodes
# one query against every table it loads.
zakura-pir-native = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "854391d9e5355c1b5087cb383e855c442b378658", features = ["client", "server"] }

[dev-dependencies]
rayon = "1"
base64 = "0.22"
http-body = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
zakura-transparent-private-wallet = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "854391d9e5355c1b5087cb383e855c442b378658", default-features = false, features = ["engine-store", "reqwest", "testing"] }
ipir-sp = "=0.1.0-rc.7"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
