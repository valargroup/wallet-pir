[package]
name = "txid-sizing-export"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rusqlite = "0.37"
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
sha2 = "0.10"
thiserror = "2"
transparent-events = { package = "zakura-transparent-events", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "1b0cda2e09c1e496889b2d85962321a8df750fea" }
transparent-filter = { package = "zakura-transparent-filter", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "1b0cda2e09c1e496889b2d85962321a8df750fea" }
transparent-shard = { package = "zakura-transparent-shard", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "1b0cda2e09c1e496889b2d85962321a8df750fea" }
# Transaction and block reads through the server adapter, at the revision the
# services pin.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "1b0cda2e09c1e496889b2d85962321a8df750fea" }

[dev-dependencies]
# Raw synthetic blocks for the shared extractor's tests.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "1b0cda2e09c1e496889b2d85962321a8df750fea", features = ["testing"] }

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
