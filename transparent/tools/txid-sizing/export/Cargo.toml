[package]
name = "txid-sizing-export"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rusqlite = "0.37"
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
sha2 = "0.10"
thiserror = "2"
transparent-events = { path = "../../../crates/transparent-events" }
transparent-filter = { path = "../../../crates/transparent-filter" }
transparent-shard = { path = "../../../crates/transparent-shard" }
# Transaction and block reads through the server adapter, at the revision the
# services pin.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "513537bec79ea834a5eb145c3e01883fc3dfda5e" }

[dev-dependencies]
# Raw synthetic blocks for the shared extractor's tests.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "513537bec79ea834a5eb145c3e01883fc3dfda5e", features = ["testing"] }

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
