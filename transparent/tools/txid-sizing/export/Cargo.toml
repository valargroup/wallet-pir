[package]
name = "txid-sizing-export"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rusqlite = "0.37"
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
sha2 = "0.10"
thiserror = "2"
transparent-events = { package = "zakura-transparent-events", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "8d260c1acd54d2ee65b858a961119f17d9cc7e20" }
transparent-filter = { package = "zakura-transparent-filter", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "8d260c1acd54d2ee65b858a961119f17d9cc7e20" }
transparent-shard = { package = "zakura-transparent-shard", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "8d260c1acd54d2ee65b858a961119f17d9cc7e20" }
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", rev = "83738c07468bee30a7db8a8d678cb27bf60094f4" }

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
