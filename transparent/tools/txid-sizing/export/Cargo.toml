[package]
name = "txid-sizing-export"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rusqlite = "0.37"
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
sha2 = "0.10"
thiserror = "2"
transparent-events = { package = "zakura-transparent-events", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef" }
transparent-filter = { package = "zakura-transparent-filter", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef" }
transparent-shard = { package = "zakura-transparent-shard", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef" }
# Transaction and block reads through the server adapter, at the revision the
# services pin.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef" }

[build-dependencies]
sha2 = "0.10"
serde_json = "1"
toml = "0.8.23"

[dev-dependencies]
toml = "0.8.23"
# Raw synthetic blocks for the shared extractor's tests.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef", features = ["testing"] }

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
