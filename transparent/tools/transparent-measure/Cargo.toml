[package]
name = "transparent-measure"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "transparent-measure"
path = "src/main.rs"

[dependencies]
axum = "0.7"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
transparent-events = { path = "../../crates/transparent-events" }
transparent-filter = { path = "../../crates/transparent-filter" }
transparent-filter-server = { path = "../../services/transparent-filter-server" }
transparent-shard = { path = "../../crates/transparent-shard" }
transparent-shard-server = { path = "../../services/transparent-shard-server" }
transparent-wallet = { path = "../../crates/transparent-wallet" }
