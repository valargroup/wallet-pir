[package]
name = "transparent-measure"
version = "0.1.0-rc.4"
edition = "2021"

[[bin]]
name = "transparent-measure"
path = "src/main.rs"

[dependencies]
axum = "0.7"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zakura-transparent-private-shared = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "e5195d59c2d5dc9fdca2b2486d4949f19eba5529" }
zakura-transparent-private-wallet = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "e5195d59c2d5dc9fdca2b2486d4949f19eba5529", default-features = false, features = ["engine"] }
transparent-filter-server = { path = "../../services/transparent-filter-server" }
transparent-shard-server = { path = "../../services/transparent-shard-server" }
