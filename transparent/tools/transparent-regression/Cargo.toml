[package]
name = "transparent-regression"
version = "0.1.0-rc.4"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
transparent-events = { package = "zakura-transparent-events", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef" }
transparent-filter = { package = "zakura-transparent-filter", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef" }
zakura-pir-transparent = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef", default-features = false, features = ["engine-store", "reqwest"] }

[dev-dependencies]
axum = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
transparent-shard = { package = "zakura-transparent-shard", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef" }
transparent-shard-server = { path = "../../services/transparent-shard-server" }
