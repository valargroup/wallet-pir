[package]
name = "transparent-regression"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
transparent-events = { path = "../../crates/transparent-events" }
transparent-filter = { path = "../../crates/transparent-filter" }
transparent-wallet = { path = "../../crates/transparent-wallet", features = ["reqwest"] }
transparent-wallet-store = { path = "../../crates/transparent-wallet-store" }

[dev-dependencies]
axum = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
transparent-shard = { path = "../../crates/transparent-shard" }
transparent-shard-server = { path = "../../services/transparent-shard-server" }
