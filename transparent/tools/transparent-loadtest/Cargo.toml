[package]
name = "transparent-loadtest"
version = "0.1.0-rc.4"
edition = "2021"

[[bin]]
name = "transparent-loadtest"
path = "src/main.rs"

[dependencies]
transparent-blocks = { path = "../../crates/transparent-blocks" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
hex = "0.4"
humantime = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
transparent-events = { package = "zakura-transparent-events", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef" }
transparent-filter = { package = "zakura-transparent-filter", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef", features = ["client"] }
transparent-txid-client = { package = "zakura-transparent-txid-client", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef" }
zakura-pir-transparent = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef", default-features = false, features = ["engine-store", "reqwest"] }

sysinfo = "0.36"

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
tempfile = "3"
axum = "0.7"
transparent-shard = { package = "zakura-transparent-shard", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2a013dbb4bb35f61468825cc0ef703fb537a0ef" }
transparent-shard-server = { path = "../../services/transparent-shard-server" }

[build-dependencies]
sha2 = "0.10"
