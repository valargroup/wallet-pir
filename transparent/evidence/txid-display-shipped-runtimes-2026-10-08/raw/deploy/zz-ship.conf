# Shipped recent runtimes (28c39d94): the controller builds the recent revision's
# runtimes into each candidate; recent-01 loads and self-checks them.
# Two build threads for the unit's CPUQuota=200%.
# Rollback: rm this file; systemctl daemon-reload; systemctl restart transparent-txid-display-controller.service
[Service]
ExecStart=
ExecStart=/opt/transparent-txid-display/releases/28c39d94-ship/txid-display-controller run --root /srv/zakura/txid-display-poc/root --journal /srv/zakura/txid-display-poc/journal --workers /opt/transparent-txid-display/workers.json --mode replay-then-live --status-listen 127.0.0.1:8099 --rpc-url http://127.0.0.1:8232 --rpc-cookie /root/.cache/zakura/.cookie --blocks-per-step 25 --step-interval-ms 2000 --ship-runtimes
Environment=TRANSPARENT_BUILD_THREADS=2
