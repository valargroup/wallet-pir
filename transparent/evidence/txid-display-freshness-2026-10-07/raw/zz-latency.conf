# Display latency change (07f906753cb0): batched hint for txid-2k, two build threads on
# up to two CPUs. Display still loses to history: weight 50 < 100, nice 10.
# Rollback: rm this file; systemctl daemon-reload; systemctl restart transparent-txid-display-worker.service
[Service]
ExecStart=
ExecStart=/opt/transparent-txid-display/releases/07f906753cb0-latency/transparent-txid-server --listen 10.142.0.10:8095 --role recent-replica --cache-bytes 536870912 --build-slots 1 --query-slots 2 --retain-revisions 1 --control-socket /run/transparent-txid-display/control.sock --active-record /opt/transparent-txid-display/worker/active.json --collect-root /srv/transparent-txid-display/publications --collect-root /srv/transparent-txid-display/staged
Environment=TRANSPARENT_BUILD_THREADS=2
CPUQuota=200%
CPUWeight=50
