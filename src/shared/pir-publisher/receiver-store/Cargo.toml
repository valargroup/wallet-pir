[package]
name = "receiver-store"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "The receiver indexer's SQLite coverage store and provider store"

[dependencies]
receiver-directory = { package = "zakura-receiver-directory", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bffb3cdcfcc5442b612cad91df26619d7b909d89" }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"


[dev-dependencies]
hex = "0.4"
tempfile = "3"
