[package]
name = "pir-publisher"
version = "0.1.0"
edition = "2021"
publish = false
description = "Configurable host for all Wallet PIR publishers"

[features]
default = []
native-reinspiring = ["enhance-publisher/native-reinspiring", "status-publisher/native-reinspiring"]
cuda = ["enhance-publisher/cuda", "status-publisher/cuda"]

[dependencies]
enhance-publisher = { path = "../enhance" }
status-publisher = { path = "../status" }
transparent-publisher = { path = "../transparent" }
receiver-indexer = { path = "../receiver" }
pir-pipeline = { path = "../pipeline" }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
