[package]
name = "pir-control"
version = "0.1.0"
edition = "2021"
description = "Process identity, control-lease watchdog, admission and durable state files shared by the Enhance, Status, Transparent and Receiver PIR services"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"

[features]
# HTTP admission primitives; see `src/admission.rs`.
admission = ["dep:axum", "dep:tokio", "dep:http-body"]

[dependencies]
tempfile = "3"
axum = { version = "0.7", optional = true }
http-body = { version = "1", optional = true }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"], optional = true }

# sha2 0.10 needs this feature to detect ARM SHA instructions at runtime.
# Keep the portable fallback and leave the x86 backend selection unchanged.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
