[package]
name = "zakura-server-chain"
version = "0.0.1-rc0"
publish = false
description = "Zakura node reads and chain interpretation for the PIR services"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/wallet-pir"
readme = "README.md"

[features]
# Consumers select the adapter they use. Decoding and chain interpretation need no
# runtime or HTTP stack; only `rpc` and the HTTP node double add them.
default = []
transparent = []
enhance = []
status = []
## Receiver indexing; it checks Ironwood tree roots with Orchard's field encoding.
receiver = ["dep:zakura-pir-protocol", "dep:orchard"]
## The node JSON-RPC client and its asynchronous reads, for service hosts and tools.
rpc = ["dep:reqwest", "dep:tokio"]
## Synthetic chain fixtures for service tests: raw blocks and transactions built
## with the node's own encoders.
testing = ["dep:zakura-chain"]
## A JSON-RPC node double serving `testing` fixtures over HTTP, for host and tool
## tests of the `rpc` reads.
testing-node = ["testing", "rpc", "dep:axum", "tokio/net", "tokio/time"]
## Reading the node's RocksDB directly, as a secondary instance; see
## `transparent::state`.
rocksdb = ["transparent", "dep:zakura-state", "dep:zakura-chain", "dep:tokio"]

[dependencies]
axum = { version = "0.7", optional = true }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync"], optional = true }
# Common 4.0.0 support from zakura main.
# Changing this revision does not upgrade a deployed node; a direct database
# reader must match the running node's format.
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", rev = "ae0f629bbee85cfe80d89e65d86fb2e931832efe", optional = true }
sha2 = "0.10"
zcash_script = "0.6"
zcash_protocol = { package = "zakura-protocol", version = "=4.0.0" }
# Borrowed transaction wire reader from
# https://github.com/zakura-core/wallet-libraries/pull/287. It depends only on
# zakura-protocol and two hash crates, so reading transactions does not compile the
# Sapling, Orchard or Halo2 stack. It checks framing, not curve points or proofs.
zcash_transaction_wire = { package = "zakura-transaction-wire", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a7c842fd4f16790ed6739346f44557a97065d242" }
orchard = { package = "zakura-orchard", version = "=4.0.0", default-features = false, features = ["std", "backend-halo2"], optional = true }
# Pinned to the same revision as `zakura-chain`, and it must stay that way: the
# `rocksdb` reader opens the node's database directly, so its format must match
# the running node's.
zakura-state = { git = "https://github.com/zakura-core/zakura.git", rev = "ae0f629bbee85cfe80d89e65d86fb2e931832efe", optional = true }
# Receiver recovery is wallet-libraries' canonical codec, at the revision the
# services pin. wallet-pir consumes wallet-libraries, never the reverse.
zakura-pir-protocol = { version = "=0.0.1-rc2", default-features = false, features = ["receiver-crypto"], optional = true }

[dev-dependencies]
axum = "0.7"
chrono = { version = "0.4", default-features = false }
hex = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
# Independent node decoding and historical block vectors for RPC compatibility tests.
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", rev = "ae0f629bbee85cfe80d89e65d86fb2e931832efe" }
# Test vectors from the same node revision.
zakura-test = { git = "https://github.com/zakura-core/zakura.git", rev = "ae0f629bbee85cfe80d89e65d86fb2e931832efe" }

[[test]]
name = "enhance"
required-features = ["testing-node", "enhance"]

[[test]]
name = "receiver"
required-features = ["testing-node", "receiver"]

[[test]]
name = "status"
required-features = ["testing-node", "status"]

[[test]]
name = "transparent"
required-features = ["testing-node", "transparent"]

[[test]]
name = "state"
required-features = ["testing-node", "rocksdb"]
