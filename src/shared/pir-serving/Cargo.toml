[package]
name = "pir-serving"
version = "0.1.0"
edition = "2021"
description = "Profile modulus and native hint helpers shared by the Enhance and Status serving libraries"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"
publish = false

[features]
default = []
native-reinspiring = ["dep:zakura-pir-server-core", "ipir-sp/native-reinspiring"]

[dependencies]
ipir-sp = "=0.1.0-rc.7"
pir-runtime = { path = "../pir-runtime" }
zakura-pir-server-core = { version = "=0.0.1-rc1", default-features = false, optional = true }
