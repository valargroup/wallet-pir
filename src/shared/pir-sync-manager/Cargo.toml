[package]
name = "pir-sync-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "HTTPS transport, sequential synchronization and the shared publication lifecycle without product authority"
publish = false

[dependencies]
bytes = "1"
pir-publication = { path = "../pir-publication" }
pir-service-discovery = { version = "1.0.0", path = "../pir-service-discovery" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["time", "io-util", "rt", "fs"] }

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
