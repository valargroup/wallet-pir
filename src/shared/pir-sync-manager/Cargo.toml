[package]
name = "pir-sync-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "HTTPS transport and sequential synchronization without product authority"
publish = false

[dependencies]
bytes = "1"
pir-service-discovery = { version = "1.0.0", path = "../pir-service-discovery" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
