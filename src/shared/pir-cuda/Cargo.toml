[package]
name = "pir-cuda"
version = "0.1.0"
edition = "2021"
publish = false
description = "Optional CUDA evaluator construction for Wallet PIR serving libraries"

[features]
default = []
cuda = ["dep:ipir-sp", "ipir-sp/cuda", "dep:simplepir-kernel", "simplepir-kernel/cuda"]

[dependencies]
ipir-sp = { version = "=0.1.0-rc.7", optional = true }
simplepir-kernel = { version = "=0.1.0-rc.4", optional = true }
