[package]
name = "pir-query-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Configurable host for Wallet PIR query servers"

[features]
default = []
enhance = ["dep:enhance-query-server"]
status = ["dep:status-query-server"]
transparent = ["dep:transparent-query-server"]
native-reinspiring = [
    "enhance-query-server?/native-reinspiring",
    "status-query-server?/native-reinspiring",
]
cuda = ["enhance-query-server?/cuda", "status-query-server?/cuda"]

[dependencies]
enhance-query-server = { path = "../../enhance/enhance-query-server", optional = true }
status-query-server = { path = "../../status/status-query-server", optional = true }
transparent-query-server = { path = "../../transparent/transparent-query-server", optional = true, default-features = false }
pir-pipeline = { path = "../pir-publisher/pipeline" }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
