[package]
name = "pir-query-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Configurable host for Wallet PIR query servers"
autotests = false

[[test]]
name = "operator"
path = "tests/operator.rs"

[features]
default = []
enhance = [
    "dep:enhance-query-server",
    "dep:enhance-shared",
    "dep:pir-control",
    "dep:pir-observability",
    "dep:pir-runtime",
    "dep:pir-publication",
    "dep:hex",
    "dep:memmap2",
    "dep:hdrhistogram",
    "dep:http-body",
    "dep:prometheus",
    "dep:rand",
    "dep:sha2",
    "dep:tokio-stream",
]
status = [
    "dep:status-query-server",
    "dep:status-shared",
    "dep:pir-control",
    "dep:pir-publication",
    "dep:hex",
    "dep:http",
    "dep:rand",
    "dep:url",
]
# Transparent history and transaction-detail serving compile independently.
transparent-history = [
    "dep:transparent-query-server",
    "transparent-query-server/transparent-history",
]
transparent-detail = [
    "dep:transparent-query-server",
    "transparent-query-server/transparent-detail",
]
native-reinspiring = [
    "enhance-query-server?/native-reinspiring",
    "status-query-server?/native-reinspiring",
    "status-shared?/native-reinspiring",
    "enhance-shared?/native-reinspiring",
]
cuda = ["enhance-query-server?/cuda", "enhance-shared?/cuda"]

[dependencies]
pir-sync-manager = { path = "../shared/pir-sync-manager" }
enhance-query-server = { path = "../enhance/enhance-query-server", optional = true }
status-query-server = { path = "../status/status-query-server", optional = true }
transparent-query-server = { path = "../transparent/transparent-query-server", optional = true, default-features = false }
pir-pipeline = { path = "../shared/pir-pipeline" }
# Enhance roles: records, protocol and prepared runtimes come from
# enhance-shared, evaluation messages from enhance-query-server.
enhance-shared = { path = "../enhance/enhance-shared", optional = true }
pir-observability = { path = "../shared/pir-observability", features = ["http"], optional = true }
pir-runtime = { path = "../shared/pir-runtime", optional = true }
memmap2 = { version = "0.9", optional = true }
hdrhistogram = { version = "7", optional = true }
http-body = { version = "1", optional = true }
prometheus = { version = "0.13", default-features = false, features = ["process"], optional = true }
sha2 = { version = "0.10", optional = true }
tokio-stream = { version = "0.1", optional = true }
# Status roles: product material comes from status-shared, peer messages from
# status-query-server; the host owns their HTTP, admission and synchronization.
status-shared = { path = "../status/status-shared", optional = true }
pir-control = { path = "../shared/pir-control", features = ["admission"], optional = true }
pir-publication = { path = "../shared/pir-publication", optional = true }
hex = { version = "0.4", optional = true }
http = { version = "1", optional = true }
rand = { version = "0.8", optional = true }
url = { version = "2", optional = true }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# Injected kernel faults and synthetic records drive the Enhance role regressions.
enhance-shared = { path = "../enhance/enhance-shared", features = ["test-support", "client"] }
status-shared = { path = "../status/status-shared", features = ["client"] }
# Independent wallet client exercises the Status serving wire contract.
zakura-pir-client = { version = "=0.0.1-rc2", default-features = false, features = ["native", "status"] }
tower = { version = "0.5", features = ["util"] }
