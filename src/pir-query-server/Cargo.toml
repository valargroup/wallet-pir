[package]
name = "pir-query-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Configurable host for Wallet PIR query servers"
autotests = false

[[test]]
name = "operator"
path = "tests/operator.rs"

# Transparent serving regressions: wallet clients and fixtures against the
# host's history and transaction-detail modules.
[[test]]
name = "assignment"
path = "tests/transparent/assignment.rs"
required-features = ["transparent-history"]

[[test]]
name = "ci_smoke"
path = "tests/transparent/ci_smoke.rs"
required-features = ["transparent-history"]

[[test]]
name = "geometry_costs"
path = "tests/transparent/geometry_costs.rs"
required-features = ["transparent-history"]

[[test]]
name = "revisions_and_cache"
path = "tests/transparent/revisions_and_cache.rs"
required-features = ["transparent-history"]

[[test]]
name = "round_trip"
path = "tests/transparent/round_trip.rs"
required-features = ["transparent-history"]

[[test]]
name = "verification_reuse"
path = "tests/transparent/verification_reuse.rs"
required-features = ["transparent-history"]

[[test]]
name = "wallet_anchor"
path = "tests/transparent/wallet_anchor.rs"
required-features = ["transparent-history"]

[[test]]
name = "wallet_continuation"
path = "tests/transparent/wallet_continuation.rs"
required-features = ["transparent-history"]

[[test]]
name = "wallet_recut"
path = "tests/transparent/wallet_recut.rs"
required-features = ["transparent-history"]

[[test]]
name = "wallet_sync"
path = "tests/transparent/wallet_sync.rs"
required-features = ["transparent-history"]

[[test]]
name = "txid_client"
path = "tests/transparent/txid_client.rs"
required-features = ["transparent-detail"]

[[test]]
name = "txid_sharded"
path = "tests/transparent/txid_sharded.rs"
required-features = ["transparent-detail"]

[features]
default = []
# Repeated Status sync campaigns. Fast keeps one case for each outcome.
qualification-tests = []
# Scoped record-write injection for integration tests; absent in service builds.
test-support = []
enhance = [
    "dep:enhance-shared",
    "dep:pir-control",
    "dep:pir-observability",
    "dep:pir-runtime",
    "dep:pir-publication",
    "dep:hex",
    "dep:memmap2",
    "dep:hdrhistogram",
    "dep:http-body",
    "dep:prometheus",
    "dep:rand",
    "dep:sha2",
    "dep:tokio-stream",
]
status = [
    "dep:status-shared",
    "dep:pir-control",
    "dep:pir-publication",
    "dep:hex",
    "dep:http",
    "dep:rand",
    "dep:url",
]
receiver = [
    "dep:hex",
    "dep:pir-observability",
    "dep:receiver-pir-server",
    "dep:pir-control",
    "dep:pir-publication",
    "dep:zakura-pir-query-server",
    "zakura-pir-query-server/receiver",
]
# Transparent history and transaction-detail serving compile independently.
transparent-history = [
    "zakura-pir-query-server/transparent",
    "dep:transparent-shared",
    "dep:pir-control",
    "dep:pir-observability",
    "dep:pir-publication",
    "dep:base64",
    "dep:hex",
    "dep:http-body",
    "dep:ipir-sp",
    "dep:sha2",
    "dep:thiserror",
    "dep:zakura-pir-protocol",
    "dep:zakura-pir-query-server",
]
transparent-detail = [
    "zakura-pir-query-server/transparent",
    "dep:transparent-shared",
    "dep:pir-control",
    "dep:pir-observability",
    "dep:pir-publication",
    "dep:base64",
    "dep:hex",
    "dep:http-body",
    "dep:ipir-sp",
    "dep:sha2",
    "dep:thiserror",
    "dep:zakura-pir-protocol",
    "dep:zakura-pir-query-server",
]
# Reproduce the existing non-AVX-512 Transparent backend on newer benchmark CPUs.
portable-kernel = ["transparent-shared?/portable-kernel"]
native-reinspiring = [
    "status-shared?/native-reinspiring",
    "enhance-shared?/native-reinspiring",
]
cuda = ["enhance-shared?/cuda"]

[dependencies]
receiver-pir-server = { path = "../receiver/receiver-pir-server", optional = true }
pir-sync-manager = { path = "../shared/pir-sync-manager" }
# Transparent roles: verified shard sets, display publications and prepared
# runtimes come from transparent-shared; the host owns their serving.
transparent-shared = { path = "../transparent/transparent-shared", optional = true }
pir-pipeline = { path = "../shared/pir-pipeline" }
# Enhance roles: records, protocol and prepared runtimes come from
# enhance-shared. The host owns evaluation messages.
enhance-shared = { path = "../enhance/enhance-shared", optional = true }
pir-observability = { path = "../shared/pir-observability", features = ["http"], optional = true }
pir-runtime = { path = "../shared/pir-runtime", optional = true }
memmap2 = { version = "0.9", optional = true }
hdrhistogram = { version = "7", optional = true }
http-body = { version = "1", optional = true }
prometheus = { version = "0.13", default-features = false, features = ["process"], optional = true }
sha2 = { version = "0.10", optional = true }
tokio-stream = { version = "0.1", optional = true }
# Status roles: product material comes from status-shared. The host owns peer
# messages, HTTP, admission and synchronization.
status-shared = { path = "../status/status-shared", optional = true }
pir-control = { path = "../shared/pir-control", features = ["admission"], optional = true }
pir-publication = { path = "../shared/pir-publication", optional = true }
hex = { version = "0.4", optional = true }
http = { version = "1", optional = true }
rand = { version = "0.8", optional = true }
url = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
ipir-sp = { version = "=0.1.0-rc.7", optional = true }
thiserror = { version = "2", optional = true }
tower = { version = "0.5", features = ["util"] }
zakura-pir-protocol = { version = "=0.0.1-rc2", default-features = false, features = ["transparent"], optional = true }
zakura-pir-query-server = { version = "=0.0.1-rc2", default-features = false, optional = true }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Role features are selected by the test command. Putting history and detail
# here would pull the Transparent stack into the Enhance and Status harness,
# and that combined rustc does not fit in the fast runner's 6 GiB cap. The
# publisher library depends on this host only through its fixture and
# qualification features; a default edge would link the same libraries into the
# publisher test binary.
pir-query-server = { path = ".", features = ["test-support"] }
# Paused clocks drive the synchronization cadence regressions.
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
# Injected kernel faults and synthetic records drive the Enhance role regressions.
enhance-shared = { path = "../enhance/enhance-shared", features = ["test-support", "client"] }
status-shared = { path = "../status/status-shared", features = ["client"] }
# Independent wallet client exercises the Status serving wire contract.
zakura-pir-client = { version = "=0.0.1-rc2", default-features = false, features = ["native", "status", "transparent", "engine-store", "reqwest", "testing", "receiver"] }
# Synthetic shard sets and display publications for the Transparent regressions.
transparent-shared = { path = "../transparent/transparent-shared", features = ["test-support"] }
zakura-pir-publisher = { version = "=0.0.1-rc2", default-features = false, features = ["transparent", "receiver"] }
base64 = "0.22"
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
sha2 = "0.10"
http-body = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# Burst campaigns sample this process's resident memory.
sysinfo = "0.36"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "receiver_http"
path = "tests/receiver/http.rs"
required-features = ["receiver"]

[[test]]
name = "receiver_ci_smoke"
path = "tests/receiver/ci_smoke.rs"
required-features = ["receiver"]

[[test]]
name = "receiver_library_client"
path = "tests/receiver/library_client.rs"
required-features = ["receiver"]
