[package]
name = "status-protocol"
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "Status PIR wire contract and private client"
publish = false

[lib]
name = "status_protocol"
path = "src/lib.rs"

[features]
default = []
native-reinspiring = ["dep:pir-native", "dep:reinspiring", "ipir-sp/native-reinspiring"]

[dependencies]
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
reinspiring = { version = "=0.1.3-rc.1", optional = true }
pir-native = { package = "zakura-pir-native", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "886db40137caef486d32d5bc594b2c20b1dde75e", optional = true }
