[package]
name = "status-pir-server"
version = "0.0.1"
edition = "2021"
description = "The Status PIR application and its status-pir command lines"
publish = false

[lib]
name = "status_pir_server"
path = "src/lib.rs"

[[bin]]
name = "status-pir"
path = "src/bin/status.rs"

[features]
default = []
native-reinspiring = ["status-serving/native-reinspiring", "status-publication/native-reinspiring", "status-protocol/native-reinspiring", "enhance-serving/native-reinspiring", "dep:pir-native", "ipir-sp/native-reinspiring"]
cuda = ["status-serving/cuda", "status-publication/cuda", "enhance-serving/cuda", "ipir-sp/cuda"]

[dependencies]
status-protocol = { path = "../status-protocol" }
status-serving = { path = "../status-serving" }
status-publication = { path = "../status-publication" }
# The synthetic distributed validation drives the shared control ledger and coordinator.
enhance-serving = { path = "../../enhance/enhance-serving" }
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
pir-native = { package = "zakura-pir-native", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "886db40137caef486d32d5bc594b2c20b1dde75e", optional = true }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "886db40137caef486d32d5bc594b2c20b1dde75e" }

[dev-dependencies]
# Independent Status client for the real HTTP runtime regression.
zakura-pir-status = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "886db40137caef486d32d5bc594b2c20b1dde75e" }
tempfile = "3"
