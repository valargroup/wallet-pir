[package]
name = "status-publication"
version = "0.0.1"
edition = "2021"
description = "Status PIR chain observation and publication, composed by the Status and Enhance applications"
publish = false

[features]
# Compile campaign-only correctness tests in full qualification.
full-tests = []
default = []
native-reinspiring = ["status-serving/native-reinspiring", "status-protocol/native-reinspiring"]
cuda = ["status-serving/cuda"]

[dependencies]
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
pir-pipeline = { path = "../../shared/pir-pipeline" }
status-protocol = { path = "../status-protocol" }
status-serving = { path = "../status-serving" }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
# Status chain reads, pinned to an exact wallet-libraries revision.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "886db40137caef486d32d5bc594b2c20b1dde75e" }

[dev-dependencies]
tempfile = "3"
# Independent Status client for the real HTTP runtime regression.
zakura-pir-status = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "886db40137caef486d32d5bc594b2c20b1dde75e" }
ipir-sp = "=0.1.0-rc.7"
tower = { version = "0.5", features = ["util"] }
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "886db40137caef486d32d5bc594b2c20b1dde75e", features = ["testing"] }
