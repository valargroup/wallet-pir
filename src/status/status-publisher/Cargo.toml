[package]
name = "status-publisher"
version = "0.0.1"
edition = "2021"
description = "Status PIR ingestion, publication and the status-pir application"
publish = false

[lib]
name = "status_publisher"
path = "src/lib.rs"

[[bin]]
name = "status-pir"
path = "src/bin/status.rs"
required-features = ["cli"]

[features]
default = []
# Standalone diagnostic commands use wallet helpers; the embedded publisher does not.
cli = ["status-query-server/client"]
native-reinspiring = ["status-query-server/native-reinspiring", "enhance-query-server/native-reinspiring", "dep:zakura-pir-publisher", "ipir-sp/native-reinspiring"]
cuda = ["status-query-server/cuda", "enhance-query-server/cuda", "ipir-sp/cuda"]
# Chain fixtures and the wallet client for host regressions. Production builds leave it off.
fixtures = ["zakura-server-chain/testing-node", "dep:zakura-pir-client", "zakura-pir-client/status"]

[dependencies]
pir-pipeline = { path = "../../shared/pir-pipeline" }
thiserror = "2"
status-query-server = { path = "../status-query-server" }
# The synthetic listeners serve an empty, unready Enhance query gateway beside Status.
enhance-query-server = { path = "../../enhance/enhance-query-server" }
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "cdba2e1bb062e9ecfd309ba796c84a8a3997c0a7", default-features = false, features = ["status", "rpc"] }

zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "cdba2e1bb062e9ecfd309ba796c84a8a3997c0a7", default-features = false, features = ["status"], optional = true }
# Wallet client for the host's Status regressions. Production builds leave it off.
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "cdba2e1bb062e9ecfd309ba796c84a8a3997c0a7", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
