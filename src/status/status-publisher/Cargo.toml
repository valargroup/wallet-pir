[package]
name = "status-publisher"
version = "0.0.1"
edition = "2021"
description = "Status PIR ingestion, publication and the status-pir application"
publish = false

[lib]
name = "status_publisher"
path = "src/lib.rs"

[[bin]]
name = "status-pir"
path = "src/bin/status.rs"

[features]
default = []
native-reinspiring = ["status-query-server/native-reinspiring", "enhance-serving/native-reinspiring", "dep:pir-native", "ipir-sp/native-reinspiring"]
cuda = ["status-query-server/cuda", "enhance-serving/cuda", "ipir-sp/cuda"]

[dependencies]
pir-pipeline = { path = "../../shared/pir-pipeline" }
thiserror = "2"
status-query-server = { path = "../status-query-server" }
# The synthetic distributed validation drives the shared control ledger and coordinator.
enhance-serving = { path = "../../enhance/enhance-serving" }
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
pir-native = { package = "zakura-pir-native", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "63d31b4486dffe60982c395fffb40e9a02497008", optional = true }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
ipir-sp = { version = "=0.1.0-rc.7", git = "https://github.com/valargroup/ipir-sp", rev = "1d637dba8a9e6dcf749a2054e33ea8ff03fac8c9" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "63d31b4486dffe60982c395fffb40e9a02497008" }

[dev-dependencies]
# Independent Status client for the real HTTP runtime regression.
zakura-pir-status = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "63d31b4486dffe60982c395fffb40e9a02497008" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "63d31b4486dffe60982c395fffb40e9a02497008", features = ["testing"] }
