[package]
name = "status-publisher"
version = "0.0.1"
edition = "2021"
description = "Status PIR ingestion, publication hosted by pir-publisher"
publish = false

autobins = false

[lib]
name = "status_publisher"
path = "src/lib.rs"

[features]
default = []
# Standalone diagnostic commands use wallet helpers; the embedded publisher does not.
cli = ["status-query-server/client"]
native-reinspiring = ["status-query-server/native-reinspiring", "dep:zakura-pir-publisher", "ipir-sp/native-reinspiring"]
cuda = ["status-query-server/cuda"]
# Chain fixtures and the wallet client for host regressions. Production builds leave it off.
fixtures = ["zakura-server-chain/testing-node", "dep:zakura-pir-client", "zakura-pir-client/status"]

[dependencies]
pir-pipeline = { path = "../../shared/pir-pipeline" }
thiserror = "2"
status-query-server = { path = "../status-query-server" }
pir-control = { path = "../../shared/pir-control" }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zakura-server-chain = { path = "../../shared/pir-chain", default-features = false, features = ["status", "rpc"] }

zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2", default-features = false, features = ["status"], optional = true }
# Wallet client for the host's Status regressions. Production builds leave it off.
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2", default-features = false, optional = true }

[dev-dependencies]
# The lifecycle regression drives real worker and router roles.
pir-query-server = { path = "../../pir-query-server", features = ["status"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
