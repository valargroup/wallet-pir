[package]
name = "status-shared"
version = "0.0.1"
edition = "2021"
description = "Status PIR material and contracts shared by the Status publisher and query server"
publish = false

[features]
# Full deployed-generation arithmetic campaign; fast tests use a small independent oracle.
qualification-tests = []
default = []
native-reinspiring = ["pir-serving/native-reinspiring", "dep:zakura-pir-query-server", "dep:reinspiring", "ipir-sp/native-reinspiring"]
# Wallet-side query preparation and decoding for diagnostics and wire tests.
client = ["dep:zakura-pir-client"]

[dependencies]
pir-publication = { path = "../../shared/pir-publication" }
# Profile modulus and native hint helpers are shared with Enhance serving.
pir-serving = { path = "../../shared/pir-serving" }
pir-runtime = { path = "../../shared/pir-runtime" }
rayon = "1"
serde_json = "1"
memmap2 = "0.9"
inspiring = "=0.1.0-rc.3"
hex = "0.4"
reinspiring = { version = "=0.1.3-rc.1", optional = true }
ipir-sp = "=0.1.0-rc.7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

zakura-pir-query-server = { version = "=0.0.1-rc4", default-features = false, features = ["status"], optional = true }
zakura-pir-client = { version = "=0.0.1-rc4", default-features = false, features = ["native"], optional = true }

[dev-dependencies]
# Independent wallet client exercises the wire contract.
zakura-pir-client = { version = "=0.0.1-rc4", default-features = false, features = ["native", "status"] }

[[test]]
name = "status_wallet"
required-features = ["native-reinspiring", "client"]
