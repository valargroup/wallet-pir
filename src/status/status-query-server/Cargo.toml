[package]
name = "status-query-server"
version = "0.0.1"
edition = "2021"
description = "Status PIR query serving: generations, authority, HTTP roles and publication synchronization"
publish = false

# These existing wire-contract regressions exercise the native protocol only.
# A serving library only: pir-query-server is the entrypoint.
autobins = false
[[test]]
name = "status_wallet"
required-features = ["native-reinspiring"]

[features]
# Full deployed-generation arithmetic campaign; fast tests use a small independent oracle.
qualification-tests = []
default = []
native-reinspiring = ["pir-serving/native-reinspiring", "dep:zakura-pir-query-server", "dep:reinspiring", "ipir-sp/native-reinspiring"]
cuda = ["dep:pir-cuda", "pir-cuda/cuda"]

client = ["dep:zakura-pir-client"]
[dependencies]
axum = "0.7"
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
pir-pipeline = { path = "../../shared/pir-pipeline" }
pir-sync-manager = { path = "../../shared/pir-sync-manager" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
pir-artifact = { path = "../../shared/pir-artifact" }
pir-cuda = { path = "../../shared/pir-cuda", optional = true }
# Profile modulus and native hint helpers are shared with Enhance serving.
pir-serving = { path = "../../shared/pir-serving" }
pir-runtime = { path = "../../shared/pir-runtime" }
rayon = "1"
serde_json = "1"
memmap2 = "0.9"
inspiring = "=0.1.0-rc.3"
hex = "0.4"
reinspiring = { version = "=0.1.3-rc.1", optional = true }
http = "1"
ipir-sp = "=0.1.0-rc.7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
url = "2"

zakura-pir-query-server = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2", default-features = false, features = ["status"], optional = true }
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2", default-features = false, features = ["native"], optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
hex = "0.4"
# Independent wallet client exercises the serving wire contract.
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2", default-features = false, features = ["native", "status"] }


[dev-dependencies.status-query-server]
path = "."
features = ["client"]
