[package]
name = "status-query-server"
version = "0.0.1"
edition = "2021"
description = "Status PIR query serving: private peer messages"
publish = false

# These existing wire-contract regressions exercise the native protocol only.
# A serving library only: pir-query-server is the entrypoint.
autobins = false
[[test]]
name = "status_wallet"
required-features = ["native-reinspiring"]

[features]
# Full deployed-generation arithmetic campaign; fast tests use a small independent oracle.
qualification-tests = ["status-shared/qualification-tests"]
default = []
native-reinspiring = ["status-shared/native-reinspiring"]

client = ["status-shared/client"]
[dependencies]
pir-publication = { path = "../../shared/pir-publication" }
status-shared = { path = "../status-shared" }
serde = { version = "1", features = ["derive"] }
url = "2"


[dev-dependencies]
# Native server helpers size the wire-contract regression's requests.
zakura-pir-query-server = { version = "=0.0.1-rc2", default-features = false, features = ["status"] }
# Independent wallet client exercises the serving wire contract.
zakura-pir-client = { version = "=0.0.1-rc2", default-features = false, features = ["native", "status"] }


[dev-dependencies.status-query-server]
path = "."
features = ["client"]
