[package]
name = "status-query-server"
version = "0.0.1"
edition = "2021"
description = "Status PIR serving runtime: generations, distributed controller and workers; no chain reading or publication"
publish = false

# These existing wire-contract regressions exercise the native protocol only.
[[test]]
name = "status_wallet"
required-features = ["native-reinspiring"]

[[test]]
name = "status_wallet_http"
required-features = ["native-reinspiring"]

[features]
default = []
native-reinspiring = ["pir-serving/native-reinspiring", "dep:pir-native", "dep:reinspiring", "ipir-sp/native-reinspiring"]
cuda = ["ipir-sp/cuda"]

[dependencies]
# Profile modulus and native hint helpers are shared with Enhance serving.
pir-serving = { path = "../../shared/pir-serving" }
pir-native = { package = "zakura-pir-native", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "b7fffbbc98d75af5ebc9c9d9da92ca19e9f0fdbd", optional = true }
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
pir-runtime = { path = "../../shared/pir-runtime" }
rayon = "1"
reinspiring = { version = "=0.1.3-rc.1", optional = true }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
ipir-sp = "=0.1.0-rc.7"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# Independent wallet client exercises the serving wire contract over HTTP.
zakura-pir-status = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "b7fffbbc98d75af5ebc9c9d9da92ca19e9f0fdbd" }
