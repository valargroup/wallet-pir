[package]
name = "transparent-publisher"
version = "0.1.0-rc.4"
edition = "2021"
description = "Transparent PIR publisher: ingest, history publication and transaction-detail publication"
# Product publishing is hosted by pir-publisher; this crate is a library.
autobins = false

[lib]
name = "transparent_publisher"
path = "src/lib.rs"

[features]
default = []
# Direct node database access is needed only by the offline reader tools.
rocksdb-reader = ["zakura-server-chain/rocksdb"]
# Keep large test campaigns explicit; production behavior is unchanged.
qualification-tests = []
# Chain fixtures, the wallet client and the query server for host regressions.
fixtures = [
    "zakura-server-chain/testing-node",
    "dep:zakura-pir-client",
    "zakura-pir-client/transparent",
    "zakura-pir-client/testing",
    "transparent-shared/test-support",
    "dep:transparent-query-server",
    "dep:pir-service-discovery",
    "dep:base64",
    "dep:libc",
    "dep:tower",
    "reqwest/blocking",
]

[dependencies]
pir-publication = { path = "../../shared/pir-publication" }
pir-pipeline = { path = "../../shared/pir-pipeline" }
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
pir-observability = { path = "../../shared/pir-observability" }
tempfile = "3"
axum = "0.7"
# `clock` for publication timestamps; ingest relied on feature unification.
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transparent-shared = { path = "../transparent-shared" }
# Node reads, transparent extraction, compact blocks and the RocksDB state
# reader, from the shared chain reader. The reader opens the node's RocksDB
# directly: before deploying it, verify that the zakura-state revision it pins
# matches the running node's database format.
zakura-server-chain = { path = "../../shared/pir-chain", default-features = false, features = ["transparent", "rpc"] }

zakura-pir-protocol = { version = "=0.0.1-rc2", default-features = false, features = ["transparent"] }
zakura-pir-publisher = { version = "=0.0.1-rc2", default-features = false, features = ["transparent"] }
# Query server, wallet client and small helpers for the host's Transparent
# regressions. Production builds leave them off.
base64 = { version = "0.22", optional = true }
libc = { version = "0.2", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
pir-service-discovery = { version = "1.0.0", path = "../../shared/pir-service-discovery", optional = true }
transparent-query-server = { path = "../transparent-query-server", optional = true, features = ["transparent-history", "transparent-detail"] }
zakura-pir-client = { version = "=0.0.1-rc2", default-features = false, optional = true }

[dev-dependencies]
# The unified-host regression drives real history and display query roles.
pir-query-server = { path = "../../pir-query-server", features = ["transparent-history", "transparent-detail"] }
