[package]
name = "transparent-publisher"
version = "0.1.0-rc.4"
edition = "2021"
description = "Transparent PIR publisher: ingest, history publication and transaction-detail publication"
# Every binary is listed below; a stray src/bin file is not a new program.
autobins = false

[lib]
name = "transparent_publisher"
path = "src/lib.rs"

[[bin]]
name = "shard-publish"
path = "src/bin/shard-publish.rs"

[[bin]]
name = "transparent-event-ingest"
required-features = ["rocksdb-reader"]
path = "src/bin/event-ingest.rs"

[[bin]]
name = "transparent-publisher"
path = "src/bin/server.rs"

[[bin]]
name = "txid-display-controller"
path = "src/bin/txid-display-controller.rs"

[[bin]]
name = "transparent-publish-controller"
path = "src/bin/transparent-publish-controller.rs"

[features]
default = []
# Direct node database access is needed only by the offline reader tools.
rocksdb-reader = ["zakura-server-chain/rocksdb"]
# Keep large test campaigns explicit; production behavior is unchanged.
qualification-tests = []
# Chain fixtures, the wallet client and the query server for host regressions.
fixtures = [
    "zakura-server-chain/testing-node",
    "dep:zakura-pir-client",
    "zakura-pir-client/transparent",
    "zakura-pir-client/testing",
    "transparent-shared/test-support",
    "dep:transparent-query-server",
    "dep:base64",
    "dep:libc",
    "dep:tower",
    "reqwest/blocking",
]

[dependencies]
pir-pipeline = { path = "../../shared/pir-pipeline" }
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
pir-observability = { path = "../../shared/pir-observability" }
tempfile = "3"
axum = "0.7"
# `clock` for publication timestamps; ingest relied on feature unification.
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transparent-shared = { path = "../transparent-shared" }
# Node reads, transparent extraction, compact blocks and the RocksDB state
# reader, pinned to an exact wallet-libraries revision. The reader opens the
# node's RocksDB directly: before deploying it, verify that the zakura-state
# revision wallet-libraries pins matches the running node's database format.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2", default-features = false, features = ["transparent", "rpc"] }

zakura-pir-protocol = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2", default-features = false, features = ["transparent"] }
zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2", default-features = false, features = ["transparent"] }
# Query server, wallet client and small helpers for the host's Transparent
# regressions. Production builds leave them off.
base64 = { version = "0.22", optional = true }
libc = { version = "0.2", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
transparent-query-server = { path = "../transparent-query-server", optional = true }
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2", default-features = false, optional = true }
