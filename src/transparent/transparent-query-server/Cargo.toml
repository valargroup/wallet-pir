[package]
name = "transparent-query-server"
version = "0.1.0-rc.4"
edition = "2021"
description = "Transparent PIR shard server"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"
# Every binary is listed below; a stray src/bin file is not a new program.
autobins = false

[lib]
name = "transparent_query_server"
path = "src/lib.rs"

[[bin]]
name = "transparent-query-server"
path = "src/bin/server.rs"

[[bin]]
name = "transparent-txid-server"
path = "src/bin/txid-server.rs"

[[bin]]
name = "txid-control"
path = "src/bin/txid-control.rs"

[[bin]]
name = "shard-assign"
path = "src/bin/shard-assign.rs"

[[bin]]
name = "shard-prune"
path = "src/bin/shard-prune.rs"

[[bin]]
name = "shard-control"
path = "src/bin/shard-control.rs"

[features]
# Reproduce the existing non-AVX-512 backend on newer benchmark CPUs.
portable-kernel = ["transparent-shared/portable-kernel"]

[dependencies]
pir-pipeline = { path = "../../shared/pir-pipeline" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
transparent-shared = { path = "../transparent-shared" }
pir-control = { version = "=0.1.0", path = "../../shared/pir-control", features = ["admission"] }
pir-observability = { version = "=0.1.0", path = "../../shared/pir-observability" }
axum = "0.7"
rayon = "1"
http-body = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
reinspiring = "=0.1.3-rc.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.36"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The native profile helper. Deliberately not enhance-pir[-server]: their
# `native-reinspiring` feature would switch the q48 Enhance binaries through
# feature unification.
# Record types for the display tooling's synthetic publications.

zakura-pir-protocol = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "12c3b438c80f3fe7a2f7bf2fbb25c41f556edbb6", default-features = false, features = ["transparent"] }
zakura-pir-query-server = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "12c3b438c80f3fe7a2f7bf2fbb25c41f556edbb6", default-features = false, features = ["transparent"] }

[dev-dependencies]
zakura-pir-server-core = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "12c3b438c80f3fe7a2f7bf2fbb25c41f556edbb6", default-features = false, features = ["transparent"] }
# Synthetic transaction-detail publications for the display tests.
transparent-shared = { path = "../transparent-shared", features = ["test-support"] }
rayon = "1"
base64 = "0.22"
http-body = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
ipir-sp = "=0.1.0-rc.7"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "12c3b438c80f3fe7a2f7bf2fbb25c41f556edbb6", default-features = false, features = ["transparent", "engine-store", "reqwest", "testing"] }
zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "12c3b438c80f3fe7a2f7bf2fbb25c41f556edbb6", default-features = false, features = ["transparent"] }
