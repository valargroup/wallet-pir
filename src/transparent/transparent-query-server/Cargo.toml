[package]
name = "transparent-query-server"
version = "0.1.0-rc.4"
edition = "2021"
description = "Transparent PIR shard server"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"
# A serving library only: pir-query-server is the entrypoint.
autobins = false

[lib]
name = "transparent_query_server"
path = "src/lib.rs"

[features]
default = []
transparent-history = []
transparent-detail = []
# Scoped record-write injection for integration tests; absent in service builds.
test-support = []
# Reproduce the existing non-AVX-512 backend on newer benchmark CPUs.
portable-kernel = ["transparent-shared/portable-kernel"]

[dependencies]
pir-publication = { path = "../../shared/pir-publication" }
pir-sync-manager = { path = "../../shared/pir-sync-manager" }
pir-pipeline = { path = "../../shared/pir-pipeline" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
transparent-shared = { path = "../transparent-shared" }
pir-control = { version = "=0.1.0", path = "../../shared/pir-control", features = ["admission"] }
pir-observability = { version = "=0.1.0", path = "../../shared/pir-observability" }
axum = "0.7"
http-body = "1"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["limit"] }
tracing = "0.1"
zakura-pir-protocol = { version = "=0.0.1-rc2", default-features = false, features = ["transparent"] }
zakura-pir-query-server = { version = "=0.0.1-rc2", default-features = false, features = ["transparent"] }

[dev-dependencies]
transparent-query-server = { path = ".", features = ["test-support"] }
sysinfo = "0.36"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Synthetic transaction-detail publications for the display tests.
transparent-shared = { path = "../transparent-shared", features = ["test-support"] }
base64 = "0.22"
http-body = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
zakura-pir-client = { version = "=0.0.1-rc2", default-features = false, features = ["transparent", "engine-store", "reqwest", "testing"] }
zakura-pir-publisher = { version = "=0.0.1-rc2", default-features = false, features = ["transparent"] }
