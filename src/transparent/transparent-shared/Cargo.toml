[package]
name = "transparent-shared"
version = "0.1.0-rc.4"
edition = "2021"
description = "Committed journals, verified publications and prepared runtimes shared by Transparent PIR applications"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"
publish = false

[features]
# Expand test fixtures to deployed geometry and history campaigns.
qualification-tests = []
portable-kernel = []
# Synthetic transaction-detail publications for other packages' tests.
test-support = ["dep:zakura-pir-publisher"]

[dependencies]
axum = "0.7"
pir-observability = { version = "=0.1.0", path = "../../shared/pir-observability" }
pir-runtime = { version = "=0.1.0", path = "../../shared/pir-runtime" }
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
memmap2 = "0.9"
rayon = "1"
reinspiring = "=0.1.3-rc.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.36"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

zakura-pir-protocol = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bffb3cdcfcc5442b612cad91df26619d7b909d89", default-features = false, features = ["transparent"] }
zakura-pir-query-server = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bffb3cdcfcc5442b612cad91df26619d7b909d89", default-features = false, features = ["transparent"] }
zakura-pir-server-core = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bffb3cdcfcc5442b612cad91df26619d7b909d89", default-features = false, features = ["transparent"] }
zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bffb3cdcfcc5442b612cad91df26619d7b909d89", default-features = false, features = ["transparent"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bffb3cdcfcc5442b612cad91df26619d7b909d89", default-features = false, features = ["transparent"] }
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bffb3cdcfcc5442b612cad91df26619d7b909d89", default-features = false, features = ["transparent"] }
