[package]
name = "transparent-server-backend"
version = "0.1.0-rc.4"
edition = "2021"
description = "Verified publications and prepared runtimes for Transparent PIR servers"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"

[features]
# Expand test fixtures to deployed geometry and history campaigns.
qualification-tests = []
portable-kernel = []

[dependencies]
axum = "0.7"
http-body = "1"
pir-control = { version = "=0.1.0", path = "../../shared/pir-control", features = ["admission"] }
pir-observability = { version = "=0.1.0", path = "../../shared/pir-observability" }
pir-runtime = { version = "=0.1.0", path = "../../shared/pir-runtime" }
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
memmap2 = "0.9"
rayon = "1"
reinspiring = "=0.1.3-rc.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.36"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
transparent-events = { package = "zakura-transparent-events", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "b7fffbbc98d75af5ebc9c9d9da92ca19e9f0fdbd" }
transparent-filter = { package = "zakura-transparent-filter", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "b7fffbbc98d75af5ebc9c9d9da92ca19e9f0fdbd" }
transparent-native = { package = "zakura-transparent-native", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "b7fffbbc98d75af5ebc9c9d9da92ca19e9f0fdbd" }
transparent-shard = { package = "zakura-transparent-shard", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "b7fffbbc98d75af5ebc9c9d9da92ca19e9f0fdbd" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
