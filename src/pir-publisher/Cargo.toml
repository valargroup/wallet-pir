[package]
name = "pir-publisher"
version = "0.1.0"
edition = "2021"
publish = false
description = "Configurable host for all Wallet PIR publishers"
autotests = false

[features]
default = []
enhance = ["dep:enhance-publisher"]
status = ["dep:status-publisher"]
transparent = ["dep:transparent-publisher"]
receiver = ["dep:receiver-indexer"]
native-reinspiring = ["enhance-publisher?/native-reinspiring", "status-publisher?/native-reinspiring"]
# The moved Enhance hint cache records whether this build includes CUDA.
cuda = ["enhance-publisher?/cuda"]
# Larger hint oracles. Ordinary correctness leaves this off.
qualification-tests = []
# Wallet-client and chain-fixture regressions. Production features do not enable these.
enhance-tests = [
    "enhance",
    "enhance-publisher/fault-injection",
    "enhance-publisher/fixtures",
    "dep:enhance-query-server",
    "enhance-query-server/client",
    "dep:zakura-server-chain",
    "zakura-server-chain/enhance",
    "zakura-server-chain/testing",
    "dep:zakura-pir-client",
    "zakura-pir-client/enhance",
    "zakura-pir-client/testing",
]
status-tests = ["status", "status-publisher/fixtures"]
transparent-tests = [
    "transparent",
    "transparent-publisher/fixtures",
    "dep:transparent-query-server",
    "dep:transparent-shared",
    "transparent-shared/test-support",
    "dep:zakura-server-chain",
    "zakura-server-chain/transparent",
    "zakura-server-chain/testing",
    "dep:zakura-pir-client",
    "zakura-pir-client/transparent",
    "zakura-pir-client/testing",
    "dep:zakura-pir-publisher",
    "zakura-pir-publisher/transparent",
    "dep:zakura-pir-protocol",
    "zakura-pir-protocol/transparent",
    "reqwest/blocking",
]

[dependencies]
enhance-publisher = { path = "../enhance/enhance-publisher", optional = true }
status-publisher = { path = "../status/status-publisher", optional = true }
transparent-publisher = { path = "../transparent/transparent-publisher", optional = true }
receiver-indexer = { path = "../receiver/receiver-indexer", optional = true }
# Test binaries and host regressions. Production builds leave these off.
enhance-query-server = { path = "../enhance/enhance-query-server", optional = true }
transparent-query-server = { path = "../transparent/transparent-query-server", optional = true }
transparent-shared = { path = "../transparent/transparent-shared", optional = true }
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2f87e6f235dc16840be1dd7fc88e6dd06f0a268", default-features = false, optional = true }
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2f87e6f235dc16840be1dd7fc88e6dd06f0a268", default-features = false, optional = true }
zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2f87e6f235dc16840be1dd7fc88e6dd06f0a268", default-features = false, optional = true }
zakura-pir-protocol = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2f87e6f235dc16840be1dd7fc88e6dd06f0a268", default-features = false, optional = true }
pir-pipeline = { path = "../shared/pir-pipeline" }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "enhance-pir-server-test"
path = "../enhance/enhance-publisher/src/bin/server.rs"
required-features = ["enhance-tests"]
test = false

[[bin]]
name = "transparent-publish-controller-test"
path = "../transparent/transparent-publisher/src/bin/transparent-publish-controller.rs"
required-features = ["transparent-tests"]
test = false

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
libc = "0.2"
tokio-stream = "0.1"

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[test]]
name = "boundary_recovery_model"
path = "tests/boundary_recovery_model.rs"
required-features = ["enhance-tests"]

[[test]]
name = "canonical_record"
path = "tests/canonical_record.rs"
required-features = ["enhance-tests"]

[[test]]
name = "ci_hint"
path = "tests/ci_hint.rs"
required-features = ["enhance-tests"]

[[test]]
name = "encrypted_lifecycle"
path = "tests/encrypted_lifecycle.rs"
required-features = ["enhance-tests"]

[[test]]
name = "enhance_wallet_native"
path = "tests/enhance_wallet_native.rs"
required-features = ["enhance-tests", "native-reinspiring"]

[[test]]
name = "http"
path = "tests/http.rs"
required-features = ["enhance-tests"]

[[test]]
name = "note_recovery"
path = "tests/note_recovery.rs"
required-features = ["enhance-tests"]

[[test]]
name = "packing_http"
path = "tests/packing_http.rs"
required-features = ["enhance-tests"]

[[test]]
name = "record_layout"
path = "tests/record_layout.rs"
required-features = ["enhance-tests"]

[[test]]
name = "row_repair_http"
path = "tests/row_repair_http.rs"
required-features = ["enhance-tests"]

[[test]]
name = "rpc"
path = "tests/rpc.rs"
required-features = ["enhance-tests"]

[[test]]
name = "status_routes"
path = "tests/status_routes.rs"
required-features = ["enhance-tests"]

[[test]]
name = "controller_update_campaign"
path = "tests/controller_update_campaign.rs"
required-features = ["transparent-tests"]

[[test]]
name = "event_codec_bounds"
path = "tests/event_codec_bounds.rs"
required-features = ["transparent-tests"]

[[test]]
name = "service_round_trip"
path = "tests/service_round_trip.rs"
required-features = ["transparent-tests"]

[[test]]
name = "shard_filters"
path = "tests/shard_filters.rs"
required-features = ["transparent-tests"]

[[test]]
name = "unified_http_sync_campaign"
path = "tests/unified_http_sync_campaign.rs"
required-features = ["transparent-tests"]
