[package]
name = "pir-publisher"
version = "0.1.0"
edition = "2021"
publish = false
description = "Configurable host for all Wallet PIR publishers"
autotests = false

[features]
default = []
enhance = ["dep:enhance-publisher", "chain"]
status = ["dep:status-publisher", "status-publisher/cli", "chain"]
transparent-history = ["dep:transparent-publisher", "chain"]
transparent-detail = ["dep:transparent-publisher", "chain"]
# The root chain follower shared by every scheduled product: node transport
# only, never chain decoding.
chain = ["dep:pir-node-rpc"]
rocksdb-reader = ["transparent-history", "transparent-publisher/rocksdb-reader"]
receiver = ["dep:receiver-indexer", "chain"]
native-reinspiring = ["enhance-publisher?/native-reinspiring", "status-publisher?/native-reinspiring"]
status-tests = ["status", "status-publisher/fixtures"]

[dependencies]
enhance-publisher = { path = "../enhance/enhance-publisher", optional = true }
status-publisher = { path = "../status/status-publisher", optional = true }
transparent-publisher = { path = "../transparent/transparent-publisher", optional = true }
receiver-indexer = { path = "../receiver/receiver-indexer", optional = true }
pir-pipeline = { path = "../shared/pir-pipeline" }
pir-node-rpc = { path = "../shared/pir-node-rpc", optional = true }
pir-service-discovery = { version = "1.0.0", path = "../shared/pir-service-discovery" }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
hex = "0.4"
zakura-server-chain = { path = "../shared/pir-chain", default-features = false, features = ["receiver", "testing-node"] }
pir-publication = { path = "../shared/pir-publication", features = ["test-support"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[test]]
name = "commands"
path = "tests/commands.rs"

[[test]]
name = "receiver"
path = "tests/receiver.rs"
required-features = ["receiver"]
