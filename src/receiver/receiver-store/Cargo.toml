[package]
name = "receiver-store"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "The receiver indexer's SQLite coverage store and provider store"

[dependencies]
# Receiver formats and the payment table and block filter builders.
zakura-pir-publisher = { version = "=0.0.1-rc2", default-features = false, features = ["receiver"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"


[dev-dependencies]
hex = "0.4"
tempfile = "3"
