[package]
name = "receiver-store"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "The receiver indexer's SQLite coverage store and provider store"

[dependencies]
# Receiver payment, record and block hint types.
zakura-pir-publisher = { version = "=0.0.1-rc4", default-features = false, features = ["receiver"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"


[dev-dependencies]
hex = "0.4"
tempfile = "3"
