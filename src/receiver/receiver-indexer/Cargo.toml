[package]
name = "receiver-indexer"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Indexes zero-OVK Ironwood payments from a Zakura node and publishes the receiver directory"

[[bin]]
name = "receiver-directory"
path = "src/main.rs"
# Its documentation would collide with the `receiver-directory` library's.
doc = false

[[bin]]
name = "receiver-probe"
path = "src/bin/receiver-probe.rs"

[features]
# Restore the multi-publication sealing campaigns that prepare many PIR tables.
qualification-tests = []

[dependencies]
pir-pipeline = { path = "../../shared/pir-pipeline" }
pir-publication = { path = "../../shared/pir-publication" }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
receiver-store = { path = "../receiver-store" }
receiver-pir-server = { path = "../receiver-pir-server" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Receiver formats, publication building, witness paths and address, record,
# recovery and proof checks from one exact wallet-libraries revision; node reads
# and block interpretation from the shared chain reader, which uses the same
# revision. The evaluator prepares sessions, and the probe reads as a wallet.
zakura-pir-publisher = { version = "=0.0.1-rc2", default-features = false, features = ["receiver-crypto"] }
zakura-pir-query-server = { version = "=0.0.1-rc2", default-features = false, features = ["receiver"] }
zakura-pir-client = { version = "=0.0.1-rc2", default-features = false, features = ["receiver"] }
zakura-server-chain = { path = "../../shared/pir-chain", default-features = false, features = ["receiver", "rpc"] }


[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
zakura-server-chain = { path = "../../shared/pir-chain", default-features = false, features = ["receiver", "testing-node"] }
