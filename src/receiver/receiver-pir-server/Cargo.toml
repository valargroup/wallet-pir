[package]
name = "receiver-pir-server"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Receiver PIR serving with immutable publications and atomic session revocation"

# A serving library only: pir-query-server is the entrypoint.
autobins = false
[dependencies]
receiver-pir = { package = "zakura-receiver-pir", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2", features = ["server"] }
receiver-directory = { package = "zakura-receiver-directory", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2" }
axum = "0.7"
hex = "0.4"
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
pir-observability = { path = "../../shared/pir-observability", features = ["http"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }


[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net"] }
