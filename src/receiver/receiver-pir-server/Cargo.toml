[package]
name = "receiver-pir-server"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Receiver PIR serving with immutable publications and atomic session revocation"

# A serving library only: pir-query-server is the entrypoint.
autobins = false
[dependencies]
# Receiver formats, sessions and the evaluator; serving needs nothing from the publisher.
zakura-pir-query-server = { version = "=0.0.1-rc2", default-features = false, features = ["receiver"] }
axum = "0.7"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
pir-publication = { path = "../../shared/pir-publication" }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[features]
# Publication sequences that prepare another session only to assert one more
# property. Fast keeps one stale-anchor revocation and one encrypted query.
qualification-tests = []

[dev-dependencies]
tempfile = "3"
# Tests build publications and query them as a wallet does.
zakura-pir-publisher = { version = "=0.0.1-rc2", default-features = false, features = ["receiver"] }
zakura-pir-client = { version = "=0.0.1-rc2", default-features = false, features = ["receiver"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["io-util", "macros", "net"] }
