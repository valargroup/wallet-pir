[package]
name = "receiver-pir-server"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Receiver PIR serving with immutable publications and atomic session revocation"

[dependencies]
receiver-pir = { package = "zakura-receiver-pir", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f3a19e5b7b0a51f28bf81d2fc1c4b114c8c1a0d8", features = ["server"] }
receiver-directory = { package = "zakura-receiver-directory", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f3a19e5b7b0a51f28bf81d2fc1c4b114c8c1a0d8" }
axum = "0.7"
hex = "0.4"
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
pir-observability = { path = "../../shared/pir-observability" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net"] }
