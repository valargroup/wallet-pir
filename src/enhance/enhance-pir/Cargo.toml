[package]
name = "enhance-pir"
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "Client and protocol types for private retrieval of Ironwood note enhancement records"
documentation = "https://docs.rs/enhance-pir"
readme = "README.md"
keywords = ["pir", "zcash", "privacy"]

[lib]
name = "enhance_pir"
path = "src/lib.rs"

[[bin]]
name = "enhance-pir-cli"
path = "src/bin/client.rs"
required-features = ["cli"]

[features]
default = []
native-reinspiring = ["dep:pir-native", "dep:reinspiring", "dep:rand_chacha", "ipir-sp/native-reinspiring"]
cli = ["dep:clap", "dep:tokio"]

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"], optional = true }
hex = "0.4"
ipir-sp = { version = "=0.1.0-rc.7", git = "https://github.com/valargroup/ipir-sp", rev = "1d637dba8a9e6dcf749a2054e33ea8ff03fac8c9" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }

reinspiring = { version = "=0.1.3-rc.1", git = "https://github.com/valargroup/ipir-sp", rev = "1d637dba8a9e6dcf749a2054e33ea8ff03fac8c9", optional = true }
rand_chacha = {version="0.3", optional=true}
pir-native = { package = "zakura-pir-native", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "63d31b4486dffe60982c395fffb40e9a02497008", optional = true }
