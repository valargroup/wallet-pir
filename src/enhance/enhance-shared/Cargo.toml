[package]
name = "enhance-shared"
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
description = "Enhance PIR material and contracts shared by the Enhance publisher and query server: records, protocol, publication contract, prepared runtimes and evaluation"
publish = false

[features]
# Restore the larger ordinary-domain test campaigns during full qualification.
qualification-tests = []
default = []
native-reinspiring = ["pir-serving/native-reinspiring", "dep:zakura-pir-query-server", "dep:reinspiring", "dep:rand_chacha", "dep:rayon", "ipir-sp/native-reinspiring"]
cuda = ["dep:pir-cuda", "pir-cuda/cuda"]
# Wallet-side query preparation, transport and decoding for diagnostics and wire tests.
client = ["dep:zakura-pir-client", "dep:reqwest"]
# Injected kernel faults and synthetic records for the query server's own regressions.
test-support = ["dep:simplepir-kernel", "dep:tempfile"]

[dependencies]
pir-cuda = { path = "../../shared/pir-cuda", optional = true }
pir-control = { path = "../../shared/pir-control" }
pir-publication = { path = "../../shared/pir-publication" }
pir-runtime = { path = "../../shared/pir-runtime" }
pir-serving = { path = "../../shared/pir-serving" }
reinspiring = { version = "=0.1.3-rc.1", optional = true }
rand_chacha = { version = "0.3", optional = true }
rayon = { version = "1.10", optional = true }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
inspiring = "=0.1.0-rc.3"
ipir-sp = "=0.1.0-rc.7"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
simplepir-kernel = { version = "=0.1.0-rc.4", optional = true }
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"

zakura-pir-query-server = { version = "=0.0.1-rc2", default-features = false, features = ["enhance"], optional = true }
zakura-pir-client = { version = "=0.0.1-rc2", default-features = false, features = ["native"], optional = true }

[dev-dependencies]
simplepir-kernel = "=0.1.0-rc.4"
tempfile = "3"
zakura-pir-client = { version = "=0.0.1-rc2", default-features = false, features = ["native"] }

[dev-dependencies.enhance-shared]
path = "."
features = ["client"]
