[package]
name = "enhance-query-server"
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "Enhance PIR workers, packing routers, query ingress and publication synchronization; no publication, chain reading or ingestion"
publish = false

# A serving library only: pir-query-server is the entrypoint.
autobins = false
[features]
# Restore the larger ordinary-domain test campaigns during full qualification.
qualification-tests = ["enhance-shared/qualification-tests"]
default = []
native-reinspiring = ["enhance-shared/native-reinspiring"]
cuda = ["enhance-shared/cuda"]

client = ["enhance-shared/client"]
[dependencies]
enhance-shared = { path = "../enhance-shared" }
pir-observability = { path = "../../shared/pir-observability", features = ["http"] }
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
pir-runtime = { path = "../../shared/pir-runtime" }
pir-publication = { path = "../../shared/pir-publication" }
pir-sync-manager = { path = "../../shared/pir-sync-manager" }
axum = "0.7"
hex = "0.4"
memmap2 = "0.9"
hdrhistogram = "7"
http-body = "1"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"

[dev-dependencies]
# Injected kernel faults and synthetic records drive the role regressions.
enhance-shared = { path = "../enhance-shared", features = ["test-support"] }
tempfile = "3"
# Paused time drives the recovery cadence regressions.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }


[dev-dependencies.enhance-query-server]
path = "."
features = ["client"]
