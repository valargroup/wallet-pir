[package]
name = "enhance-query-server"
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "Enhance PIR protocol, client, prepared runtimes, workers and public query serving; no publication, chain reading or ingestion"
publish = false

[features]
# Restore the larger ordinary-domain test campaigns during full qualification.
qualification-tests = []
default = []
native-reinspiring = ["pir-serving/native-reinspiring", "dep:zakura-pir-query-server", "dep:reinspiring", "dep:rand_chacha", "ipir-sp/native-reinspiring"]
cuda = ["dep:pir-cuda", "pir-cuda/cuda"]

client = ["dep:zakura-pir-client"]
[dependencies]
pir-cuda = { path = "../../shared/pir-cuda", optional = true }
pir-observability = { path = "../../shared/pir-observability" }
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
pir-runtime = { path = "../../shared/pir-runtime" }
pir-serving = { path = "../../shared/pir-serving" }
reinspiring = { version = "=0.1.3-rc.1", optional = true }
rand_chacha = { version = "0.3", optional = true }
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
hdrhistogram = "7"
http-body = "1"
inspiring = "=0.1.0-rc.3"
ipir-sp = "=0.1.0-rc.7"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"

zakura-pir-query-server = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2f87e6f235dc16840be1dd7fc88e6dd06f0a268", default-features = false, features = ["enhance"], optional = true }
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2f87e6f235dc16840be1dd7fc88e6dd06f0a268", default-features = false, features = ["native"], optional = true }

[dev-dependencies]
simplepir-kernel = "=0.1.0-rc.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "a2f87e6f235dc16840be1dd7fc88e6dd06f0a268", default-features = false, features = ["native"] }


[dev-dependencies.enhance-query-server]
path = "."
features = ["client"]
