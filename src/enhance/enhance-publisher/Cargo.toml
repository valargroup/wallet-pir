[package]
name = "enhance-publisher"
version = "0.0.1"
edition = "2021"
description = "Enhance PIR publication owner: chain reading, journals, durable control state, preparation, activation and recovery; hosted by pir-publisher"
publish = false

autobins = false

[lib]
name = "enhance_publisher"
path = "src/lib.rs"

[features]
qualification-tests = []
default = []
native-reinspiring = ["enhance-query-server/native-reinspiring", "dep:zakura-pir-publisher", "dep:reinspiring", "ipir-sp/native-reinspiring"]
# Exposes the journal's injected I/O failure to the host's Enhance regressions.
fault-injection = []
# Widens private helpers for those regressions. Production builds leave it off.
fixtures = []
# In-process packing router and query ingress for tools and tests that drive
# wallet traffic. Production runs those roles as pir-query-server processes.
local-serving = []

[dependencies]
pir-pipeline = { path = "../../shared/pir-pipeline" }
# Query serving, which the publisher composes with chain reading and ingestion.
enhance-query-server = { path = "../enhance-query-server" }
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
reinspiring = { version = "=0.1.3-rc.1", optional = true }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Node reads, Enhance extraction, fees and Status chain reads, from the shared
# chain reader.
zakura-server-chain = { path = "../../shared/pir-chain", default-features = false, features = ["enhance", "rpc"] }

zakura-pir-publisher = { version = "=0.0.1-rc2", default-features = false, features = ["enhance"], optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
