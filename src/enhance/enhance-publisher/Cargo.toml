[package]
name = "enhance-publisher"
version = "0.0.1"
edition = "2021"
description = "Enhance PIR publication owner: chain reading, journals, durable control state, preparation, activation and recovery; hosts the enhance-pir-server service"
publish = false

[lib]
name = "enhance_publisher"
path = "src/lib.rs"

[[bin]]
name = "enhance-pir-server"
path = "src/bin/server.rs"

[features]
default = []
native-reinspiring = ["enhance-query-server/native-reinspiring", "status-query-server/native-reinspiring", "status-publisher/native-reinspiring", "dep:pir-native", "dep:reinspiring", "ipir-sp/native-reinspiring"]
cuda = ["enhance-query-server/cuda", "status-query-server/cuda", "status-publisher/cuda", "ipir-sp/cuda"]
# Exposes the journal's injected I/O failure to the ingest integration tests.
fault-injection = []

[dependencies]
pir-pipeline = { path = "../../shared/pir-pipeline" }
# Query serving, which the publisher composes with chain reading and ingestion.
enhance-query-server = { path = "../enhance-query-server" }
status-query-server = { path = "../../status/status-query-server" }
# Status observation and publication, which the coordinator can host.
status-publisher = { path = "../../status/status-publisher" }
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
reinspiring = { version = "=0.1.3-rc.1", optional = true }
pir-native = { package = "zakura-pir-native", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "68315eac8aa6dfc018c79a48b90ff51460caaee8", optional = true }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Node reads, Enhance extraction, fees and Status chain reads, pinned to an exact
# wallet-libraries revision.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "68315eac8aa6dfc018c79a48b90ff51460caaee8", default-features = false, features = ["enhance"] }

[dev-dependencies]
# Independent Status client for the real HTTP runtime regression.
zakura-pir-status = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "68315eac8aa6dfc018c79a48b90ff51460caaee8" }
enhance-publisher = { path = ".", features = ["fault-injection"] }
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "68315eac8aa6dfc018c79a48b90ff51460caaee8", default-features = false, features = ["enhance", "testing"] }
# Independent wallet Enhance client, which is native-only, and the synthetic
# Ironwood output fixture that authenticates PIR-returned records.
zakura-pir-enhance = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "68315eac8aa6dfc018c79a48b90ff51460caaee8", default-features = false, features = ["testing"] }
tempfile = "3"
libc = "0.2"
# Used only by integration tests and examples.
inspiring = "=0.1.0-rc.3"
rayon = "1"
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "cuda_domain"
required-features = ["cuda"]

[[example]]
name = "native_certificate"
required-features = ["native-reinspiring"]
