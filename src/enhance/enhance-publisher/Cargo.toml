[package]
name = "enhance-publisher"
version = "0.0.1"
edition = "2021"
description = "Enhance PIR publication owner: chain reading, journals, durable control state, preparation, activation and recovery; pir-publisher hosts the enhance-pir-server service"
publish = false

[lib]
name = "enhance_publisher"
path = "src/lib.rs"

[features]
qualification-tests = []
default = []
native-reinspiring = ["enhance-query-server/native-reinspiring", "dep:zakura-pir-publisher", "dep:reinspiring", "ipir-sp/native-reinspiring"]
# Exposes the journal's injected I/O failure to the host's Enhance regressions.
fault-injection = []
# Widens private helpers for those regressions. Production builds leave it off.
fixtures = []

[dependencies]
pir-pipeline = { path = "../../shared/pir-pipeline" }
# Query serving, which the publisher composes with chain reading and ingestion.
enhance-query-server = { path = "../enhance-query-server" }
pir-control = { path = "../../shared/pir-control", features = ["admission"] }
reinspiring = { version = "=0.1.3-rc.1", optional = true }
axum = "0.7"
hex = "0.4"
ipir-sp = "=0.1.0-rc.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
# Node reads, Enhance extraction, fees and Status chain reads, pinned to an exact
# wallet-libraries revision.
zakura-server-chain = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2", default-features = false, features = ["enhance", "rpc"] }

zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f48b62b80ec7d9d7fb7893401435a24b189b8ec2", default-features = false, features = ["enhance"], optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
